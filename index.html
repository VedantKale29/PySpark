M.push({
code: 'R1', track: 'Track R · Streaming', theory: true,
title: 'Structured Streaming: the model',
sub: 'An unbounded table with the same API — and micro-batch as what actually runs.',
lede: 'Structured Streaming\u2019s central idea is that a stream is a table that keeps growing, and a streaming query is the same query you would write over a static table. The API is identical; what changes is that the query runs repeatedly, keeps state between runs, and must decide what to do about data that arrives late.',
ex: [
 { t: 'A streaming job is the batch job plus three decisions', ref: true,
   code: "stream = (spark.readStream\n          .schema(schema)                       # REQUIRED \u2014 no inference on a stream\n          .format('kafka')\n          .option('subscribe', 'transfers')\n          .load())\n\nagg = (stream\n       .withWatermark('ts', '10 minutes')      # 1. how late is too late\n       .groupBy(window(col('ts'), '5 minutes'), col('src_wallet'))\n       .agg(count('*').alias('n'), sum('amount_usd').alias('vol')))\n\nquery = (agg.writeStream\n         .outputMode('append')                 # 2. what to emit each batch\n         .option('checkpointLocation', 's3://lake/_checkpoints/vol')  # 3. state\n         .trigger(processingTime='1 minute')\n         .toTable('silver.transfer_volume'))",
   note: 'The transformation in the middle is identical to the batch version. The three additions — watermark, output mode, checkpoint location — are the entire difference, and the checkpoint is not optional: without it there is no exactly-once and no recovery.' },
 { t: 'Triggers', ref: true,
   code: ".trigger(processingTime='1 minute')   # micro-batch on a fixed interval\n.trigger(availableNow=True)           # process everything available, then stop\n.trigger(once=True)                    # deprecated; use availableNow\n.trigger(continuous='1 second')        # experimental, very limited operator support\n# default (no trigger)                 # next batch starts as soon as the last ends",
   note: 'availableNow is the underrated one: it gives you streaming semantics — checkpointing, exactly-once, incremental progress — on a batch schedule. For most data engineering it is a better default than a continuously running job, because it costs nothing between runs.' }
],
body: [
 { h: 'The three decisions, and why they are the whole topic', html:
   '<table><thead><tr><th>Decision</th><th>Controls</th><th>Get it wrong and\u2026</th></tr></thead><tbody>' +
   '<tr><td><b>Watermark</b></td><td>How late an event may arrive</td><td>Data is silently dropped, or state grows without bound</td></tr>' +
   '<tr><td><b>Output mode</b></td><td>What each batch emits</td><td>The query is rejected, or emits duplicates</td></tr>' +
   '<tr><td><b>Checkpoint</b></td><td>Offsets and state</td><td>No recovery and no exactly-once</td></tr>' +
   '</tbody></table>' },
 { h: 'Output modes', html:
   '<table><thead><tr><th>Mode</th><th>Emits</th><th>Requires</th></tr></thead><tbody>' +
   '<tr><td><b>append</b></td><td>Only rows that will never change again</td><td>A watermark, for aggregations</td></tr>' +
   '<tr><td><b>update</b></td><td>Rows changed in this batch</td><td>A sink that can upsert</td></tr>' +
   '<tr><td><b>complete</b></td><td>The entire result table, every batch</td><td>Bounded state \u2014 never for an unbounded key space</td></tr>' +
   '</tbody></table>' +
   '<p>The common error: an aggregation in append mode with no watermark is rejected at plan time, because Spark cannot know when a window is final. The error message names the watermark, which makes this one of the friendlier failures.</p>' },
 { h: 'The checkpoint', html:
   '<p>The checkpoint directory holds the source offsets processed, the aggregation state, and a write-ahead log of committed batches. Together those give exactly-once end-to-end, provided the sink is idempotent or transactional.</p>' +
   '<p>Two operational facts worth knowing: <strong>a checkpoint is tied to the query plan</strong>, so changing the aggregation often means the checkpoint cannot be reused; and <strong>deleting a checkpoint means reprocessing from the source\u2019s earliest available offset</strong>, which on Kafka may be nothing at all if retention has passed.</p>' }
],
call: '"A streaming query is the batch query plus three decisions \u2014 watermark, output mode and checkpoint location. For most data engineering I reach for trigger availableNow, because it gives streaming semantics and exactly-once on a batch schedule without paying for a cluster between runs."',
warn: 'The checkpoint is bound to the query plan. Changing an aggregation and restarting against the same checkpoint usually fails, and deleting the checkpoint restarts from the source\'s earliest offset — which on a Kafka topic past its retention means silently losing everything in between.',
qf: [
 ['What is the Structured Streaming model?', 'A stream is an unbounded table; the query is the same one you would write over a static table, run repeatedly with state.'],
 ['What are the three streaming-specific decisions?', 'The watermark, the output mode, and the checkpoint location.'],
 ['Name the output modes.', 'Append (only finalised rows), update (rows changed this batch), complete (the whole result table).'],
 ['Why does an aggregation in append mode need a watermark?', 'Without one Spark cannot know when a window is final, so it cannot emit.'],
 ['What does trigger availableNow give you?', 'Streaming semantics — checkpointing, exactly-once, incremental progress — on a batch schedule.'],
 ['What does the checkpoint hold?', 'Source offsets, aggregation state, and a commit log — and it is tied to the query plan.']
]});

M.push({
code: 'R2', track: 'Track R · Streaming', theory: true,
title: 'Windows, watermarks, joins and state',
sub: 'Where streaming state comes from, why it grows, and what bounds it.',
lede: 'Every stateful streaming operation \u2014 an aggregation, a deduplication, a stream-to-stream join \u2014 keeps data in memory between batches. The watermark is what tells Spark when it may throw that state away. Sizing it is therefore not just a completeness decision; it is the thing standing between you and unbounded memory growth.',
ex: [
 { t: 'Windows and the watermark that bounds them', ref: true,
   code: "from pyspark.sql.functions import window, session_window\n\n# tumbling \u2014 fixed, non-overlapping\n.groupBy(window(col('ts'), '5 minutes'))\n\n# sliding \u2014 5-minute window computed every 1 minute (5x the state)\n.groupBy(window(col('ts'), '5 minutes', '1 minute'))\n\n# session \u2014 gap-defined, the fraud-relevant one\n.groupBy(session_window(col('ts'), '30 minutes'), col('src_wallet'))\n\n# the watermark is what lets state be released\n.withWatermark('ts', '10 minutes')\n#   -> a 5-minute window is finalised 10 minutes after its end,\n#      then its state is dropped and (in append mode) the row is emitted",
   note: 'A sliding window that advances every minute over a five-minute span keeps five times the state of a tumbling one, because each event belongs to five windows. That multiplier is the most common cause of unexpected streaming memory growth.' },
 { t: 'Stream-to-stream joins need watermarks on both sides', ref: true,
   code: "transfers.withWatermark('ts', '10 minutes').alias('t').join(\n    alerts.withWatermark('raised_on', '30 minutes').alias('a'),\n    expr('''\n        t.src_wallet = a.wallet_id AND\n        a.raised_on BETWEEN t.ts AND t.ts + INTERVAL 1 HOUR\n    '''),\n    'inner')\n\n# Without the time-range condition Spark must keep BOTH streams forever,\n# because any future row could still match. The range bounds the state.",
   note: 'A stream-to-stream join needs a watermark on both sides and a time-range condition. Without the range there is no point at which a row can be discarded, so state grows without limit and the job dies days later — long after the deploy that caused it.' }
],
body: [
 { h: 'What holds state', html:
   '<table><thead><tr><th>Operation</th><th>State held</th><th>Released by</th></tr></thead><tbody>' +
   '<tr><td>Windowed aggregation</td><td>One entry per open window per key</td><td>Watermark passing the window end</td></tr>' +
   '<tr><td>dropDuplicates on a stream</td><td>Every key seen</td><td>Watermark \u2014 <em class="hl">and only if you set one</em></td></tr>' +
   '<tr><td>Stream-to-stream join</td><td>Buffered rows from both sides</td><td>Watermark plus a time-range condition</td></tr>' +
   '<tr><td>flatMapGroupsWithState</td><td>Whatever you put there</td><td>Your own timeout logic</td></tr>' +
   '<tr><td>Stream-to-static join</td><td>None \u2014 the static side is re-read</td><td>n/a</td></tr>' +
   '</tbody></table>' +
   '<p>Stream-to-static is the cheap one and covers most enrichment: joining a stream to a dimension table holds no state at all. Reach for it before a stream-to-stream join.</p>' },
 { h: 'Sizing the watermark', html:
   '<p>Measure the lateness distribution of the source and set the watermark at roughly the p99, then monitor what falls outside it. Do not pick a round number. The AWS bench K3 module computes the trade explicitly: with exponentially distributed lateness averaging five minutes, a ten-minute watermark drops about 13.5% of events, and going to sixty minutes buys you almost nothing more.</p>' +
   '<div class="pre">too short   silent data loss, and the numbers are quietly low forever\ntoo long    latency, and state that does not fit in memory\nunset       state grows without bound \u2014 the job dies eventually</div>' },
 { h: 'Operational realities', html:
   '<ul>' +
   '<li><strong>Late data is dropped silently.</strong> Emit a metric for it, or you will never know. There is no error and no failed task.</li>' +
   '<li><strong>RocksDB state store</strong> is the answer when state exceeds executor memory \u2014 it spills to disk instead of failing.</li>' +
   '<li><strong>Micro-batches produce small files.</strong> A one-minute trigger writing to a partitioned table produces 1,440 files per partition per day. Compaction is a scheduled job, not optional.</li>' +
   '<li><strong>Consumer lag is the primary health metric</strong>, not CPU or memory. Rising lag means you are falling behind regardless of what the cluster looks like.</li>' +
   '</ul>' }
],
call: '"The watermark is what bounds state, not just what decides completeness \u2014 a stream-to-stream join with no time-range condition can never release a row, so state grows until the job dies days after the deploy. I size the watermark against measured p99 lateness and emit a metric for what falls outside it."',
warn: 'dropDuplicates on a stream without a watermark keeps every key it has ever seen, forever. It looks correct for weeks and then the job dies with an OOM that points at the state store rather than at the deduplication.',
qf: [
 ['What bounds streaming state?', 'The watermark — it tells Spark when a window or buffered row can be discarded.'],
 ['Why is a sliding window expensive?', 'Each event belongs to several overlapping windows, multiplying the state held.'],
 ['What does a stream-to-stream join need?', 'A watermark on both sides and a time-range condition, or state can never be released.'],
 ['Which join holds no state?', 'Stream-to-static — the static side is simply re-read.'],
 ['What happens to late data?', 'It is dropped silently. Emit a metric or you will never know.'],
 ['What is the primary health metric for a streaming job?', 'Consumer lag — rising lag means falling behind regardless of cluster utilisation.']
]});

M.push({
code: 'R3', track: 'Track R · Streaming', theory: true,
title: 'Kafka and delivery semantics',
sub: 'Partitions, offsets, consumer groups — and what exactly-once really promises.',
lede: 'Kafka is the default streaming substrate outside AWS and increasingly inside it via MSK. Its model is a partitioned, ordered, replayable log, and three properties of that model determine everything about how you consume it: ordering is per partition, position is an offset you control, and parallelism is capped by partition count.',
ex: [
 { t: 'The mental model', ref: true,
   code: "topic 'transfers'\n  partition 0 : [0][1][2][3][4] ...        ordered WITHIN the partition\n  partition 1 : [0][1][2] ...\n  partition 2 : [0][1][2][3] ...\n\n  * the partition key hashes to a partition -> same key, same partition, ordered\n  * an offset is a position; consumers commit theirs, so they can replay\n  * a consumer group divides partitions across its members\n  * MAX PARALLELISM = PARTITION COUNT. More consumers than partitions idle.\n\n# Spark reads Kafka with one task per partition\n(spark.readStream.format('kafka')\n   .option('subscribe', 'transfers')\n   .option('startingOffsets', 'latest')      # or 'earliest', or explicit JSON\n   .option('maxOffsetsPerTrigger', 100000)   # backpressure \u2014 cap batch size\n   .load())",
   note: 'maxOffsetsPerTrigger is the setting people discover after their first incident: restarting a job with startingOffsets=earliest on a large topic pulls the entire backlog into one micro-batch and the executors die. Capping the batch size is what makes catch-up survivable.' }
],
body: [
 { h: 'The guarantees, precisely', html:
   '<ul>' +
   '<li><strong>Ordering is per partition, not per topic.</strong> If you need per-entity ordering, the entity id is the partition key \u2014 and you accept the skew that comes with a hot entity.</li>' +
   '<li><strong>Retention is time or size based</strong>, not consumption based. A message is not deleted when it is read, which is what makes replay possible \u2014 and what makes a slow consumer past the retention window lose data permanently.</li>' +
   '<li><strong>A consumer group member owns whole partitions.</strong> Adding consumers beyond the partition count adds idle consumers, not throughput.</li>' +
   '<li><strong>Rebalancing pauses consumption</strong> while partitions are reassigned, which is why consumer churn shows up as lag spikes.</li>' +
   '</ul>' },
 { h: 'Delivery semantics', html:
   '<table><thead><tr><th>Guarantee</th><th>Means</th><th>Cost</th></tr></thead><tbody>' +
   '<tr><td>At-most-once</td><td>May lose, never duplicates</td><td>Commit the offset before processing \u2014 rarely acceptable</td></tr>' +
   '<tr><td>At-least-once</td><td>Never loses, may duplicate</td><td>Commit after processing \u2014 the practical default</td></tr>' +
   '<tr><td>Exactly-once</td><td>Each event affects state once</td><td>Checkpointed offsets plus an idempotent or transactional sink</td></tr>' +
   '</tbody></table>' +
   '<p>The precise statement, and the one that earns marks: <strong>exactly-once is a property of state updates, not of message delivery.</strong> The network delivers at least once; the system achieves exactly-once by making the effect idempotent. In Spark that is the checkpoint plus a sink that can deduplicate \u2014 which is the same idempotency-key argument as everywhere else in these benches.</p>' },
 { h: 'Kafka versus Kinesis, briefly', html:
   '<table><thead><tr><th></th><th>Kafka / MSK</th><th>Kinesis Data Streams</th></tr></thead><tbody>' +
   '<tr><td>Unit of parallelism</td><td>Partition</td><td>Shard</td></tr>' +
   '<tr><td>Retention</td><td>Configurable, disk-bound</td><td>24 h to 365 days</td></tr>' +
   '<tr><td>Ops burden</td><td>Real Kafka operations</td><td>Managed; shard management only</td></tr>' +
   '<tr><td>Ecosystem</td><td>Connect, Streams, huge</td><td>AWS-native integrations</td></tr>' +
   '</tbody></table>' +
   '<p>Choose Kafka when you need the ecosystem or portability; choose Kinesis when you want the AWS integration and less to operate. The concepts map almost one to one, which is why learning one gives you most of the other.</p>' }
],
call: '"Kafka gives ordering per partition, not per topic, and parallelism is capped at the partition count \u2014 so the partition key decides both ordering and skew, and you cannot optimise both. Exactly-once is a property of state updates rather than delivery: checkpointed offsets plus an idempotent sink."',
warn: 'Restarting a streaming job with startingOffsets=earliest on a large topic pulls the entire backlog into a single micro-batch. Set maxOffsetsPerTrigger before you need it, not after the executors die during your first catch-up.',
qf: [
 ['What ordering does Kafka guarantee?', 'Per partition, not per topic.'],
 ['What caps consumer parallelism?', 'The partition count — extra consumers in a group sit idle.'],
 ['What is an offset?', 'A consumer\'s position in a partition; committing it is what allows replay and recovery.'],
 ['Why does a slow consumer risk data loss?', 'Retention is time or size based, so messages expire whether or not they were read.'],
 ['What does exactly-once actually mean?', 'Each event affects state once — achieved by checkpointed offsets plus an idempotent or transactional sink.'],
 ['What does maxOffsetsPerTrigger protect against?', 'A restart from earliest pulling the whole backlog into one micro-batch.']
]});

M.push({
code: 'O1', track: 'Track O · Production', theory: true,
title: 'Testing Spark and packaging a job',
sub: 'The area interviewers probe most and candidates prepare for least.',
lede: 'A pipeline nobody can test is a pipeline nobody can change. Spark makes testing look hard because a cluster feels like a prerequisite, but the parts worth testing \u2014 the transformations \u2014 are pure functions from DataFrame to DataFrame and need no cluster at all.',
ex: [
 { t: 'Structure transformations so they are testable', ref: true,
   code: "# BAD: reads, transforms and writes in one function \u2014 untestable\ndef run():\n    df = spark.read.parquet('s3://...')\n    out = df.filter(...).groupBy(...).agg(...)\n    out.write.parquet('s3://...')\n\n# GOOD: I/O at the edges, pure transformation in the middle\ndef flag_high_risk(transfers, wallets, threshold=9000):\n    return (transfers\n            .join(broadcast(wallets), 'wallet_id')\n            .filter(col('amount_usd') >= threshold)\n            .groupBy('risk_band')\n            .agg(count('*').alias('n')))\n\ndef run(spark, src, dst):\n    out = flag_high_risk(spark.read.parquet(src), spark.read.table('wallets'))\n    out.write.mode('overwrite').parquet(dst)",
   note: 'The transformation takes DataFrames and returns a DataFrame. It can be tested with five hand-written rows and a local SparkSession in under a second. This single structural change is what makes a Spark codebase testable.' },
 { t: 'The test itself', ref: true,
   code: "import pytest\nfrom chispa import assert_df_equality\n\n@pytest.fixture(scope='session')\ndef spark():\n    return (SparkSession.builder.master('local[2]')\n            .config('spark.sql.shuffle.partitions', '2')   # 200 is absurd locally\n            .config('spark.ui.enabled', 'false')\n            .appName('tests').getOrCreate())\n\ndef test_flags_only_above_threshold(spark):\n    transfers = spark.createDataFrame(\n        [('w-1', 9800.0), ('w-2', 100.0)], 'wallet_id string, amount_usd double')\n    wallets = spark.createDataFrame(\n        [('w-1', 'high'), ('w-2', 'low')], 'wallet_id string, risk_band string')\n\n    result = flag_high_risk(transfers, wallets)\n\n    expected = spark.createDataFrame([('high', 1)], 'risk_band string, n long')\n    assert_df_equality(result, expected, ignore_row_order=True)",
   note: 'shuffle.partitions of 2 is the setting that makes local tests fast — the default of 200 creates 198 empty tasks per shuffle and turns a one-second test suite into a minute. chispa handles DataFrame comparison; without it you are comparing collected lists and writing your own diff.' }
],
body: [
 { h: 'What to test, and at what level', html:
   '<table><thead><tr><th>Level</th><th>Tests</th><th>Needs a cluster?</th></tr></thead><tbody>' +
   '<tr><td><b>Unit</b></td><td>Each transformation with hand-written rows</td><td>No \u2014 local[2]</td></tr>' +
   '<tr><td><b>Edge cases</b></td><td>Nulls, empty DataFrames, duplicates, the skewed key</td><td>No</td></tr>' +
   '<tr><td><b>Integration</b></td><td>Read, transform and write against local paths or a test bucket</td><td>Local or small</td></tr>' +
   '<tr><td><b>Data quality</b></td><td>Assertions on real output \u2014 zero rows means pass</td><td>Runs in the pipeline</td></tr>' +
   '<tr><td><b>Idempotency</b></td><td>Run the load twice, assert the table is identical</td><td>Integration</td></tr>' +
   '</tbody></table>' +
   '<p>That last row is the one almost nobody writes and every reviewer respects. If your load claims to be idempotent, the test that runs it twice and diffs the result is three lines and settles the question.</p>' },
 { h: 'Packaging and submitting', html:
   '<div class="pre code">project/\n  jobs/flag_high_risk.py        <i>entry point</i>\n  lib/transforms.py             <i>pure functions \u2014 the tested part</i>\n  tests/test_transforms.py\n  pyproject.toml\n\nspark-submit \\\n  --master yarn --deploy-mode cluster \\\n  --py-files dist/lib-0.1.0-py3-none-any.whl \\\n  --conf spark.sql.shuffle.partitions=400 \\\n  jobs/flag_high_risk.py --date 2026-02-01</div>' +
   '<p><strong>Cluster mode</strong> runs the driver on the cluster \u2014 correct for production, because the job survives your laptop closing. <strong>Client mode</strong> runs the driver locally, which is right for interactive work and wrong for a scheduled job.</p>' },
 { h: 'CI for a data pipeline', html:
   '<ol>' +
   '<li><strong>Lint and type-check</strong> \u2014 ruff, mypy. Cheap and catches real errors.</li>' +
   '<li><strong>Unit tests on local Spark</strong> \u2014 seconds, no infrastructure.</li>' +
   '<li><strong>Build the wheel</strong> and version it.</li>' +
   '<li><strong>Deploy to a non-production environment</strong> and run against a sample.</li>' +
   '<li><strong>Run data quality assertions</strong> on the output before promoting.</li>' +
   '</ol>' +
   '<p>Terraform handles the infrastructure alongside this. The point to be able to make: a data pipeline is software, and it deserves the same pipeline that application code gets.</p>' }
],
call: '"I keep I/O at the edges and transformations as pure functions from DataFrame to DataFrame, so they test with a handful of hand-written rows on a local session in under a second. And I write an idempotency test that runs the load twice and asserts the table is unchanged \u2014 if the load claims to be idempotent, that claim should be executable."',
warn: 'Leaving spark.sql.shuffle.partitions at 200 in local tests creates 198 empty tasks per shuffle. A suite that should take one second takes a minute, so people stop running it — and an unrun test suite is worse than none, because it looks like coverage.',
qf: [
 ['How do you make a Spark job testable?', 'I/O at the edges; transformations as pure functions taking and returning DataFrames.'],
 ['Do you need a cluster to test?', 'No — a local[2] SparkSession with shuffle.partitions set low.'],
 ['What setting makes local tests fast?', 'spark.sql.shuffle.partitions set to 1 or 2 instead of the default 200.'],
 ['What is the idempotency test?', 'Run the load twice and assert the target table is identical.'],
 ['Cluster mode versus client mode?', 'Cluster runs the driver on the cluster and is correct for production; client runs it locally and is for interactive work.'],
 ['What edge cases should every transformation test?', 'Nulls, empty input, duplicates, and the skewed key.']
]});
