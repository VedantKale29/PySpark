M.push({
code: 'P1', track: 'Track P · Performance', title: 'Caching and reuse',
sub: 'Useful exactly when a DataFrame is read more than once — and harmful otherwise.',
lede: 'Spark recomputes a DataFrame\u2019s entire lineage on every action. Caching stores the computed result so later actions read it instead. That is a large win when a DataFrame is genuinely reused and pure overhead when it is not \u2014 cached data competes with execution memory, and evicted cache is worse than no cache.',
ex: [
 { t: 'Recomputation without caching',
   code: "expensive = spark.table('transfers') \\\n  .join(broadcast(spark.table('wallets')), col('src_wallet') == col('wallet_id')) \\\n  .filter(col('risk_band') == 'high')\nexpensive.count()\nexpensive.show(4)",
   note: 'Two actions, so the join and filter run twice. On this data it is instant; on a real join of two large tables it is the difference between one and two full passes.' },
 { t: 'Marking it for caching',
   code: "expensive = spark.table('transfers') \\\n  .join(broadcast(spark.table('wallets')), col('src_wallet') == col('wallet_id')) \\\n  .filter(col('risk_band') == 'high') \\\n  .cache()\nexpensive.count()\nexpensive.show(4)",
   note: 'The plan now shows InMemoryTableScan. In real Spark cache() is lazy — nothing is stored until an action materialises it, which is why the idiom is to call .cache() then immediately .count() to force it.' },
 { t: 'Caching a narrow chain is usually pointless',
   code: "spark.table('transfers') \\\n  .filter(col('amount_usd') > 1000) \\\n  .cache() \\\n  .show(5)",
   note: 'One action, and the work being cached is a scan plus a filter. Re-reading columnar files with a pushed-down filter is often cheaper than storing and evicting the result. Cache after expensive wide operations, not after cheap narrow ones.' },
 { t: 'Cache the narrowed DataFrame, not the raw table',
   code: "hot = spark.table('transfers') \\\n  .filter(col('is_flagged') == 1) \\\n  .select('txn_id', 'src_wallet', 'amount_usd') \\\n  .cache()\nhot.count()\nhot.groupBy('src_wallet').agg(sum('amount_usd').alias('vol')).orderBy(col('vol').desc()).show()",
   note: 'Filter and project before caching so you store the smallest useful thing. Caching a wide raw table and then selecting three columns from it wastes most of the memory you spent.' }
],
body: [
 { h: 'When caching pays', html:
   '<table><thead><tr><th>Cache</th><th>Do not cache</th></tr></thead><tbody>' +
   '<tr><td>Read by two or more actions</td><td>Read once</td></tr>' +
   '<tr><td>Result of an expensive join or aggregation</td><td>A plain scan plus filter</td></tr>' +
   '<tr><td>Iterative work reusing a base DataFrame</td><td>Anything larger than available memory</td></tr>' +
   '<tr><td>Filtered and projected to something small</td><td>A wide raw table you then narrow</td></tr>' +
   '</tbody></table>' },
 { h: 'Storage levels', html:
   '<div class="pre">MEMORY_AND_DISK      <i>the DataFrame default \u2014 spill instead of recompute</i>\nMEMORY_ONLY          <i>RDD default; silently drops partitions under pressure</i>\nMEMORY_AND_DISK_SER  <i>serialised \u2014 smaller, more CPU</i>\nDISK_ONLY            <i>when recomputation is far more expensive than a disk read</i></div>' +
   '<p><code>cache()</code> is <code>persist(MEMORY_AND_DISK)</code> for DataFrames. Always <code>unpersist()</code> when finished \u2014 cached data holds memory that execution needs, and a long-running job that caches without releasing degrades over time.</p>' },
 { h: 'The alternative nobody mentions', html:
   '<p>For a genuinely expensive intermediate result reused across several jobs, <strong>writing it to disk as Parquet and reading it back</strong> often beats caching: it survives executor loss, does not compete for execution memory, and is readable by other jobs. Caching is for reuse inside one application; a checkpoint or an intermediate table is for reuse across them.</p>' }
],
call: '"Caching helps only when a DataFrame is read by more than one action, and I filter and project before caching so I store the smallest useful thing. For something reused across jobs I write an intermediate Parquet table instead \u2014 it survives executor loss and does not compete with execution memory."',
warn: 'cache() is lazy. Calling it and assuming the data is stored is a common mistake — nothing is materialised until an action runs, so the first action still pays full price, and if that is the only action the cache never helps at all.',
qf: [
 ['When is caching worth it?', 'When a DataFrame is read by two or more actions, and the work being cached is expensive.'],
 ['Is cache() eager or lazy?', 'Lazy — nothing is stored until an action materialises it.'],
 ['What is the default storage level for a cached DataFrame?', 'MEMORY_AND_DISK.'],
 ['Why filter before caching?', 'You store less, leaving more memory for execution.'],
 ['What are the risks of over-caching?', 'Cached data competes with execution memory and can be evicted, making things slower than no cache.'],
 ['Alternative for reuse across jobs?', 'Write an intermediate Parquet table — it survives executor loss and is shareable.']
]});

M.push({
code: 'P2', track: 'Track P · Performance', title: 'Pushdown, pruning and why UDFs hurt',
sub: 'Let Catalyst see your logic — a Python UDF is a black box it cannot optimise.',
lede: 'Catalyst can only optimise what it understands. Built-in functions are expressions in the plan, so they can be reordered, pushed into the scan, and executed in the JVM on columnar batches. A Python UDF is opaque: nothing can be pushed through it, and every row must be serialised out to a Python process and back.',
ex: [
 { t: 'Projection pruning — read only what you name',
   code: "spark.table('transfers').select('txn_id', 'amount_usd').show(5)",
   note: 'The Project step lists two columns. On Parquet the scan reads only those column chunks — the other four are never touched on disk. This is why SELECT * is a cost decision on columnar storage, not a style one.' },
 { t: 'Predicate pushdown — filter at the source',
   code: "spark.table('transfers') \\\n  .filter(col('amount_usd') > 9000) \\\n  .select('txn_id', 'src_wallet', 'amount_usd') \\\n  .show()",
   note: 'A filter on a plain column can be pushed into the Parquet reader, which skips row groups whose min/max statistics cannot match. Wrap that column in a UDF and no statistic can be evaluated — the reader must decode every row first.' },
 { t: 'Built-in expressions stay in the plan',
   code: "spark.table('transfers') \\\n  .withColumn('band', when(col('amount_usd') >= 9000, 'near-threshold')\n                      .when(col('amount_usd') >= 1000, 'large')\n                      .otherwise('small')) \\\n  .groupBy('band').agg(count('*').alias('n')) \\\n  .show()",
   note: 'This banding logic is a Catalyst expression: it runs in the JVM, is visible to the optimiser, and can be folded into the scan. Exactly the same logic in a Python UDF would be a per-row round trip to a Python worker.' },
 { t: 'Filter before the expensive step, not after',
   code: "spark.table('transfers') \\\n  .filter(col('is_flagged') == 1) \\\n  .join(broadcast(spark.table('wallets')), col('src_wallet') == col('wallet_id')) \\\n  .groupBy('risk_band').agg(count('*').alias('n')) \\\n  .show()",
   note: 'Filtering first means fewer rows reach the join and the aggregation. Catalyst usually does this for you, but it cannot push a filter through a UDF or through some join types — writing it in the right order costs nothing and removes the dependency on the optimiser.' }
],
body: [
 { h: 'The UDF cost ladder', html:
   '<table><thead><tr><th>Approach</th><th>Runs in</th><th>Optimiser sees it</th><th>Relative cost</th></tr></thead><tbody>' +
   '<tr><td>Built-in functions</td><td>JVM, whole-stage codegen</td><td><b>Yes</b></td><td><b>1\u00d7</b></td></tr>' +
   '<tr><td>Pandas UDF (vectorised)</td><td>Python, Arrow batches</td><td>No</td><td>~2\u20135\u00d7</td></tr>' +
   '<tr><td>Python UDF (row-at-a-time)</td><td>Python, per row</td><td>No</td><td>~10\u2013100\u00d7</td></tr>' +
   '</tbody></table>' +
   '<p>Two separate costs: <strong>serialisation</strong> of every row out to Python and back, and <strong>lost optimisation</strong> \u2014 no pushdown, no pruning, no codegen. If a UDF is unavoidable, a Pandas UDF at least amortises the serialisation over Arrow batches.</p>' },
 { h: 'What defeats pushdown', html:
   '<div class="pre code">.filter(col(\'ts\') &gt;= \'2026-02-01\')        <i>pushed to the reader; row groups skipped</i>\n.filter(my_udf(col(\'ts\')) == True)         <u>opaque \u2014 every row decoded first</u>\n.filter(year(col(\'ts\')) == 2026)           <u>function on the column \u2014 usually not pushed</u>\n.select(\'*\')                               <u>no projection pruning</u></div>' +
   '<p>The same sargability rule as SQL and the same partition-pruning rule as Athena: keep the column bare on one side of the predicate. Three different engines, one principle.</p>' },
 { h: 'Before writing a UDF', html:
   '<ol>' +
   '<li><strong>Check the built-ins.</strong> <code>pyspark.sql.functions</code> has several hundred, including regex, date, JSON, array and map functions.</li>' +
   '<li><strong>Try composing them.</strong> <code>when</code>, <code>coalesce</code>, <code>regexp_extract</code> and <code>transform</code> cover most row-level logic.</li>' +
   '<li><strong>If you must, use a Pandas UDF</strong> for the vectorised path.</li>' +
   '<li><strong>Never call an external service per row</strong> inside a UDF \u2014 that is a batch job pretending to be a transformation.</li>' +
   '</ol>' }
],
call: '"A Python UDF is opaque to Catalyst, so nothing can be pushed through it and every row is serialised to a Python process and back \u2014 that is a ten to a hundred times penalty. I compose built-ins first, and use a Pandas UDF when I genuinely need Python, because Arrow batching at least amortises the serialisation."',
warn: 'A UDF in a filter defeats predicate pushdown entirely. The query still returns the right answer, so nothing looks broken — you simply read the whole table instead of skipping row groups, and the regression is invisible without reading the plan.',
qf: [
 ['Why are Python UDFs slow?', 'Row-by-row serialisation to a Python process, plus the optimiser cannot see through them — no pushdown, pruning or codegen.'],
 ['What does a Pandas UDF improve?', 'It processes Arrow batches instead of single rows, amortising serialisation — but it is still opaque to Catalyst.'],
 ['What is predicate pushdown?', 'Filters evaluated at the scan, letting Parquet skip row groups using min/max statistics.'],
 ['What is projection pruning?', 'Reading only the columns the query names — real on columnar formats.'],
 ['What defeats pushdown?', 'A UDF or a function wrapping the filtered column.'],
 ['Order of preference for row logic?', 'Built-in functions, then composed built-ins, then a Pandas UDF, and a Python UDF last.']
]});

/* ══════════════ TRACK W · WRITING ══════════════ */

M.push({
code: 'W1', track: 'Track W · Writing', title: 'Writing: file sizing and partitionBy',
sub: 'The output layout you choose is the read cost every downstream consumer pays forever.',
lede: 'A write is where a Spark job hands its cost to everyone who reads the result. One output file per partition means partition count decides file count; <code>partitionBy</code> decides directory layout and therefore what future queries can prune. Both decisions are made once and paid for on every read.',
ex: [
 { t: 'Partition count decides file count',
   code: "spark.table('transfers').repartition(12).show(3)",
   note: 'Twelve partitions means twelve output files on write. With sixty rows that is five rows per file — a textbook small-file problem. The fix is to size partitions for the data, not to accept whatever the last shuffle produced.' },
 { t: 'Coalescing to a sensible file count',
   code: "spark.table('transfers') \\\n  .filter(col('is_flagged') == 1) \\\n  .coalesce(2) \\\n  .show(4)",
   note: 'After a selective filter, coalesce down before writing. Two files instead of four mostly-empty ones. In production you size this against a target of roughly 128 MB per file.' },
 { t: 'Repartition by the column you will partitionBy',
   code: "spark.table('transfers') \\\n  .withColumn('dt', col('ts')) \\\n  .repartition(8, 'dt') \\\n  .show(3)",
   note: 'Without this, every Spark partition may contain rows for every date, so each one writes a file into every date directory — partitions times dates files. Repartitioning by the write key first makes it one file per date per partition.' },
 { t: 'A wide grouping key is the wrong partition column',
   code: "spark.table('transfers') \\\n  .groupBy('ts') \\\n  .agg(count('*').alias('n')) \\\n  .orderBy('ts') \\\n  .show(14)",
   note: 'Fourteen distinct dates over sixty rows means roughly four rows per directory. Real partitioning needs partitions large enough to hold well-sized files — if a candidate key yields a few rows per value, it is a sort key, not a partition key.' }
],
body: [
 { h: 'The write modes', html:
   '<table><thead><tr><th>Mode</th><th>Behaviour</th></tr></thead><tbody>' +
   '<tr><td><code>error</code> / <code>errorifexists</code></td><td>Default \u2014 fails if the path exists</td></tr>' +
   '<tr><td><code>append</code></td><td>Adds files; duplicates on a re-run unless the load is idempotent</td></tr>' +
   '<tr><td><code>overwrite</code></td><td>Replaces \u2014 the whole table, or just touched partitions with dynamic overwrite</td></tr>' +
   '<tr><td><code>ignore</code></td><td>Silently does nothing if the path exists \u2014 rarely what you want</td></tr>' +
   '</tbody></table>' +
   '<div class="pre code">spark.sql.sources.partitionOverwriteMode = dynamic\n   <i>overwrite only the partitions this write touches \u2014 the safe idiom for backfills</i></div>' +
   '<p>Without dynamic mode, <code>overwrite</code> on a partitioned table deletes <em class="hl">every</em> partition, not just the ones you wrote. That has destroyed real tables.</p>' },
 { h: 'Choosing the partition column', html:
   '<ul>' +
   '<li><strong>It must appear in downstream filters.</strong> A partition nobody filters on is pure overhead.</li>' +
   '<li><strong>Aim for partitions of at least a few hundred megabytes.</strong> Partition count times files per partition is your object count.</li>' +
   '<li><strong>Date is almost always right.</strong> High-cardinality keys such as user id produce millions of directories.</li>' +
   '<li><strong>Repartition by the same column before writing</strong>, or every Spark partition writes into every directory.</li>' +
   '</ul>' },
 { h: 'The small-file problem, restated', html:
   '<p>Files written are Spark partitions multiplied by the number of <code>partitionBy</code> value combinations each partition contains. A streaming job with a 30-second trigger and 200 shuffle partitions can produce hundreds of thousands of files a day. The remedy is a scheduled compaction job \u2014 the writer usually has a latency requirement you cannot negotiate away.</p>' }
],
call: '"Output file count is Spark partitions times the partitionBy combinations each partition holds, so I repartition by the write key first \u2014 otherwise every partition writes a file into every directory. And I use dynamic partition overwrite for backfills, because a plain overwrite on a partitioned table deletes every partition, not just the ones being written."',
warn: 'overwrite on a partitioned table without dynamic partitionOverwriteMode deletes the entire table before writing. A backfill for one day can remove three years of history, and it is not recoverable without versioning or a table format.',
qf: [
 ['What decides the number of output files?', 'Spark partitions times the number of partitionBy value combinations in each.'],
 ['Why repartition by the partitionBy column before writing?', 'Otherwise every Spark partition writes a file into every directory.'],
 ['What does dynamic partitionOverwriteMode do?', 'Overwrites only the partitions the write touches, rather than the whole table.'],
 ['What is the target file size?', 'Roughly 128 MB to 1 GB.'],
 ['How do you pick a partition column?', 'It must be filtered on downstream and yield partitions large enough for well-sized files — usually a date.'],
 ['Why is append risky?', 'Re-running duplicates data unless the load is idempotent.']
]});

/* ══════════════ TRACK F · FOUNDATIONS (theory) ══════════════ */

M.push({
code: 'F1', track: 'Track F · Foundations', theory: true,
title: 'Why distribute, and what it costs',
sub: 'Scaling out buys throughput and hands you three problems a single machine never had.',
lede: 'One machine is faster than a cluster for anything that fits on it, because coordination is free when there is nothing to coordinate with. You distribute when the data stops fitting or the deadline stops being met \u2014 and the moment you do, you inherit partitioning, shuffles and partial failure. Everything else in this bench is the consequence.',
ex: [],
body: [
 { h: 'Vertical before horizontal', html:
   '<p>A modern single instance takes hundreds of gigabytes of RAM and dozens of cores. Duckdb, Polars or plain pandas on one large machine beats a Spark cluster on anything under roughly a hundred gigabytes, and it beats it on <em class="hl">developer time</em> by a wider margin than on runtime.</p>' +
   '<p>Being willing to say that in an interview is a signal, not a weakness. "We moved it to Spark and it got slower" is one of the most common real outcomes in the industry, and the reason is almost always that the job was never large enough to pay back the coordination cost.</p>' },
 { h: 'The three inherited problems', html:
   '<table><thead><tr><th>Problem</th><th>Why it appears</th><th>Where it shows up here</th></tr></thead><tbody>' +
   '<tr><td><b>Partitioning</b></td><td>Data must be split before it can be processed in parallel</td><td>S1, S2</td></tr>' +
   '<tr><td><b>Shuffles</b></td><td>Some operations need rows that live on other machines</td><td>T1, T2, J1</td></tr>' +
   '<tr><td><b>Partial failure</b></td><td>In a cluster, something is always broken</td><td>Lineage and checkpointing, below</td></tr>' +
   '</tbody></table>' },
 { h: 'Partitioning strategies', html:
   '<div class="pre">hash        partition = hash(key) % n   <i>groups equal keys together \u2014 enables joins and aggregation</i>\nrange       ordered buckets             <i>enables global sort and range pruning</i>\nround-robin next partition in turn      <i>perfectly even, destroys all locality</i></div>' +
   '<p>Spark uses all three: hash for <code>groupBy</code> and joins, range for <code>orderBy</code>, round-robin for <code>repartition(n)</code> with no column. Which one an operation uses is visible in the plan as <code>hashpartitioning</code>, <code>rangepartitioning</code> or <code>roundrobin</code>.</p>' },
 { h: 'Fault tolerance without replication', html:
   '<p>Hadoop survived node loss by replicating data three times. Spark takes a different bet: it records the <em class="hl">lineage</em> \u2014 the sequence of transformations that produced a partition \u2014 and recomputes a lost partition from its parents. That is why transformations must be deterministic, and why a job reading from a source that has since changed cannot be safely recovered.</p>' +
   '<p>Lineage has a limit: a chain hundreds of stages long is expensive to replay, which is what <code>checkpoint()</code> exists for \u2014 it truncates lineage by writing to durable storage. Caching does not truncate lineage; it only avoids recomputation while the cache survives.</p>' },
 { h: 'Amdahl\u2019s law, stated usefully', html:
   '<p>The speedup from parallelism is capped by the fraction of work that stays serial. If 5% of a job cannot be parallelised, twenty machines get you at most a 10\u00d7 speedup and a hundred machines get you barely more.</p>' +
   '<p>The practical version in Spark: <code>coalesce(1)</code> before a write makes the whole preceding stage serial, a single skewed key makes a stage serial, and a driver-side <code>collect()</code> makes everything after it serial. All three are Amdahl\u2019s law arriving in different costumes.</p>' }
],
call: '"I check whether the job actually needs a cluster before reaching for one \u2014 a single large machine beats Spark under about a hundred gigabytes, and distributing early buys you partitioning, shuffles and partial failure in exchange for coordination overhead you were not paying."',
warn: 'Spark recovers lost partitions by recomputing from lineage, which assumes your transformations are deterministic and your source has not changed. A job using `rand()` without a seed, or reading a directory something else is writing to, cannot be correctly recovered — and the failure is silent.',
qf: [
 ['When should you not use Spark?', 'When the data fits comfortably on one machine — under roughly 100 GB a single-node tool usually wins on both runtime and developer time.'],
 ['Name the three partitioning strategies.', 'Hash (groups equal keys), range (enables ordering), round-robin (even but destroys locality).'],
 ['How does Spark recover a lost partition?', 'It recomputes it from lineage rather than relying on replication.'],
 ['What does checkpoint() do that cache() does not?', 'It truncates lineage by writing to durable storage; caching only avoids recomputation while the cache survives.'],
 ['State Amdahl\'s law in Spark terms.', 'The serial fraction caps the speedup — coalesce(1), a skewed key, or a driver-side collect all serialise a stage.'],
 ['Why must transformations be deterministic?', 'Because recovery replays them; a non-deterministic transformation cannot be correctly recomputed.']
]});

M.push({
code: 'F2', track: 'Track F · Foundations', theory: true,
title: 'CAP, consistency and what a data engineer actually needs',
sub: 'The theorem is quoted constantly and applied badly. Here is the version that survives contact with AWS.',
lede: 'CAP says that when the network partitions, a distributed system must choose between remaining consistent and remaining available. That is all it says. It is not a menu of three options to pick two from, and most of the systems you will use are tunable rather than fixed. What matters for a data engineer is knowing what a given read can and cannot promise you.',
ex: [],
body: [
 { h: 'The theorem, stated precisely', html:
   '<p><strong>Consistency</strong> \u2014 every read sees the most recent write. <strong>Availability</strong> \u2014 every request gets a non-error response. <strong>Partition tolerance</strong> \u2014 the system keeps working when messages between nodes are lost.</p>' +
   '<p>Partitions are not optional in a real network, so P is a given. The genuine choice is C or A <em class="hl">during a partition</em>. When the network is healthy a well-built system can offer both, which is why "we chose AP" is usually a sloppier statement than it sounds.</p>' +
   '<p>PACELC is the refinement worth knowing: during a Partition, choose A or C; Else, choose Latency or Consistency. That second half describes normal operation, which is where systems actually spend their time.</p>' },
 { h: 'The consistency models you will meet', html:
   '<table><thead><tr><th>Model</th><th>Promise</th><th>Where you meet it</th></tr></thead><tbody>' +
   '<tr><td>Strong / linearisable</td><td>Reads see the latest write, always</td><td>DynamoDB strongly consistent reads; RDS primary</td></tr>' +
   '<tr><td>Read-after-write</td><td>You see your own writes</td><td>S3, since December 2020</td></tr>' +
   '<tr><td>Eventual</td><td>Reads converge, eventually</td><td>DynamoDB default reads; DynamoDB GSIs; read replicas</td></tr>' +
   '<tr><td>Snapshot isolation</td><td>One consistent version for the whole read</td><td>Iceberg, Delta, Postgres repeatable read</td></tr>' +
   '</tbody></table>' },
 { h: 'What this means in a pipeline', html:
   '<ul>' +
   '<li><strong>A long extract under eventual consistency gives an inconsistent snapshot</strong> \u2014 a parent read before an insert and its child read after. Read under snapshot isolation, or take the change log.</li>' +
   '<li><strong>DynamoDB GSIs are eventually consistent with no strong option.</strong> Write an item, immediately query the index, and you may find nothing. It is timing-dependent, so it passes tests.</li>' +
   '<li><strong>S3 strong read-after-write is not transactional consistency.</strong> A job writing two hundred files still cannot make them appear together \u2014 which is exactly what a table format\u2019s metadata commit adds.</li>' +
   '<li><strong>Read replicas lag.</strong> Reporting off a replica is usually correct and occasionally embarrassing; know the lag and state it.</li>' +
   '</ul>' },
 { h: 'The honest scope', html:
   '<p>You will not be asked to prove CAP. You will be asked what happens when a reader hits a table mid-write, or why a dashboard disagrees with the source system. Both are consistency questions in practical dress, and the useful answer names the model rather than the theorem.</p>' }
],
call: '"Partition tolerance is not optional on a real network, so the choice is consistency or availability during a partition \u2014 and PACELC adds that outside a partition you are trading latency against consistency. In practice I care which model a specific read gives me: S3 is read-after-write, a DynamoDB GSI is eventually consistent, and Iceberg gives snapshot isolation."',
warn: 'The single most expensive consistency bug in a data platform is reading a source under eventual consistency during a long extract. Nothing errors — you simply get a snapshot that never existed, with a parent row from before an insert and its child from after.',
qf: [
 ['What does CAP actually state?', 'When the network partitions, a system must choose between consistency and availability. Partition tolerance is not really optional.'],
 ['What does PACELC add?', 'Outside a partition you still trade latency against consistency — which describes normal operation.'],
 ['What consistency does S3 provide?', 'Strong read-after-write for all operations including overwrites and LIST — but not atomic multi-object commits.'],
 ['Are DynamoDB GSIs strongly consistent?', 'No. They are eventually consistent only, so a read-after-write against an index can miss the item.'],
 ['What is snapshot isolation and where do you get it?', 'A read sees one consistent version of the whole dataset — Iceberg, Delta, and repeatable-read transactions.'],
 ['Why does a long extract need care?', 'Under eventual consistency the snapshot is internally inconsistent; use snapshot isolation or CDC.']
]});

/* ══════════════ TRACK H · HADOOP LINEAGE (theory) ══════════════ */

M.push({
code: 'H1', track: 'Track H · Hadoop lineage', theory: true,
title: 'HDFS and the block model',
sub: 'The 128 MB block is why every file-sizing rule in this bench is what it is.',
lede: 'You will almost certainly never operate HDFS. You should still understand it, because the block model set the conventions the entire ecosystem still follows \u2014 including on S3, where blocks do not exist. Interviewers at banks ask about it because their on-premise estates still run it.',
ex: [],
body: [
 { h: 'The architecture', html:
   '<table><thead><tr><th>Component</th><th>Role</th><th>Failure mode</th></tr></thead><tbody>' +
   '<tr><td><b>NameNode</b></td><td>Holds the filesystem tree and block locations, in memory</td><td>Single point of failure; memory-bound on file count</td></tr>' +
   '<tr><td><b>DataNode</b></td><td>Stores block replicas, reports to the NameNode</td><td>Individual loss is routine and survivable</td></tr>' +
   '<tr><td><b>Secondary NameNode</b></td><td>Checkpoints the edit log \u2014 <em class="hl">not</em> a standby</td><td>Widely misunderstood; it is not failover</td></tr>' +
   '</tbody></table>' +
   '<p>Default block size 128 MB, replication factor 3: one replica on the writing node, one on another rack, one more on that second rack. That layout survives a whole rack failing while keeping most writes local.</p>' },
 { h: 'Why the small-file problem started here', html:
   '<p>The NameNode holds every file, directory and block in <strong>memory</strong> \u2014 roughly 150 bytes of metadata each. A million 1 KB files occupy about a gigabyte of data and around 300 MB of NameNode heap, and they will exhaust the NameNode long before they exhaust the disks.</p>' +
   '<p>On S3 there is no NameNode, so the mechanism is different \u2014 per-request cost and per-file open overhead \u2014 but the conclusion is identical, which is why the 128 MB to 1 GB target carried over unchanged.</p>' },
 { h: 'Data locality, and the trade the cloud made', html:
   '<p>HDFS co-located storage and compute so a task could read from the disk in the same machine. Moving computation to data rather than data to computation was the founding idea.</p>' +
   '<p>The cloud gave that up. S3 is not on your compute nodes, so every read crosses the network. In exchange you get independent scaling of storage and compute, pay-per-use, and durability you do not manage. That trade is why the industry moved, and being able to state both sides of it is a better answer than "the cloud is better".</p>' },
 { h: 'The translation table', html:
   '<table><thead><tr><th>Hadoop</th><th>Modern equivalent</th></tr></thead><tbody>' +
   '<tr><td>HDFS</td><td>S3, ADLS, GCS</td></tr>' +
   '<tr><td>NameNode metadata</td><td>Object store index, plus Iceberg or Delta metadata</td></tr>' +
   '<tr><td>Replication factor 3</td><td>S3 durability, managed for you</td></tr>' +
   '<tr><td>Block size 128 MB</td><td>Target Parquet file size 128 MB \u2013 1 GB</td></tr>' +
   '<tr><td>Data locality</td><td>Gone \u2014 replaced by fast networks and caching</td></tr>' +
   '</tbody></table>' }
],
call: '"The 128 MB block and the NameNode\u2019s in-memory metadata are why the small-file problem exists and why the file-size target carried over to S3 unchanged \u2014 the mechanism changed from NameNode heap to request cost, but the conclusion did not."',
warn: 'The Secondary NameNode is not a standby and does not provide failover — it checkpoints the edit log. High availability needs a proper Standby NameNode with a quorum journal. This is a favourite trick question precisely because the name is misleading.',
qf: [
 ['What is the default HDFS block size and replication factor?', '128 MB and 3 replicas.'],
 ['Why is the small-file problem a NameNode problem?', 'It holds metadata for every file and block in memory — roughly 150 bytes each — so file count exhausts heap before disks fill.'],
 ['What does the Secondary NameNode do?', 'Checkpoints the edit log. It is not a standby and provides no failover.'],
 ['What is data locality and what happened to it?', 'Running computation on the node holding the data. The cloud gave it up to decouple storage and compute.'],
 ['What replaced HDFS in a modern stack?', 'Object storage — S3 — with a table format supplying the metadata layer.'],
 ['Why did the 128 MB target survive?', 'The mechanism changed from NameNode heap to per-file request and open overhead, but small files are still the problem.']
]});

M.push({
code: 'H2', track: 'Track H · Hadoop lineage', theory: true,
title: 'MapReduce, YARN and why Spark replaced them',
sub: 'The two-sentence answer every interview wants, and the resource model EMR still runs on.',
lede: 'MapReduce is the model Spark replaced; YARN is the resource manager Spark still frequently runs on. Both matter for different reasons \u2014 one because you must explain the transition, the other because executor sizing questions come straight out of it.',
ex: [
 { t: 'MapReduce word count \u2014 the shape, not the code', ref: true,
   code: "# map phase   : each input split -> (word, 1) pairs\n# shuffle+sort: all pairs for the same word gathered on one reducer\n# reduce phase: sum the counts per word\n\nmap(line):     for word in line.split(): emit(word, 1)\ncombine(w,vs): emit(w, sum(vs))        # map-side pre-aggregation\nreduce(w,vs):  emit(w, sum(vs))\n\n# Every arrow between phases is a WRITE TO DISK and a READ BACK.",
   note: 'The combiner is the ancestor of Spark\u2019s partial aggregate: reduce locally before shuffling. The critical detail is that MapReduce materialised to disk between every phase, and a multi-step pipeline chained several complete MapReduce jobs — paying that cost at every boundary.' }
],
body: [
 { h: 'The two-sentence answer', html:
   '<div class="pre">MapReduce wrote every intermediate result to disk and read it back for the\nnext stage, so a multi-step job paid full serialisation and disk cost at each\nboundary. Spark keeps intermediates in memory across stages and builds a DAG\nit can optimise as a whole, so the same pipeline does one pass instead of\nseveral.</div>' +
   '<p>Say it in that order. Candidates who lead with "Spark is in-memory" get asked what happens when the data does not fit in memory \u2014 and the answer is that Spark spills to disk, which is not a failure of the model but a graceful degradation of it.</p>' },
 { h: 'What MapReduce got right', html:
   '<ul>' +
   '<li><strong>The shuffle and sort</strong> \u2014 unchanged in concept. Spark\u2019s Exchange is the same operation.</li>' +
   '<li><strong>The combiner</strong> \u2014 map-side reduction before the network. Spark\u2019s partial aggregate.</li>' +
   '<li><strong>Recovery by re-execution</strong> \u2014 a failed task is simply run again.</li>' +
   '<li><strong>Speculative execution</strong> \u2014 launch a duplicate of a straggler, take whichever finishes. Spark still does this.</li>' +
   '</ul>' },
 { h: 'YARN, which EMR still runs on', html:
   '<table><thead><tr><th>Component</th><th>Role</th></tr></thead><tbody>' +
   '<tr><td>ResourceManager</td><td>Cluster-wide scheduler; allocates containers</td></tr>' +
   '<tr><td>NodeManager</td><td>Per-node agent; launches and monitors containers</td></tr>' +
   '<tr><td>ApplicationMaster</td><td>Per-application; requests containers and tracks its own tasks</td></tr>' +
   '<tr><td>Container</td><td>A bounded slice of memory and cores \u2014 a Spark executor is one</td></tr>' +
   '</tbody></table>' +
   '<p>A Spark executor <em class="hl">is</em> a YARN container, which is why <code>spark.executor.memory</code> plus <code>spark.executor.memoryOverhead</code> must fit inside the container limit \u2014 and why a job dies with "Container killed by YARN for exceeding memory limits" rather than a Java OutOfMemoryError. Those are two different failures with two different fixes.</p>' },
 { h: 'Schedulers', html:
   '<p><strong>Capacity scheduler</strong> divides the cluster into queues with guaranteed shares \u2014 the usual choice in an enterprise where teams must not starve each other. <strong>Fair scheduler</strong> balances resources dynamically across running jobs. In a bank you will meet queue-based capacity scheduling, and "which queue does this job run in" is a real operational question.</p>' }
],
call: '"MapReduce materialised to disk between every phase, so a multi-step job paid serialisation and disk cost at each boundary; Spark keeps intermediates in memory and optimises the DAG as a whole. And a Spark executor is a YARN container, which is why an overhead miscalculation shows up as YARN killing the container rather than as a Java OOM."',
warn: '"Container killed by YARN for exceeding memory limits" is not a Java heap error. It means executor memory plus overhead exceeded the container allocation — often caused by off-heap use, Python worker memory, or too many cores per executor. Raising spark.executor.memory alone can make it worse.',
qf: [
 ['Why did Spark replace MapReduce?', 'MapReduce wrote intermediates to disk at every phase boundary; Spark keeps them in memory and optimises the whole DAG.'],
 ['What is a combiner and what is its Spark equivalent?', 'Map-side pre-aggregation before the shuffle — Spark\'s partial aggregate.'],
 ['What is a YARN container in Spark terms?', 'An executor. Executor memory plus overhead must fit inside the container limit.'],
 ['What does "Container killed by YARN" mean?', 'Memory plus overhead exceeded the container allocation — not a Java heap OOM, and a different fix.'],
 ['Capacity versus fair scheduler?', 'Capacity gives queues guaranteed shares; fair balances dynamically across running jobs.'],
 ['What is speculative execution?', 'Launching a duplicate of a straggler task and taking whichever finishes first — Spark still does this.']
]});

M.push({
code: 'H3', track: 'Track H · Hadoop lineage', theory: true,
title: 'Hive, the metastore and HiveQL',
sub: 'The Glue Data Catalog is a Hive metastore. This module is why that sentence matters.',
lede: 'Hive gave the ecosystem two things that outlived it entirely: SQL over files, and a <em class="hl">metastore</em> that describes where those files are and what they contain. Every engine you use \u2014 Athena, Spark, Redshift Spectrum, Trino \u2014 reads that same catalog model, so its concepts are not legacy at all.',
ex: [
 { t: 'The DDL you will actually meet', ref: true,
   code: "-- external table: Hive describes the data, it does not own it\nCREATE EXTERNAL TABLE transfers (\n  txn_id      STRING,\n  src_wallet  STRING,\n  amount_usd  DECIMAL(12,2)\n)\nPARTITIONED BY (dt STRING)\nSTORED AS PARQUET\nLOCATION 's3://fraud-lake/transfers/';\n\n-- the catalog does not discover partitions on its own\nALTER TABLE transfers ADD PARTITION (dt='2026-02-01')\n  LOCATION 's3://fraud-lake/transfers/dt=2026-02-01/';\n\n-- or, expensively, scan every prefix\nMSCK REPAIR TABLE transfers;",
   note: 'DROP TABLE on an EXTERNAL table removes only the metadata; on a MANAGED table it deletes the data. That single distinction is the most consequential thing in this module and the most common accidental data loss in a lake.' }
],
body: [
 { h: 'Managed versus external', html:
   '<table><thead><tr><th></th><th>Managed (internal)</th><th>External</th></tr></thead><tbody>' +
   '<tr><td>Who owns the data</td><td>Hive</td><td>You</td></tr>' +
   '<tr><td><code>DROP TABLE</code></td><td><b>Deletes the data</b></td><td>Deletes metadata only</td></tr>' +
   '<tr><td>Right for</td><td>Scratch and intermediate tables</td><td><b>Almost everything in a lake</b></td></tr>' +
   '</tbody></table>' +
   '<p>Default to external. The data in a lake is usually written by a pipeline that is not Hive, shared with engines that are not Hive, and far too valuable to be deleted by a metadata operation.</p>' },
 { h: 'Partitioning and bucketing', html:
   '<p><strong>Partitioning</strong> creates directories \u2014 <code>dt=2026-02-01/</code> \u2014 and lets an engine skip whole directories. Partition columns are <em class="hl">not stored in the files</em>; they are read from the path, which is why they are sometimes typed as strings when you expected dates.</p>' +
   '<p><strong>Bucketing</strong> hashes a column into a fixed number of files within each partition. Two tables bucketed identically on their join key can be joined without a shuffle, which is the one real reason to use it. The cost is that the bucket count is fixed at table creation and changing it means rewriting the table \u2014 and Spark and Hive have historically disagreed on bucketing implementations, so the shuffle-free join often does not materialise across engines. Know it exists; be sceptical of it in practice.</p>' },
 { h: 'HiveQL divergences worth knowing', html:
   '<table><thead><tr><th>Behaviour</th><th>HiveQL</th><th>ANSI / Spark SQL</th></tr></thead><tbody>' +
   '<tr><td>Column not in GROUP BY</td><td>Historically permissive</td><td>Error</td></tr>' +
   '<tr><td>Integer division</td><td>Returns a double</td><td>Varies by engine</td></tr>' +
   '<tr><td>Array and map types</td><td>Native, with LATERAL VIEW explode</td><td>Native, with explode()</td></tr>' +
   '<tr><td>SORT BY vs ORDER BY</td><td>SORT BY sorts per reducer only</td><td>ORDER BY is global</td></tr>' +
   '<tr><td>DISTRIBUTE BY / CLUSTER BY</td><td>Manual partitioning control</td><td>repartition() / repartition + sort</td></tr>' +
   '</tbody></table>' +
   '<p><code>SORT BY</code> is the sharp one: it sorts within each reducer and produces output that looks sorted in a sample and is not sorted globally. That is <code>sortWithinPartitions</code> in Spark, and it is occasionally what you want and usually not.</p>' },
 { h: 'The modern position', html:
   '<p>Hive as an execution engine is legacy. The Hive <em class="hl">metastore</em> is not \u2014 AWS Glue Data Catalog implements the same API, Databricks Unity Catalog succeeds it, and every query engine in your stack reads that model. Table, partition, location, SerDe, column types: those five concepts are what you actually need, and they transfer unchanged.</p>' }
],
call: '"The Glue Data Catalog is a Hive metastore, so the table, partition, location and SerDe model transfers unchanged across Athena, Spark, EMR and Redshift Spectrum. I default to external tables, because DROP on a managed table deletes the data and a lake\u2019s data is never owned by the catalog."',
warn: 'SORT BY sorts within each reducer, not globally. A sample of the output looks perfectly ordered, so the bug survives review and appears only when someone reads the whole file or relies on the ordering downstream.',
qf: [
 ['Managed versus external table?', 'DROP on a managed table deletes the data; on an external table it removes only metadata. Default to external in a lake.'],
 ['Where do partition column values live?', 'In the directory path, not in the data files.'],
 ['What is bucketing for?', 'Hashing a column into a fixed file count so identically bucketed tables can join without a shuffle — fragile across engines.'],
 ['SORT BY versus ORDER BY?', 'SORT BY sorts within each reducer; ORDER BY is global.'],
 ['Why does the Hive metastore still matter?', 'Glue Data Catalog implements the same model, and every engine in the stack reads it.'],
 ['How do partitions get registered?', 'Explicit ALTER TABLE ADD PARTITION, a crawler, MSCK REPAIR, or partition projection — not automatically.']
]});

M.push({
code: 'X1', track: 'Track X · Internals', theory: true,
title: 'Catalyst, Tungsten and the four plans',
sub: 'What happens between your code and the tasks — and how to read each layer.',
lede: 'Spark does not execute your code. It converts it into a logical plan, rewrites that plan with rule-based and cost-based optimisations, picks physical operators, and generates Java bytecode. Understanding the four stages is what lets you read <code>explain(True)</code> instead of guessing at it.',
ex: [
 { t: 'The four plans, as explain(True) prints them', ref: true,
   code: "df.explain(True)\n\n== Parsed Logical Plan ==        # your code, as written, unresolved\n== Analyzed Logical Plan ==      # columns and types resolved against the catalog\n== Optimized Logical Plan ==     # Catalyst rules applied: pushdown, pruning, folding\n== Physical Plan ==              # operators chosen: which join, which exchange\n\n# In production, read the LAST one first. The physical plan is what runs.\ndf.explain('formatted')          # Spark 3+: cleaner, with per-node detail",
   note: 'Read bottom-up: the physical plan is what executes. Compare the optimised logical plan with the parsed one to see what Catalyst did for you — a filter that moved down to the scan, a projection that pruned columns, a constant that got folded.' },
 { t: 'What Catalyst rewrites for you', ref: true,
   code: "# predicate pushdown\ndf.join(other, 'k').filter(col('a') > 5)\n  ->  filter is pushed BELOW the join, so the join sees fewer rows\n\n# column pruning\ndf.select('a').filter(col('b') > 1)\n  ->  the scan reads only a and b, not the whole row\n\n# constant folding\ncol('x') * (2 + 3)   ->   col('x') * 5      # evaluated once at plan time\n\n# what it CANNOT push through\ndf.filter(my_python_udf(col('a')))          # opaque \u2014 nothing moves",
   note: 'Catalyst is why writing filters in a slightly wrong order rarely matters, and why a UDF in a filter matters enormously. The optimiser can only reason about expressions it understands.' }
],
body: [
 { h: 'The pipeline', html:
   '<table><thead><tr><th>Stage</th><th>Input</th><th>What happens</th></tr></thead><tbody>' +
   '<tr><td>Parsed logical plan</td><td>Your DataFrame calls</td><td>A tree; column names not yet checked</td></tr>' +
   '<tr><td>Analyzed logical plan</td><td>Parsed plan + catalog</td><td>Columns resolved, types assigned. <em class="hl">This is where AnalysisException comes from</em></td></tr>' +
   '<tr><td>Optimized logical plan</td><td>Analyzed plan</td><td>Rule-based rewrites: pushdown, pruning, folding, join reordering</td></tr>' +
   '<tr><td>Physical plan</td><td>Optimised plan + statistics</td><td>Operator selection \u2014 which join strategy, where to Exchange</td></tr>' +
   '<tr><td>Codegen</td><td>Physical plan</td><td>Whole-stage codegen fuses operators into generated Java</td></tr>' +
   '</tbody></table>' +
   '<p>Errors tell you which stage failed. An <code>AnalysisException</code> for an unknown column happened at analysis, before any optimisation \u2014 which is why it surfaces at the action rather than the line that wrote the typo.</p>' },
 { h: 'Tungsten and whole-stage codegen', html:
   '<p><strong>Tungsten</strong> is the execution backend: off-heap memory in a compact binary format, cache-aware data structures, and no per-row JVM object overhead. <strong>Whole-stage codegen</strong> collapses a chain of narrow operators into a single generated Java function, so a filter followed by a projection followed by a map is one tight loop rather than three virtual calls per row.</p>' +
   '<p>In a physical plan, operators wrapped in <code>*(1)</code>, <code>*(2)</code> are codegen stages. An operator <em class="hl">without</em> a star could not be fused \u2014 usually a UDF, or an operator with no codegen implementation \u2014 and that is a small performance flag worth noticing.</p>' },
 { h: 'Cost-based optimisation', html:
   '<p>Rule-based optimisation always applies. Cost-based optimisation needs <strong>statistics</strong>, gathered with <code>ANALYZE TABLE ... COMPUTE STATISTICS</code>, and uses them to reorder joins and choose strategies. Without statistics Spark falls back to guesses from file sizes, which is precisely why a freshly written table often gets shuffled when it should have been broadcast.</p>' +
   '<p>That is the practical link: stale or missing statistics is the usual reason an explicit <code>broadcast()</code> hint is needed at all.</p>' }
],
call: '"Catalyst runs four stages \u2014 parsed, analysed, optimised, physical \u2014 and I read the physical plan first because that is what executes. Missing table statistics are why Spark guesses a table is large and shuffles it, which is when an explicit broadcast hint earns its place."',
warn: 'An operator without a `*` in the physical plan is not part of a whole-stage codegen block. It is usually a UDF or an unsupported operator, and it means every row pays a virtual call instead of running inside a fused loop.',
qf: [
 ['Name the four plans in order.', 'Parsed logical, analysed logical, optimised logical, physical.'],
 ['Which stage produces an AnalysisException?', 'Analysis — resolving columns and types against the catalog.'],
 ['Name three Catalyst optimisations.', 'Predicate pushdown, column pruning, constant folding — also join reordering with statistics.'],
 ['What is whole-stage codegen?', 'Fusing a chain of operators into one generated Java function, removing per-row virtual calls.'],
 ['What does a `*` mean in a physical plan?', 'The operator is inside a whole-stage codegen block. No star means it could not be fused.'],
 ['Why do missing statistics matter?', 'Cost-based optimisation cannot run, so Spark guesses sizes and may shuffle a table it should have broadcast.']
]});

M.push({
code: 'X2', track: 'Track X · Internals',
title: 'Adaptive Query Execution',
sub: 'Runtime re-planning using real statistics — and the three things it actually fixes.',
lede: 'Everything Catalyst decides before execution is based on estimates. AQE re-plans <em class="hl">during</em> execution using the actual size of completed shuffle stages, which is why it fixes precisely the problems estimates get wrong: too many small partitions, a join strategy chosen on a bad guess, and skew. It is on by default in Spark 3 and is the single largest free win in modern Spark.',
ex: [
 { t: 'Baseline \u2014 a hot key with AQE off',
   code: "spark.table('transfers').repartition(8, 'src_wallet').show(2)",
   note: 'The partition histogram is the point. One partition holds 32 of 60 rows while two are empty \u2014 skew of roughly 4.3x. This is what the plan produces before any runtime adaptation.' },
 { t: 'The same query with AQE enabled',
   code: "spark.conf.set('spark.sql.adaptive.enabled', True)\n\nspark.table('transfers').repartition(8, 'src_wallet').show(2)",
   note: 'Read the AQEShuffleRead line: it split the skewed partition and then coalesced the small ones. Skew drops from about 4.3x to about 1.3x, and the partition count falls because the empty and tiny partitions were merged away. Same code, same data \u2014 the difference is that AQE saw the real sizes.' },
 { t: 'The two controls are independent',
   code: "spark.conf.set('spark.sql.adaptive.enabled', True)\nspark.conf.set('spark.sql.adaptive.skewJoin.enabled', False)\n\nspark.table('transfers').repartition(8, 'src_wallet').show(2)",
   note: 'Coalescing still runs, skew splitting does not \u2014 so the 32-row partition survives intact and skew stays around 2x. Turning AQE on is not one switch; coalescing and skew handling are separate settings and they fix different problems.' },
 { t: 'Coalescing an over-partitioned aggregation',
   code: "spark.conf.set('spark.sql.adaptive.enabled', True)\n\nspark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('n')) \\\n  .show()",
   note: 'Eight groups spread over eight shuffle partitions collapse to one. In real Spark this is the 200-default problem: eight groups across 200 partitions means 192 empty tasks, each with genuine scheduling cost. Change the advisory setting and watch the target partition size move.' },
 { t: 'The configuration surface', ref: true,
   code: "spark.sql.adaptive.enabled                          true    # default in Spark 3+\nspark.sql.adaptive.coalescePartitions.enabled       true\nspark.sql.adaptive.advisoryPartitionSizeInBytes     64MB    # coalescing target\nspark.sql.adaptive.skewJoin.enabled                 true\nspark.sql.adaptive.skewJoin.skewedPartitionFactor   5       # x median = 'skewed'\nspark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes  256MB\n\n# This bench uses ROW COUNTS where Spark uses bytes, because the datasets are\n# small enough to read. The advisory and threshold settings are named\n# ...advisoryPartitionRows and ...skewedPartitionThresholdRows here.\n# The RULES \u2014 two conditions for skew, coalesce toward an advisory size \u2014\n# are Spark's.",
   note: 'The two skew thresholds together define the test: a partition must be more than a factor times the median AND above an absolute threshold. A small skewed partition is left alone, because splitting it would cost more than it saves.' }
],
body: [
 { h: 'The three optimisations', html:
   '<table><thead><tr><th>Optimisation</th><th>Fixes</th><th>How</th></tr></thead><tbody>' +
   '<tr><td><b>Coalesce shuffle partitions</b></td><td>The 200-default problem</td><td>Merges small post-shuffle partitions to hit an advisory size</td></tr>' +
   '<tr><td><b>Switch join strategy</b></td><td>Stale or missing statistics</td><td>Converts sort-merge to broadcast when the built side turns out small</td></tr>' +
   '<tr><td><b>Split skewed partitions</b></td><td>Skew in a shuffle join</td><td>Splits an oversized partition into sub-partitions, replicating the other side</td></tr>' +
   '</tbody></table>' +
   '<p>The first one is why <code>spark.sql.shuffle.partitions</code> matters far less than it used to. You can leave it high and let AQE coalesce down, which is a better default than trying to guess the right number per job.</p>' },
 { h: 'What AQE does not do', html:
   '<ul>' +
   '<li><strong>It does not fix read-side partitioning.</strong> The number of partitions coming out of a scan is set by your file layout. AQE only reshapes post-shuffle partitions.</li>' +
   '<li><strong>It does not fix skew in an aggregation.</strong> The skew-join optimisation applies to joins; a <code>groupBy</code> on a hot key is still one task.</li>' +
   '<li><strong>It cannot broadcast something genuinely large.</strong> It re-plans within the same physical options.</li>' +
   '<li><strong>It re-plans only at stage boundaries</strong>, because that is when real statistics become available.</li>' +
   '</ul>' +
   '<p>That first point is the one worth carrying: AQE made shuffle tuning mostly automatic and left file sizing entirely to you \u2014 which is why the writing track still matters.</p>' },
 { h: 'Reading an AQE plan', html:
   '<p>The plan node is <code>AdaptiveSparkPlan</code>. While the query runs, <code>isFinalPlan=false</code> and what you see is the initial guess. Once it completes, the final plan is available and will often differ \u2014 a <code>SortMergeJoin</code> replaced by a <code>BroadcastHashJoin</code>, or a <code>CustomShuffleReader</code> node showing coalesced partitions.</p>' +
   '<p>This trips people up when debugging: the plan you printed before running is not necessarily the plan that ran. Take the plan from the completed query in the SQL tab of the UI, not from <code>explain()</code> beforehand.</p>' }
],
call: '"AQE re-plans at stage boundaries using real shuffle statistics, so it fixes the three things estimates get wrong: too many small partitions, a join strategy chosen on a bad guess, and skew inside a join. It does not touch read-side partitioning, which is why file sizing is still my job."',
warn: 'The plan from `explain()` before execution is not necessarily the plan that ran. With AQE the final plan is only available after the query completes, so debug from the SQL tab of the Spark UI rather than from a pre-run explain.',
qf: [
 ['What three things does AQE optimise?', 'Coalescing shuffle partitions, switching join strategy, and splitting skewed partitions in a join.'],
 ['When does AQE re-plan?', 'At stage boundaries, when real statistics from completed shuffles become available.'],
 ['Does AQE fix skew in a groupBy?', 'No — the skew-join optimisation applies to joins. An aggregation on a hot key is still one task.'],
 ['Does AQE fix read-side partition counts?', 'No. Those come from your file layout; AQE only reshapes post-shuffle partitions.'],
 ['How does Spark define a skewed partition?', 'More than a factor (default 5) times the median AND above a byte threshold (default 256 MB).'],
 ['Why can explain() mislead with AQE on?', 'The pre-run plan is the initial guess; the final plan is only available after completion.']
]});

M.push({
code: 'X3', track: 'Track X · Internals', theory: true,
title: 'Memory, spill and the failures they cause',
sub: 'Where executor memory goes, what spill actually is, and how to read the four common OOMs.',
lede: 'Most Spark failures in production are memory failures, and they present as four distinct errors with four different causes. Being able to tell them apart \u2014 rather than raising <code>executor.memory</code> and hoping \u2014 is the difference between fixing a job and perturbing it.',
ex: [
 { t: 'The executor memory model', ref: true,
   code: "Container (what YARN or Kubernetes allocates)\n|\n+-- spark.executor.memoryOverhead      ~10%, min 384MB\n|     off-heap: shuffle buffers, netty, PYTHON WORKERS\n|\n+-- spark.executor.memory (JVM heap)\n      |\n      +-- reserved                      300MB, fixed\n      +-- unified pool  (spark.memory.fraction, default 0.6)\n      |     +-- execution   shuffles, joins, sorts, aggregations\n      |     +-- storage     cached blocks\n      |         (they borrow from each other; execution can evict storage)\n      +-- user memory  (0.4)            your data structures, UDF state",
   note: 'PySpark workers live in the OVERHEAD, not the heap. A Python-heavy job with default overhead is the most common cause of "Container killed by YARN" — and raising executor.memory makes it worse by leaving less room for overhead inside the same container.' }
],
body: [
 { h: 'Unified memory', html:
   '<p>Execution and storage share one pool. Execution can <strong>evict</strong> cached blocks when it needs space; storage cannot evict execution. That asymmetry is deliberate \u2014 losing a cached partition costs a recomputation, whereas failing a shuffle costs the stage.</p>' +
   '<p>The practical consequence: caching aggressively on a job that also does large shuffles does not just risk eviction, it makes the cache close to useless while giving you all its overhead.</p>' },
 { h: 'What spill actually is', html:
   '<p>When execution memory fills during a shuffle, sort or aggregation, Spark writes the in-progress data to local disk and continues. It is a graceful degradation, not an error \u2014 the job completes, slowly. That is why a job can be five times slower with no failure and no obvious cause.</p>' +
   '<div class="pre">Spark UI, stage detail:\n  Shuffle Spill (Memory)   the in-memory size of what was spilled\n  Shuffle Spill (Disk)     the serialised size actually written\n\nNon-zero spill = the partitions are too big for the memory available.\nFix by increasing partition count, not by adding memory first.</div>' },
 { h: 'The four failures', html:
   '<table><thead><tr><th>Error</th><th>Actual cause</th><th>Fix</th></tr></thead><tbody>' +
   '<tr><td><b>Executor OOM</b> (java.lang.OutOfMemoryError)</td><td>Partition too large, skew, or a huge <code>collect_list</code></td><td>More partitions; fix skew; avoid collecting per key</td></tr>' +
   '<tr><td><b>Container killed by YARN</b></td><td>Heap + overhead exceeded the container; often Python workers</td><td>Raise <code>memoryOverhead</code>, or fewer cores per executor</td></tr>' +
   '<tr><td><b>Driver OOM</b></td><td><code>collect()</code> on a large result, or broadcasting something large</td><td>Do not collect; check the broadcast size</td></tr>' +
   '<tr><td><b>FetchFailedException</b></td><td>An executor died mid-shuffle, so its shuffle files vanished</td><td>Find the <em class="hl">first</em> failure \u2014 this is a symptom, not a cause</td></tr>' +
   '</tbody></table>' +
   '<p><code>FetchFailedException</code> is the one that wastes the most time. It means a downstream task could not read shuffle output because the executor holding it is gone. The real error is whatever killed that executor, several minutes earlier in the log.</p>' },
 { h: 'Sizing executors', html:
   '<p>The conventional starting point: <strong>four to five cores per executor</strong>, not more. Beyond that, HDFS and S3 client throughput per executor plateaus and garbage collection pauses lengthen. Many medium executors beat a few enormous ones, and one core per executor wastes memory on duplicated overhead.</p>' }
],
call: '"PySpark workers live in memoryOverhead rather than the JVM heap, so a Python-heavy job hitting \'Container killed by YARN\' usually needs more overhead, not more executor memory \u2014 raising the heap inside a fixed container makes it worse. And FetchFailedException is a symptom: the real failure is whatever killed the executor holding the shuffle files."',
warn: 'Spill is not an error. A job that is inexplicably five times slower with no failures is very often spilling, and nothing in the logs says so — you have to look at the Shuffle Spill metrics in the stage detail. The fix is usually more partitions rather than more memory.',
qf: [
 ['How is executor memory divided?', 'Container = heap plus overhead. Heap = reserved, unified pool (execution and storage sharing spark.memory.fraction), and user memory.'],
 ['Where do PySpark workers get their memory?', 'From memoryOverhead, outside the JVM heap.'],
 ['What is spill?', 'Writing in-progress shuffle or aggregation data to local disk when execution memory fills — slow, but not a failure.'],
 ['Executor OOM versus container killed by YARN?', 'The first is JVM heap exhaustion; the second is heap plus overhead exceeding the container allocation.'],
 ['What does FetchFailedException indicate?', 'An executor holding shuffle output died — it is a symptom, so find the earlier root failure.'],
 ['How many cores per executor?', 'Roughly four to five; beyond that I/O throughput plateaus and GC pauses grow.']
]});

M.push({
code: 'X4', track: 'Track X · Internals', theory: true,
title: 'Reading the Spark UI and diagnosing a slow job',
sub: 'A repeatable diagnostic sequence, so tuning is measurement rather than folklore.',
lede: 'Almost every Spark tuning question in an interview is really asking whether you diagnose or guess. The distinguishing behaviour is starting from evidence \u2014 the stage timeline, the task distribution, the spill metrics \u2014 and changing one thing at a time.',
ex: [
 { t: 'The diagnostic sequence', ref: true,
   code: "1. WHICH stage is slow?            Jobs tab -> Stages, sort by duration\n2. ONE task or ALL tasks?          Stage detail -> task duration summary\n     max >> median   -> SKEW       check the key distribution FIRST\n     all tasks slow  -> volume, partition sizing, or spill\n3. Is it SPILLING?                 Shuffle Spill (Memory / Disk) non-zero\n4. How many EXCHANGES?             SQL tab -> the completed plan\n5. Can the small side be BROADCAST? biggest single win available\n6. Is the cluster IDLE?            event timeline -> gaps = scheduling or driver work\n\nThen change ONE thing and re-measure.",
   note: 'The order matters. Checking key distribution before touching configuration is what separates a diagnosis from a guess — skew and under-provisioning look identical from the outside, and they have opposite fixes.' }
],
body: [
 { h: 'The tabs that matter', html:
   '<table><thead><tr><th>Tab</th><th>What you get</th></tr></thead><tbody>' +
   '<tr><td><b>Jobs</b></td><td>One row per action. Find the slow job first.</td></tr>' +
   '<tr><td><b>Stages</b></td><td>The task duration distribution \u2014 min, median, max. Skew lives here.</td></tr>' +
   '<tr><td><b>SQL</b></td><td>The <em class="hl">final</em> plan with per-node row counts and timings. The most useful tab.</td></tr>' +
   '<tr><td><b>Executors</b></td><td>Per-executor task counts, GC time, memory. Uneven counts mean skew or locality problems.</td></tr>' +
   '<tr><td><b>Storage</b></td><td>What is actually cached, and how much of it fitted.</td></tr>' +
   '</tbody></table>' +
   '<p>The SQL tab is the one to learn properly: it shows the plan that ran with actual row counts at each node, so you can see exactly where the data volume exploded rather than inferring it.</p>' },
 { h: 'Reading the numbers', html:
   '<table><thead><tr><th>Observation</th><th>Likely cause</th></tr></thead><tbody>' +
   '<tr><td>max task time >> median</td><td>Skew</td></tr>' +
   '<tr><td>All tasks slow, spill non-zero</td><td>Partitions too large</td></tr>' +
   '<tr><td>Thousands of tasks, each milliseconds</td><td>Too many partitions; scheduling overhead</td></tr>' +
   '<tr><td>High GC time in Executors</td><td>Memory pressure, or too many cores per executor</td></tr>' +
   '<tr><td>Gaps in the event timeline</td><td>Driver-side work, or waiting for resources</td></tr>' +
   '<tr><td>Shuffle read far exceeds shuffle write</td><td>A join is fanning out</td></tr>' +
   '</tbody></table>' },
 { h: 'The answer to give', html:
   '<p>When asked "this job is slow, what do you do?", do not list tuning tips. Describe the sequence: find the slow stage, look at the task distribution to separate skew from volume, check spill, count Exchanges, and ask whether the small side can be broadcast. Then say you would change one thing and re-measure.</p>' +
   '<p>That answer demonstrates method rather than recall, and it is the same shape as the answer to a slow SQL query or an expensive Athena scan \u2014 which is worth pointing out if the conversation allows it.</p>' }
],
call: '"I start from the stage timeline and the task duration distribution rather than a tuning checklist. Max far above median means skew; all tasks slow with non-zero spill means the partitions are too large. Those are opposite fixes, and guessing between them is how people spend a week tuning the wrong thing."',
warn: 'Changing several settings at once means you learn nothing from the result. If the job gets faster you cannot attribute it, and if it gets slower you cannot revert intelligently. One change, one measurement — every time.',
qf: [
 ['First question on a slow job?', 'Which stage is slow — then whether one task or all tasks are slow.'],
 ['How do you distinguish skew from under-provisioning?', 'Task duration distribution: max far above median is skew; uniformly slow tasks are volume or sizing.'],
 ['Which UI tab is most useful?', 'The SQL tab — the final plan with actual per-node row counts and timings.'],
 ['What does non-zero shuffle spill mean?', 'Partitions are too large for available execution memory. Increase partition count before adding memory.'],
 ['What do thousands of millisecond-long tasks indicate?', 'Too many partitions — scheduling overhead dominates.'],
 ['What does shuffle read far exceeding write suggest?', 'A join is fanning out.']
]});

M.push({
code: 'I1', track: 'Track I · Schemas & I/O', theory: true,
title: 'Schemas, types and reading data',
sub: 'Inference costs a scan and guesses wrong. Declaring the schema is the production default.',
lede: 'Every DataFrame has a schema. Where it comes from is a real decision: inferred from the data, read from a catalog, or declared by you. Inference is convenient in a notebook and wrong in a pipeline, because it costs an extra pass over the data and silently changes types when the data changes.',
ex: [
 { t: 'Declaring a schema explicitly', ref: true,
   code: "from pyspark.sql.types import (StructType, StructField, StringType,\n                               DecimalType, TimestampType, IntegerType)\n\nschema = StructType([\n    StructField('txn_id',     StringType(),        nullable=False),\n    StructField('src_wallet', StringType(),        nullable=False),\n    StructField('amount_usd', DecimalType(12, 2),  nullable=True),\n    StructField('ts',         TimestampType(),     nullable=True),\n    StructField('is_flagged', IntegerType(),       nullable=True),\n])\n\ndf = (spark.read\n      .schema(schema)                 # no inference pass, no type surprises\n      .option('mode', 'FAILFAST')     # fail loudly on a bad record\n      .json('s3://lake/bronze/transfers/'))",
   note: 'Three wins: no extra scan, stable types across runs, and a schema you can review in a pull request. FAILFAST means a malformed record stops the job instead of quietly becoming null — which is what you want in bronze.' },
 { t: 'Corrupt-record handling, and the trap', ref: true,
   code: "# PERMISSIVE (default) \u2014 bad fields become null, row is kept\n# DROPMALFORMED       \u2014 bad rows silently discarded      <-- dangerous\n# FAILFAST            \u2014 job fails on the first bad record\n\ndf = (spark.read\n      .schema(schema.add('_corrupt_record', StringType()))\n      .option('mode', 'PERMISSIVE')\n      .option('columnNameOfCorruptRecord', '_corrupt_record')\n      .json(path))\n\n# THE TRAP: filtering or counting _corrupt_record alone raises, because the\n# column only exists during the parse. Cache or write the DataFrame first.\ndf.cache()\nbad = df.filter(col('_corrupt_record').isNotNull())",
   note: 'DROPMALFORMED is the mode to be suspicious of: rows disappear with no error and no count. If you use PERMISSIVE, actually monitor the corrupt-record count — an unmonitored corrupt column is the same as DROPMALFORMED with extra steps.' },
 { t: 'Reading formats and pushing filters down', ref: true,
   code: "spark.read.parquet('s3://lake/silver/transfers/')          # schema in the footer\nspark.read.option('mergeSchema','true').parquet(path)     # costs a scan of all footers\nspark.read.format('delta').load(path)\nspark.read.table('glue_catalog.fraud.transfers')          # schema from the catalog\n\n# JDBC: without partitioning this is ONE task pulling the whole table\n(spark.read.format('jdbc')\n   .option('url', url).option('dbtable', 'transfers')\n   .option('partitionColumn', 'txn_id_hash')\n   .option('lowerBound', 0).option('upperBound', 1024)\n   .option('numPartitions', 16)                           # 16 parallel range queries\n   .load())",
   note: 'The JDBC default is a single connection and a single task, however large the cluster. partitionColumn with bounds is what makes it parallel — and it must be a numeric, date or timestamp column that is reasonably uniform, or you have just recreated skew.' }
],
body: [
 { h: 'Where a schema comes from', html:
   '<table><thead><tr><th>Source</th><th>Cost</th><th>Use in production?</th></tr></thead><tbody>' +
   '<tr><td>Inferred from JSON or CSV</td><td>A full extra scan; types can change between runs</td><td><b>No</b></td></tr>' +
   '<tr><td>Parquet or ORC footer</td><td>Cheap \u2014 the schema is stored with the data</td><td>Yes</td></tr>' +
   '<tr><td>Catalog (Glue, Hive)</td><td>Free, and shared across engines</td><td><b>Yes</b></td></tr>' +
   '<tr><td>Declared in code</td><td>Free, reviewable, version-controlled</td><td><b>Yes \u2014 for bronze ingestion</b></td></tr>' +
   '</tbody></table>' },
 { h: 'Nullability is a promise, not a filter', html:
   '<p><code>nullable=False</code> does not reject nulls. Spark treats it as an optimisation hint, and passing a null into a non-nullable field produces undefined behaviour rather than an error. If you need the constraint enforced, write an assertion \u2014 exactly the zero-rows-means-pass pattern from the SQL bench.</p>' },
 { h: 'Schema evolution', html:
   '<ul>' +
   '<li><strong>Adding a column</strong> is safe in Parquet; older files read it as null.</li>' +
   '<li><strong>Removing one</strong> breaks readers that project it explicitly.</li>' +
   '<li><strong>Changing a type</strong> is the dangerous one \u2014 an int becoming a string silently breaks casts downstream.</li>' +
   '<li><strong><code>mergeSchema</code></strong> reconciles differing footers but reads every one of them, so it is expensive on a large table and not a substitute for a contract.</li>' +
   '</ul>' +
   '<p>This is what a table format buys you: Iceberg tracks columns by <em class="hl">field id</em> rather than by name or position, so renames and reorders are safe operations rather than hopeful ones.</p>' }
],
call: '"I declare schemas explicitly for bronze ingestion rather than inferring them \u2014 inference costs an extra full scan and silently changes types when the data changes, so the same job produces a different schema on Tuesday. And a JDBC read without a partitionColumn is a single task no matter how large the cluster."',
warn: 'DROPMALFORMED discards bad rows with no error and no count. PERMISSIVE with an unmonitored corrupt-record column is the same failure wearing a disguise. If you accept malformed input, you must emit a metric for how much you accepted.',
qf: [
 ['Why avoid schema inference in production?', 'It costs an extra full scan and can produce different types on different runs.'],
 ['What are the three read modes?', 'PERMISSIVE (nulls the bad fields), DROPMALFORMED (silently drops rows), FAILFAST (errors).'],
 ['Does nullable=False reject nulls?', 'No — it is an optimisation hint. Enforce it with an assertion.'],
 ['Why is a JDBC read often slow?', 'Without partitionColumn, lowerBound, upperBound and numPartitions it runs as one task on one connection.'],
 ['What does mergeSchema cost?', 'Reading every file footer to reconcile schemas — expensive on large tables.'],
 ['Why is Iceberg schema evolution safer?', 'It tracks columns by field id rather than name or position, so renames and reorders are safe.']
]});

M.push({
code: 'I2', track: 'Track I · Schemas & I/O',
title: 'Complex types: arrays and structs',
sub: 'Nesting stored natively — and the row multiplication that follows an explode.',
lede: 'Semi-structured data arrives with nesting, and Spark handles it natively rather than forcing you to flatten at ingest. The two operations that matter are projecting into a struct and exploding an array \u2014 and the second one changes the grain, which makes it the same correctness problem as a join.',
ex: [
 { t: 'Structs are dotted access, no join needed',
   code: "spark.table('events')\n  .withColumn('cost_per_gas', round(col('fee.usd') / col('fee.gas') * 1000000, 3))\n  .select('event_id', 'kind', col('fee.gas').alias('gas'), col('fee.usd').alias('fee_usd'), 'cost_per_gas')\n  .show()",
   note: 'A struct is a nested record stored inline. Columnar formats keep its fields as separate columns internally, so projecting fee.usd reads only that field — no join and no fan-out. Structs are genuinely cheap and a reasonable default for tightly coupled attributes.' },
 { t: 'Array membership without changing the grain',
   code: "spark.table('events')\n  .select('event_id', 'labels')\n  .withColumn('n_labels', size(col('labels')))\n  .withColumn('is_large', array_contains(col('labels'), 'large'))\n  .show()",
   note: 'Seven events in, seven out. Look at e-04: its labels are null, so size returns -1 and array_contains returns null. The -1 is Spark’s default behaviour rather than a bug, and it is why summing a size column quietly gives a number lower than you expect.' },
 { t: 'explode changes the grain — and drops rows',
   code: "spark.table('events')\n  .select('event_id', explode(col('labels')).alias('label'))\n  .show(20)",
   note: 'Seven events become eight rows, and only five events survive. e-03 has an empty array and e-04 has a null one, and explode drops both exactly as an inner join would. The Generate line in the plan says so explicitly.' },
 { t: 'explode_outer keeps them',
   code: "spark.table('events')\n  .select('event_id', explode_outer(col('labels')).alias('label'))\n  .show(20)",
   note: 'Ten rows now, and all seven events appear — e-03 and e-04 come through with a null label. If your entity count falls after an unnest and you did not intend it, this is the fix.' },
 { t: 'Aggregate at the element grain, then stop',
   code: "spark.table('events')\n  .select('event_id', explode(col('labels')).alias('label'))\n  .groupBy('label')\n  .agg(count('*').alias('occurrences'), countDistinct('event_id').alias('events'))\n  .orderBy(col('occurrences').desc(), col('label'))\n  .show()",
   note: 'Explode, do the element-level work, and stop. Occurrences and events are counted separately — after an unnest those are different questions, and conflating them is the usual error. Never join a measure onto this without collapsing back to the event grain first.' },
 { t: 'Building arrays and structs',
   code: "spark.table('wallets')\n  .select('wallet_id', array(col('chain'), coalesce(col('risk_band'), lit('unknown'))).alias('tags'), struct(col('chain'), col('risk_band')).alias('meta'))\n  .withColumn('first_tag', element_at(col('tags'), 1))\n  .withColumn('joined', array_join(col('tags'), '/'))\n  .show()",
   note: 'array() and struct() build nested values from columns. element_at is 1-indexed like substring. array_join skips nulls, which is why the coalesce matters — without it a null band would silently shorten the joined string rather than erroring.' }
],
body: [
 { h: 'The grain rule, restated for arrays', html:
   '<table><thead><tr><th>Stage</th><th>One row is</th><th>Safe to sum a measure?</th></tr></thead><tbody>' +
   '<tr><td>Before explode</td><td>One event</td><td>Yes</td></tr>' +
   '<tr><td>After explode</td><td>One event-element pair</td><td><b>No</b></td></tr>' +
   '<tr><td>After re-aggregating to event</td><td>One event</td><td>Yes</td></tr>' +
   '</tbody></table>' +
   '<p>Explode, do the element-level work, collapse back before joining anything with a measure. Or avoid exploding entirely with <code>array_contains</code> when the question is only membership \u2014 which is cheaper and cannot fan out.</p>' },
 { h: 'Struct versus array, as a modelling choice', html:
   '<p>A <strong>struct</strong> is a nested record stored inline. Columnar formats store its fields as separate columns internally, so projecting <code>fee.usd</code> reads only that field. Structs are genuinely cheap and a reasonable default for tightly coupled attributes.</p>' +
   '<p>An <strong>array</strong> is a one-to-many relationship hidden inside a row. Every query either explodes it or works around it. Denormalising a small stable list is fine; storing an unbounded event history as an array is a modelling mistake that will be discovered by whoever has to query it.</p>' },
 { h: 'Useful functions worth knowing exist', html:
   '<div class="pre code">explode / explode_outer / posexplode      <i>array -> rows</i>\narray_contains, size, array_distinct      <i>array -> value, no fan-out</i>\ntransform, filter, aggregate              <i>higher-order functions on arrays</i>\nfrom_json / to_json / schema_of_json      <i>JSON string &lt;-&gt; struct</i>\nmap_keys, map_values, element_at          <i>maps</i>\nstruct(), named_struct()                  <i>build a struct</i></div>' +
   '<p>The higher-order functions \u2014 <code>transform</code>, <code>filter</code>, <code>aggregate</code> \u2014 operate on arrays without exploding and without a UDF. They are the answer to "I need to apply logic per element" and are underused because people reach for a UDF first.</p>' }
],
call: '"Exploding an array is deliberate fan-out \u2014 the grain becomes one row per element \u2014 so I collapse back before joining anything with a measure, and use array_contains when the question is only membership. Higher-order functions like transform and filter handle per-element logic without exploding and without a UDF."',
warn: 'explode() silently drops rows with empty or null arrays, exactly like an inner join. If your entity count falls after an unnest, use explode_outer — the failure is invisible because the remaining rows are all correct.',
qf: [
 ['What does explode do to the grain?', 'One row per array element instead of one per parent row — deliberate fan-out.'],
 ['explode versus explode_outer?', 'explode drops rows with empty or null arrays; explode_outer keeps them with a null.'],
 ['How do you test array membership without exploding?', 'array_contains — it keeps one row per parent.'],
 ['Struct versus array cost?', 'Structs are stored as separate columns internally, so they are cheap. Arrays hide a one-to-many and force an unnest.'],
 ['Is Spark SQL slower than the DataFrame API?', 'No — both compile to the same logical plan. The choice is readability.'],
 ['What are higher-order functions for?', 'Per-element logic on arrays — transform, filter, aggregate — without exploding and without a UDF.']
]});
