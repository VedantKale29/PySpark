M.push({
code: 'E1', track: 'Track E · ETL patterns', title: 'Deduplication and idempotency',
sub: 'Every pipeline is re-run. The question is whether running it twice changes the answer.',
lede: 'Retries after a failure, backfills, at-least-once delivery — a load runs more than once and you do not get to choose when. A load is <em class="hl">idempotent</em> if running it twice leaves the table identical to running it once, and in Spark that starts with deciding which copy of a duplicated row wins.',
ex: [
 { t: 'Find the duplicates before deciding anything',
   code: "spark.table('stg_transfers') \\\n  .groupBy('txn_id') \\\n  .agg(count('*').alias('copies')) \\\n  .filter(col('copies') > 1) \\\n  .show()",
   note: 'Always run this first. Group by what you believe is the key and see whether the belief holds. t-61 arrived twice. If this returns rows, every downstream aggregate is already wrong.' },
 { t: 'Keep exactly one — latest ingestion wins',
   code: "spark.table('stg_transfers') \\\n  .withColumn('rn', row_number().over(\n      Window.partitionBy('txn_id').orderBy(col('ingested_at').desc()))) \\\n  .filter(col('rn') == 1) \\\n  .select('txn_id', 'src_wallet', 'amount_usd', 'ingested_at') \\\n  .orderBy('txn_id') \\\n  .show()",
   note: 'Five rows become four. ORDER BY ingested_at DESC keeps the newest copy — right when later arrivals are corrections. Flip to ascending when the first write should win. The choice is semantic, not stylistic, and it belongs in a comment.' },
 { t: 'Deterministic dedup needs a unique tiebreaker',
   code: "spark.table('stg_transfers') \\\n  .withColumn('rn', row_number().over(\n      Window.partitionBy('txn_id').orderBy(col('ingested_at').desc(), col('src_wallet')))) \\\n  .filter(col('rn') == 1) \\\n  .select('txn_id', 'amount_usd', 'ingested_at', 'rn') \\\n  .orderBy('txn_id') \\\n  .show()",
   note: 'If two copies share an ingested_at, which survives is arbitrary — and in a distributed engine it can differ between runs. Adding a second, unique ordering column makes the choice reproducible. A non-deterministic dedup is not idempotent.' },
 { t: 'Business key, not just the primary key',
   code: "spark.table('stg_transfers') \\\n  .groupBy('src_wallet', 'ts', 'amount_usd') \\\n  .agg(count('*').alias('copies'), countDistinct('txn_id').alias('distinct_ids')) \\\n  .filter(col('copies') > 1) \\\n  .orderBy(col('copies').desc()) \\\n  .show(8)",
   note: 'Two groups come back. One is t-61 duplicated on its own id; the other is t-62 and t-64 \u2014 distinct_ids of 2 means the same business event arrived twice under different ids. That second case is the harder one: it survives every primary-key check and double-counts every metric derived from it.' }
],
body: [
 { h: 'The three idempotency strategies', html:
   '<table><thead><tr><th>Strategy</th><th>How</th><th>Right for</th></tr></thead><tbody>' +
   '<tr><td><b>Merge on key</b></td><td>MERGE INTO on Delta or Iceberg</td><td>Mutable dimensions, CDC targets</td></tr>' +
   '<tr><td><b>Overwrite partition</b></td><td>Dynamic partition overwrite</td><td><b>Immutable daily facts \u2014 the common lakehouse default</b></td></tr>' +
   '<tr><td><b>Append + dedupe on read</b></td><td>Append everything, ROW_NUMBER in the view</td><td>High-throughput streams where write latency matters</td></tr>' +
   '</tbody></table>' +
   '<p>For a daily fact table the partition overwrite is almost always right: simpler than a merge, cheaper, and naturally idempotent because re-running replaces rather than adds.</p>' },
 { h: 'The three decisions in any dedup', html:
   '<ol>' +
   '<li><strong>What is the key?</strong> The primary key catches replays. A business key catches the same event arriving with a new id. Know which problem you have.</li>' +
   '<li><strong>Which copy wins?</strong> Latest ingestion for corrections, earliest for immutable events. State it in the ORDER BY.</li>' +
   '<li><strong>Is it deterministic?</strong> Ties in the ordering mean the survivor can change between runs.</li>' +
   '</ol>' },
 { h: 'dropDuplicates is not enough', html:
   '<div class="pre code">df.dropDuplicates([\'txn_id\'])\n   <u>keeps an arbitrary row \u2014 you do not control which, and it can vary</u>\n\ndf.withColumn(\'rn\', row_number().over(\n      Window.partitionBy(\'txn_id\').orderBy(col(\'ingested_at\').desc(), col(\'src_wallet\'))))\n  .filter(col(\'rn\') == 1)\n   <i>keeps a specific, reproducible row</i></div>' +
   '<p><code>dropDuplicates</code> is fine when the rows are genuinely identical. The moment they differ in a metadata column \u2014 which is exactly what a replay looks like \u2014 you need the window form.</p>' }
],
call: '"A load is idempotent when running it twice leaves the table identical, so I deduplicate with row_number over a business key ordered by ingestion time \u2014 dropDuplicates keeps an arbitrary row, and a replay usually differs in a metadata column, so it is not the same thing at all."',
warn: 'Deduplicating on the primary key alone is often the wrong key. Two rows with different ids can be the same business event, and that duplicate survives every primary-key check while double-counting every metric derived from it.',
qf: [
 ['What does idempotent mean for a load?', 'Running it twice leaves the target identical to running it once.'],
 ['How do you deduplicate deterministically?', 'row_number over the key, ordered by a rule that includes a unique tiebreaker, filtered to 1.'],
 ['Why is dropDuplicates insufficient?', 'It keeps an arbitrary row; a replay differing in a metadata column is not identical, and you do not control which survives.'],
 ['Name the three idempotency strategies.', 'Merge on key, overwrite the affected partition, or append and dedupe on read.'],
 ['Which is usually right for daily facts?', 'Dynamic partition overwrite — simpler and cheaper than a merge, and naturally idempotent.'],
 ['Primary key or business key?', 'The primary key catches replays; a business key catches the same event re-sent with a new id.']
]});

M.push({
code: 'E2', track: 'Track E · ETL patterns', title: 'Incremental loads and watermarks',
sub: 'Load only what changed — and the late arrival that a naive watermark loses silently.',
lede: 'Full reloads stop being viable long before the data gets genuinely large. Incremental loading means keeping a high-water mark and pulling only what is newer. The whole difficulty is that "newer" is ambiguous when events arrive out of order, and choosing the wrong clock drops data with no error at all.',
ex: [
 { t: 'Establish the current watermark',
   code: "spark.table('transfers') \\\n  .agg(max('ts').alias('max_event_time'),\n       count('*').alias('rows_loaded')) \\\n  .show()",
   note: 'The high-water mark of the curated table. The naive incremental load is "everything with ts greater than this" — and the next example shows what that misses.' },
 { t: 'The naive pull, and what it drops',
   code: "spark.table('stg_transfers') \\\n  .withColumn('is_new_by_event_time', col('ts') > lit('2026-02-14')) \\\n  .withColumn('is_new_by_ingestion',  col('ingested_at') > lit('2026-02-13')) \\\n  .select('txn_id', 'ts', 'ingested_at', 'is_new_by_event_time', 'is_new_by_ingestion') \\\n  .orderBy('txn_id') \\\n  .show()",
   note: 'Look at t-11: event time 2026-02-06 but ingested on the 14th. An event-time watermark says false and skips it; an ingestion-time watermark says true and catches it. That row is a late arrival, and filtering on event time loses it permanently with no error.' },
 { t: 'Watermark on ingestion time',
   code: "spark.table('stg_transfers') \\\n  .filter(col('ingested_at') > lit('2026-02-13')) \\\n  .select('txn_id', 'ts', 'ingested_at', 'amount_usd') \\\n  .orderBy('ingested_at', 'txn_id') \\\n  .show()",
   note: 'Ingestion time is monotonic even when event time is not, so nothing is skipped. Partition and report on event time; drive the incremental read from ingestion time. That is why pipelines carry both timestamps.' },
 { t: 'The lookback window — the pragmatic compromise',
   code: "spark.table('stg_transfers') \\\n  .filter(col('ts') >= lit('2026-02-06')) \\\n  .withColumn('rn', row_number().over(\n      Window.partitionBy('txn_id').orderBy(col('ingested_at').desc()))) \\\n  .filter(col('rn') == 1) \\\n  .select('txn_id', 'ts', 'ingested_at') \\\n  .orderBy('txn_id') \\\n  .show()",
   note: 'Reprocess a fixed window on every run and merge on the key. More compute, but late arrivals inside the window are absorbed automatically. Idempotency is what makes this safe — without it you would be duplicating rows every run.' }
],
body: [
 { h: 'Two clocks, and why you need both', html:
   '<table><thead><tr><th></th><th>Event time</th><th>Ingestion time</th></tr></thead><tbody>' +
   '<tr><td>Means</td><td>When it happened</td><td>When you received it</td></tr>' +
   '<tr><td>Monotonic</td><td>No \u2014 arrivals can be late</td><td>Yes</td></tr>' +
   '<tr><td>Correct for partitioning and reporting</td><td><b>Yes</b></td><td>No</td></tr>' +
   '<tr><td>Correct for the watermark</td><td>No \u2014 skips late rows</td><td><b>Yes</b></td></tr>' +
   '</tbody></table>' },
 { h: 'The four strategies', html:
   '<table><thead><tr><th>Strategy</th><th>Trade-off</th></tr></thead><tbody>' +
   '<tr><td>Full reload</td><td>Always correct, does not scale</td></tr>' +
   '<tr><td>Watermark on ingestion time</td><td>Needs the column and a reliable clock</td></tr>' +
   '<tr><td>Lookback window plus merge</td><td>Simple and robust; extra compute</td></tr>' +
   '<tr><td>CDC from the source log</td><td>Exact, catches deletes, most infrastructure</td></tr>' +
   '</tbody></table>' },
 { h: 'Deletes are invisible', html:
   '<p>A timestamp-based incremental pull cannot see a delete \u2014 the row simply stops existing and nothing marks it. If deletes matter you need CDC, a soft-delete flag, or a periodic full reconciliation. Raising this unprompted is a strong signal, because it is the gap most candidates miss entirely.</p>' }
],
call: '"I watermark on ingestion time and partition on event time, because event time is not monotonic \u2014 a transaction dated the sixth can arrive on the fourteenth, and an event-time watermark drops it silently. A lookback window plus an idempotent merge absorbs late arrivals without needing a perfect watermark."',
warn: 'Late arrivals fail silently. There is no error and no failed task — just rows that never load. The only defence is a scheduled reconciliation between source and target counts, because the pipeline cannot report on data it never saw.',
qf: [
 ['Event time or ingestion time for the watermark?', 'Ingestion time — it is monotonic. Event time is for partitioning and reporting.'],
 ['What is a lookback window?', 'Reprocessing the last N periods every run and merging, so late arrivals are absorbed.'],
 ['Why does that require idempotency?', 'The same rows are reprocessed each run; without a keyed merge or partition overwrite they would duplicate.'],
 ['Why can incremental loads miss deletes?', 'A deleted row leaves no timestamp to filter on — you need CDC, soft deletes, or reconciliation.'],
 ['Why carry both timestamps?', 'Partition and report on event time for correctness; drive the incremental read from ingestion time so nothing is skipped.'],
 ['How would you detect the problem in production?', 'Reconcile source and target row counts on a schedule — the pipeline cannot alarm on data it never received.']
]});

M.push({
code: 'E3', track: 'Track E · ETL patterns', title: 'SCD Type 2 and change detection',
sub: 'Classify every incoming row as insert, update or no-op before you write anything.',
lede: 'A dimension load is not an overwrite. Each incoming row is one of three things — genuinely new, a changed version of something you hold, or identical to what is already there — and a Type 2 dimension has to tell them apart to preserve history. The classification is a join, and it is worth computing and inspecting before any write.',
ex: [
 { t: 'Classify the incoming feed',
   code: "incoming = spark.table('wallets_incoming') \\\n  .withColumnRenamed('risk_band', 'new_band') \\\n  .select('wallet_id', 'new_band')\ncurrent = spark.table('wallets') \\\n  .withColumnRenamed('risk_band', 'cur_band') \\\n  .select('wallet_id', 'cur_band')\n\nincoming.join(current, 'wallet_id', 'left') \\\n  .withColumn('action',\n      when(col('cur_band').isNull(), 'INSERT')\n      .when(col('new_band') != col('cur_band'), 'UPDATE')\n      .otherwise('NO-OP')) \\\n  .orderBy('wallet_id') \\\n  .show()",
   note: 'Five incoming rows: two unchanged, two with a new risk band, one wallet never seen before. Rename before joining — both sides have risk_band, and without the rename you cannot compare them. This classification is what a MERGE does internally, made visible.' },
 { t: 'Only the rows that actually changed',
   code: "incoming = spark.table('wallets_incoming').withColumnRenamed('risk_band','new_band')\ncurrent  = spark.table('wallets').withColumnRenamed('risk_band','cur_band')\n\nincoming.select('wallet_id', 'new_band', 'loaded_on') \\\n  .join(current.select('wallet_id', 'cur_band'), 'wallet_id', 'left') \\\n  .filter(col('cur_band').isNull() | (col('new_band') != col('cur_band'))) \\\n  .withColumn('valid_from', col('loaded_on')) \\\n  .withColumn('valid_to', lit('9999-12-31')) \\\n  .withColumn('is_current', lit(1)) \\\n  .select('wallet_id', 'new_band', 'valid_from', 'valid_to', 'is_current') \\\n  .orderBy('wallet_id') \\\n  .show()",
   note: 'The new version rows, ready to insert. Note the null-safe condition: without the isNull branch, a brand-new wallet is excluded because null != anything is null, not true. That single omission silently drops every new entity.' },
 { t: 'Rows to close off',
   code: "incoming = spark.table('wallets_incoming').withColumnRenamed('risk_band','new_band')\n\nspark.table('wallets').withColumnRenamed('risk_band','cur_band') \\\n  .join(incoming.select('wallet_id', 'new_band', 'loaded_on'), 'wallet_id', 'inner') \\\n  .filter(col('new_band') != col('cur_band')) \\\n  .withColumn('valid_to', col('loaded_on')) \\\n  .withColumn('is_current', lit(0)) \\\n  .select('wallet_id', 'cur_band', 'valid_to', 'is_current') \\\n  .orderBy('wallet_id') \\\n  .show()",
   note: 'The mirror image: existing rows whose attributes changed get their valid_to set and their is_current flag cleared. Insert the new versions and close these, and you have a Type 2 dimension.' },
 { t: 'Detecting change across many columns',
   code: "incoming = spark.table('wallets_incoming') \\\n  .withColumn('row_hash', concat(col('address'), lit('|'), col('chain'), lit('|'), coalesce(col('risk_band'), lit('~')))) \\\n  .select('wallet_id', 'row_hash')\ncurrent = spark.table('wallets') \\\n  .withColumn('cur_hash', concat(col('address'), lit('|'), col('chain'), lit('|'), coalesce(col('risk_band'), lit('~')))) \\\n  .select('wallet_id', 'cur_hash')\n\nincoming.join(current, 'wallet_id', 'left') \\\n  .withColumn('changed', when(col('cur_hash').isNull(), lit(1))\n                         .when(col('row_hash') != col('cur_hash'), lit(1))\n                         .otherwise(lit(0))) \\\n  .orderBy('wallet_id') \\\n  .show()",
   note: 'Comparing twenty columns individually is unreadable and error-prone. Hash the tracked attributes into one value and compare that. Note the coalesce on the nullable column — without it a null makes the whole hash null and every comparison fails.' }
],
body: [
 { h: 'The Type 2 mechanics', html:
   '<div class="pre">surrogate key   <i>unique per row \u2014 the fact table joins on this</i>\nbusiness key    <i>wallet_id \u2014 repeats across versions</i>\nvalid_from      <i>inclusive</i>\nvalid_to        <i>exclusive \u2014 9999-12-31 for the open row</i>\nis_current      <i>convenience flag; must stay consistent with valid_to</i></div>' +
   '<p>Half-open intervals prevent double-counting: a fact dated exactly on a changeover matches one version, not two. Inclusive on both ends is the classic SCD bug, and it only affects the entities that changed, so the totals look almost right.</p>' },
 { h: 'The MERGE, on a table format', html:
   '<div class="pre code">-- Delta or Iceberg, from Spark SQL. Not executable in this bench.\nMERGE INTO dim_wallet AS t\nUSING staged_changes AS s\n  ON t.wallet_id = s.wallet_id AND t.is_current = 1\nWHEN MATCHED AND t.risk_band &lt;&gt; s.risk_band THEN\n  UPDATE SET t.valid_to = s.loaded_on, t.is_current = 0\nWHEN NOT MATCHED THEN\n  INSERT (wallet_id, risk_band, valid_from, valid_to, is_current)\n  VALUES (s.wallet_id, s.risk_band, s.loaded_on, \'9999-12-31\', 1);</div>' +
   '<p>A single MERGE cannot both close the old row and insert a new one for the same key, so the standard implementation is two passes \u2014 or a staged change set with an explicit action column, which is exactly what the first example builds.</p>' },
 { h: 'The null trap, stated plainly', html:
   '<p><code>new_band != cur_band</code> is <em class="hl">null</em>, not true, when either side is null. That means a brand-new entity is excluded from the changed set, and an attribute changing to or from null is not detected. Every change-detection predicate needs either an explicit null branch or a null-safe comparison \u2014 <code>eqNullSafe</code> in PySpark, <code>IS DISTINCT FROM</code> in SQL.</p>' }
],
call: '"I classify every incoming row as insert, update or no-op before writing anything, and I hash the tracked attributes rather than comparing twenty columns individually. The trap is that new_band != cur_band is null rather than true when either side is null, so without an explicit null branch every brand-new entity is silently dropped."',
warn: 'A MERGE whose source contains two rows for the same key fails at runtime on Delta and Iceberg — "multiple source rows matched a target row". Deduplicate the change set first, and gate the job on a distinct-key check; that gate is one query and it saves a 3 a.m. page.',
qf: [
 ['What are the three actions in a dimension load?', 'Insert (new key), update (changed attributes), no-op (identical).'],
 ['Why hash the tracked attributes?', 'Comparing many columns individually is unreadable and error-prone; one hash comparison replaces it.'],
 ['Why does new != cur miss new entities?', 'Against null the comparison is null rather than true, so those rows fall out of the changed set.'],
 ['What makes SCD2 validity intervals safe?', 'Half-open — inclusive valid_from, exclusive valid_to — so a fact on a changeover date matches one version.'],
 ['Why does a Type 2 merge usually need two passes?', 'One MERGE cannot both close the existing row and insert a new one for the same key.'],
 ['What breaks a MERGE?', 'Duplicate keys in the source — deduplicate the change set before merging.']
]});

M.push({
code: 'E4', track: 'Track E · ETL patterns', title: 'Data quality as code',
sub: 'Assertions that must return zero rows — and the checks that catch what schemas cannot.',
lede: 'Data quality is not a framework, it is a set of queries with expected answers. Written so that <em class="hl">zero rows means pass</em>, they compose into any orchestrator, the failing rows are the debugging output, and the same expression works in Spark, dbt or a bare Airflow task.',
ex: [
 { t: 'Uniqueness — must return zero rows',
   code: "spark.table('stg_transfers') \\\n  .groupBy('txn_id') \\\n  .agg(count('*').alias('copies')) \\\n  .filter(col('copies') > 1) \\\n  .show()",
   note: 'The primary-key assertion. It returns a row here, so the check fails — correctly, because staging genuinely contains a replay. In a pipeline this failure blocks publication rather than being discovered on a dashboard.' },
 { t: 'Referential integrity — an anti-join',
   code: "spark.table('transfers') \\\n  .join(spark.table('wallets'), col('src_wallet') == col('wallet_id'), 'left_anti') \\\n  .select('txn_id', 'src_wallet') \\\n  .show()",
   note: 'Every transfer should reference a known wallet. Zero rows means the foreign key holds. left_anti is the right tool: it keeps left rows with no match and never fans out. This is the check that catches a dimension load failing while the fact load succeeded.' },
 { t: 'Null rates and domain rules in one profile',
   code: "spark.table('wallets') \\\n  .agg(count('*').alias('rows'),\n       sum(when(col('risk_band').isNull(), 1).otherwise(0)).alias('null_band'),\n       round(100.0 * sum(when(col('risk_band').isNull(), 1).otherwise(0)) / count('*'), 1).alias('null_pct'),\n       countDistinct('chain').alias('chains')) \\\n  .show()",
   note: 'A profile rather than a pass/fail. Run it every load and alarm on the delta — a null rate jumping from 12% to 60% is an upstream schema change, and it will not fail any type check.' },
 { t: 'Business rules — zero rows means pass',
   code: "spark.table('transfers') \\\n  .filter((col('amount_usd') <= 0) | (col('ts') > lit('2026-12-31')) | (col('src_wallet') == col('dst_wallet'))) \\\n  .select('txn_id', 'amount_usd', 'ts', 'src_wallet', 'dst_wallet') \\\n  .show()",
   note: 'Non-positive amounts, impossible dates, self-transfers. Zero rows means the domain rules hold. These catch a bad parse long before a model trains on it.' },
 { t: 'Volume against a baseline',
   code: "spark.table('transfers') \\\n  .groupBy('ts') \\\n  .agg(count('*').alias('rows')) \\\n  .withColumn('prev', lag('rows').over(Window.orderBy('ts'))) \\\n  .withColumn('pct_change', round(100.0 * (col('rows') - col('prev')) / col('prev'), 1)) \\\n  .orderBy('ts') \\\n  .show(14)",
   note: 'A volume check catches what schema and null checks never will: a partial load. The data is valid, there is simply not enough of it, and a job that succeeds on half the rows passes every other assertion.' }
],
body: [
 { h: 'The six checks worth having everywhere', html:
   '<table><thead><tr><th>Check</th><th>Expressed as</th><th>Catches</th></tr></thead><tbody>' +
   '<tr><td>Uniqueness</td><td>groupBy key, filter count &gt; 1</td><td>Replays, broken merges</td></tr>' +
   '<tr><td>Not null</td><td>filter col.isNull()</td><td>Upstream schema drift</td></tr>' +
   '<tr><td>Referential</td><td>left_anti join to the dimension</td><td>Load-order failures</td></tr>' +
   '<tr><td>Range / domain</td><td>filter outside bounds</td><td>Parse errors, unit changes</td></tr>' +
   '<tr><td>Freshness</td><td>max(ts) versus now</td><td>A silently stopped pipeline</td></tr>' +
   '<tr><td>Volume</td><td>Row count versus trailing average</td><td>Partial loads</td></tr>' +
   '</tbody></table>' +
   '<p>None of these is "did the job fail". A job that succeeds on zero rows passes every task-level check, and that is the failure that reaches a dashboard.</p>' },
 { h: 'Write-Audit-Publish', html:
   '<div class="pre">WRITE   -> new data to an isolated branch, snapshot or staging path\nAUDIT   -> run every assertion against it\nPUBLISH -> atomically swap the pointer; consumers never see a partial state</div>' +
   '<p>The checks run <em class="hl">between</em> the write and the publish. That is the difference between a quality check and a quality <strong>gate</strong>, and it is the answer to "how do you stop bad data reaching the warehouse?"</p>' },
 { h: 'Where the tools fit', html:
   '<p>Great Expectations, Soda and dbt tests are convenient wrappers around exactly these queries. Knowing the underlying expression is what lets you write a check the framework does not cover \u2014 and in an interview it is far more convincing than naming tools. Say the assertion, then mention the tool.</p>' }
],
call: '"I write quality checks as assertions that must return zero rows \u2014 uniqueness, referential integrity, domain ranges, freshness and volume \u2014 and run them between the write and the publish so a failure blocks publication rather than being found on a dashboard the next morning."',
warn: 'Freshness and volume checks catch what type and null assertions never will. A pipeline that silently stops producing rows passes every schema check perfectly — the table is simply not growing, and nobody notices until someone asks why last week looks flat.',
qf: [
 ['How should a data quality assertion be written?', 'So that zero rows means pass — the returned rows are the failures and the debugging output.'],
 ['Name the six core checks.', 'Uniqueness, not-null, referential integrity, range/domain, freshness, volume.'],
 ['How do you check referential integrity in Spark?', 'A left_anti join to the dimension — it keeps unmatched left rows and never fans out.'],
 ['Where do the checks belong?', 'Between the write and the publish, so a failure blocks publication.'],
 ['What does a volume check catch that a schema check cannot?', 'Partial loads and silently stopped pipelines — valid data, just not enough of it.'],
 ['What is Write-Audit-Publish?', 'Write to an isolated location, run assertions, then atomically publish so consumers never see a partial state.']
]});

M.push({
code: 'E5', track: 'Track E · ETL patterns', title: 'The medallion pipeline end to end',
sub: 'Bronze, silver and gold as three contracts — assembled from everything in this track.',
lede: 'Medallion is a naming convention for a layered lakehouse, and the substance is that each layer promises something different about schema, quality and grain. This module assembles the whole shape from the pieces already built: deduplicate, validate, model, aggregate.',
ex: [
 { t: 'Bronze — raw, as delivered, nothing removed',
   code: "spark.table('stg_transfers') \\\n  .orderBy('ingested_at', 'txn_id') \\\n  .show(10)",
   note: 'Bronze keeps everything, including the duplicate t-61 and the late-arriving t-11. It exists so silver can be rebuilt when a rule turns out to be wrong. Deleting bad rows here is the mistake — quarantine at silver, never filter at bronze.' },
 { t: 'Silver — deduplicated, validated, one row per business event',
   code: "spark.table('stg_transfers') \\\n  .withColumn('rn', row_number().over(\n      Window.partitionBy('txn_id').orderBy(col('ingested_at').desc()))) \\\n  .filter(col('rn') == 1) \\\n  .filter(col('amount_usd') > 0) \\\n  .withColumn('amount_band',\n      when(col('amount_usd') >= 9000, 'near-threshold')\n      .when(col('amount_usd') >= 1000, 'large')\n      .otherwise('small')) \\\n  .select('txn_id', 'src_wallet', 'amount_usd', 'amount_band', 'ts') \\\n  .orderBy('txn_id') \\\n  .show()",
   note: 'Four things happen here and only here: deduplicate on the business key, apply domain rules, derive typed columns, and settle the grain at one row per event. Five bronze rows become four silver rows, and the one that vanished is still in bronze.' },
 { t: 'Gold — modelled and aggregated to the reporting grain',
   code: "silver = spark.table('transfers') \\\n  .filter(col('amount_usd') > 0) \\\n  .withColumn('band', when(col('amount_usd') >= 9000, 'near-threshold').otherwise('normal'))\n\nsilver.join(broadcast(spark.table('wallets')), col('src_wallet') == col('wallet_id')) \\\n  .groupBy('chain', 'risk_band', 'band') \\\n  .agg(count('*').alias('txns'),\n       round(sum('amount_usd'), 2).alias('volume'),\n       countDistinct('src_wallet').alias('wallets')) \\\n  .orderBy(col('volume').desc()) \\\n  .show(10)",
   note: 'Gold joins the conformed dimension and aggregates to the grain a business user consumes. Note the broadcast — the dimension is small, so this whole layer costs one shuffle for the aggregation and none for the join.' },
 { t: 'The gate between layers',
   code: "bronze = spark.table('stg_transfers')\nsilver = bronze.withColumn('rn', row_number().over(\n      Window.partitionBy('txn_id').orderBy(col('ingested_at').desc()))) \\\n  .filter(col('rn') == 1).filter(col('amount_usd') > 0)\n\nbronze.agg(count('*').alias('bronze_rows'),\n           countDistinct('txn_id').alias('bronze_keys')).show()",
   note: 'Row counts at every hop, with the drop stated explicitly. If a row disappears between layers you should be able to name the rule that removed it — an unexplained drop is a bug, not a filter.' }
],
body: [
 { h: 'The contract at each layer', html:
   '<table><thead><tr><th></th><th>Bronze</th><th>Silver</th><th>Gold</th></tr></thead><tbody>' +
   '<tr><td>Schema</td><td>As delivered</td><td>Typed and enforced</td><td>Modelled \u2014 star</td></tr>' +
   '<tr><td>Quality</td><td>None promised</td><td>Validated, deduplicated</td><td>Business rules applied</td></tr>' +
   '<tr><td>Grain</td><td>Source grain</td><td>One row per business event</td><td>Reporting grain</td></tr>' +
   '<tr><td>Bad rows</td><td><b>Kept</b></td><td>Quarantined</td><td>Cannot reach here</td></tr>' +
   '<tr><td>Consumers</td><td>Engineers only</td><td>Analysts, data scientists</td><td>BI, applications</td></tr>' +
   '<tr><td>Rebuilt from</td><td>The source</td><td>Bronze</td><td>Silver</td></tr>' +
   '</tbody></table>' +
   '<p>The property that makes it worth three copies: <strong>every layer is reproducible from the one above it.</strong> A wrong parsing rule is a silver rebuild, not a data-loss incident.</p>' },
 { h: 'Where the rest of this bench plugs in', html:
   '<ul>' +
   '<li><strong>Bronze \u2192 silver:</strong> deduplication (E1), watermarks (E2), quality gates (E4), schemas (I1).</li>' +
   '<li><strong>Silver \u2192 gold:</strong> joins and broadcast (J1), aggregation (T2), SCD Type 2 (E3), writing and partitioning (W1).</li>' +
   '<li><strong>Every hop:</strong> assertions between write and publish (E4), and reconciliation counts.</li>' +
   '</ul>' +
   '<p>That mapping is a good answer to "walk me through your pipeline" \u2014 it presents the layers as a set of decisions rather than a diagram someone memorised.</p>' },
 { h: 'Honest caveats', html:
   '<p>Medallion is a convention, not a standard. Teams disagree about whether silver is deduplicated or merely typed, so say which definition you are using rather than assuming it is shared.</p>' +
   '<p>It also costs three copies of the data and three sets of jobs. On a small single-consumer pipeline that is ceremony. The layering earns its keep when several consumers need different contracts over the same source \u2014 which is exactly when a two-layer shortcut starts producing arguments about whose numbers are right.</p>' }
],
call: '"Each medallion layer is a different contract \u2014 bronze raw and immutable so silver can be rebuilt, silver typed, validated and deduplicated to one row per business event, gold modelled to the reporting grain. The property that matters is that every layer is reproducible from the one above it."',
warn: 'Deleting malformed rows from bronze destroys the thing bronze is for. When a parsing rule turns out to be wrong — and it will — you rebuild silver from bronze rather than re-requesting data from a source that may no longer have it.',
qf: [
 ['What are the three medallion layers?', 'Bronze (raw, immutable), silver (typed, validated, deduplicated), gold (modelled and aggregated).'],
 ['What happens at bronze to silver?', 'Deduplicate on the business key, apply domain rules, type and derive columns, settle the grain.'],
 ['What happens at silver to gold?', 'Join conformed dimensions and aggregate to the reporting grain.'],
 ['Why keep malformed rows in bronze?', 'So silver can be rebuilt when a parsing rule turns out to be wrong — bronze is the replay source.'],
 ['What is the key property of the layering?', 'Every layer is fully reproducible from the layer above it.'],
 ['When is medallion not worth it?', 'On a small single-consumer pipeline, where three copies and three job sets are ceremony rather than value.']
]});

M.push({
code: 'H4', track: 'Track H · Hadoop lineage', theory: true,
title: 'Bucketing and pre-shuffled joins',
sub: 'The one Hive feature that promises to eliminate a shuffle — and why it usually does not.',
lede: 'Bucketing hashes a column into a fixed number of files so that two tables bucketed identically on their join key can be joined without a shuffle. It is the only mechanism in the ecosystem that removes a shuffle without broadcasting, which makes it interesting \u2014 and it is fragile enough in practice that knowing when <em class="hl">not</em> to use it is the more valuable half.',
ex: [
 { t: 'Writing a bucketed table', ref: true,
   code: "(df.write\n   .bucketBy(64, 'src_wallet')      # 64 files per partition, hashed on the key\n   .sortBy('ts')                    # sorted within each bucket\n   .mode('overwrite')\n   .saveAsTable('silver.transfers_bucketed'))\n\n# bucketBy REQUIRES saveAsTable \u2014 it cannot be used with .save(path),\n# because the bucketing spec lives in the metastore, not in the files.\n\n# The payoff, when it works:\nspark.table('transfers_bucketed').join(\n    spark.table('wallets_bucketed'), 'src_wallet')\n#   -> SortMergeJoin with NO Exchange on either side",
   note: 'The bucketing specification is metastore metadata, not a property of the files, which is why bucketBy only works with saveAsTable. That single constraint rules it out for anyone writing plain Parquet to a path — which is most lakehouse pipelines.' }
],
body: [
 { h: 'Partitioning versus bucketing', html:
   '<table><thead><tr><th></th><th>Partitioning</th><th>Bucketing</th></tr></thead><tbody>' +
   '<tr><td>Physical form</td><td>Directories</td><td>A fixed number of files within each partition</td></tr>' +
   '<tr><td>Good for</td><td>Filtering \u2014 skip whole directories</td><td>Joining and aggregating on the bucket key</td></tr>' +
   '<tr><td>Cardinality</td><td>Low \u2014 dates, regions</td><td>High \u2014 ids, keys</td></tr>' +
   '<tr><td>Changeable later</td><td>Yes, with a rewrite</td><td>Fixed at creation; changing means rewriting</td></tr>' +
   '<tr><td>Visible in the path</td><td>Yes</td><td>No \u2014 metastore only</td></tr>' +
   '</tbody></table>' +
   '<p>They compose: partition by date for pruning, bucket by wallet id within each partition for joins. That is the textbook layout, and it is genuinely good when the conditions hold.</p>' },
 { h: 'The conditions, all of which must hold', html:
   '<ol>' +
   '<li><strong>Both tables bucketed on the same column</strong>, with the <em class="hl">same</em> bucket count \u2014 or a multiple, in recent Spark.</li>' +
   '<li><strong>Written through <code>saveAsTable</code></strong> into a metastore Spark trusts.</li>' +
   '<li><strong>Read as tables</strong>, not as paths. Reading the same files with <code>spark.read.parquet(path)</code> loses the bucketing entirely.</li>' +
   '<li><strong>No operation in between that redistributes</strong> \u2014 a filter is fine, a repartition or an aggregation on a different key discards it.</li>' +
   '</ol>' +
   '<p>Four conditions, any one of which silently gives you back the shuffle. That is the honest assessment: the optimisation is real and the failure mode is that it quietly does not apply.</p>' },
 { h: 'Why it is rarely worth it now', html:
   '<ul>' +
   '<li><strong>Broadcast joins cover most cases.</strong> If either side fits in memory the shuffle is gone anyway, with no schema commitment.</li>' +
   '<li><strong>The bucket count is fixed forever.</strong> Choose 64 and grow tenfold, and you now have buckets ten times too large with no way to change them short of rewriting the table.</li>' +
   '<li><strong>Spark and Hive bucketing have historically been incompatible</strong>, so a table bucketed by Hive is not necessarily read as bucketed by Spark.</li>' +
   '<li><strong>Iceberg and Delta take a different route</strong> \u2014 hidden partitioning and file-level statistics \u2014 which is more flexible and does not freeze a decision at creation.</li>' +
   '</ul>' +
   '<p>The position worth holding: bucketing is correct for a very large, stable fact table joined repeatedly on the same high-cardinality key, in a metastore-managed warehouse. Outside that, broadcast joins and good file layout get you most of the benefit with none of the commitment.</p>' },
 { h: 'How to check whether it actually applied', html:
   '<p>Look at the physical plan for an <code>Exchange</code> above the scan. If the bucketing is being used there will be none on either side of the <code>SortMergeJoin</code>. If you see Exchanges, one of the four conditions failed \u2014 and the plan is the only thing that will tell you, because nothing errors.</p>' }
],
call: '"Bucketing pre-hashes a table on its join key so two identically bucketed tables join without a shuffle. In practice four conditions all have to hold and any one failing silently restores the shuffle, so I check the plan for an Exchange rather than assuming \u2014 and for most tables a broadcast join gets the same win without freezing the bucket count forever."',
warn: 'Reading a bucketed table by path instead of by table name discards the bucketing entirely. The query returns identical results, the shuffle comes back, and nothing anywhere reports that the optimisation you designed the table around is not being used.',
qf: [
 ['What does bucketing do?', 'Hashes a column into a fixed number of files so identically bucketed tables can join without a shuffle.'],
 ['Partitioning versus bucketing?', 'Partitioning creates directories for filtering on low-cardinality columns; bucketing creates a fixed file count for joining on high-cardinality keys.'],
 ['Why does bucketBy require saveAsTable?', 'The bucketing spec lives in the metastore, not in the files.'],
 ['What silently disables it?', 'Different bucket counts, reading by path rather than table name, or any operation that redistributes the data.'],
 ['Why is the bucket count risky?', 'It is fixed at creation; changing it means rewriting the whole table.'],
 ['How do you confirm it applied?', 'Check the physical plan for an Exchange above the scans — if the join has none, bucketing is being used.']
]});

M.push({
code: 'O2', track: 'Track O · Production', theory: true,
title: 'Orchestration, deployment and cost',
sub: 'Where the job runs, how it gets there, and what it costs when nobody is watching.',
lede: 'A transformation that works on your laptop is perhaps a fifth of a production pipeline. The rest is scheduling with correct dependencies, deploying through a pipeline that catches errors before the cluster does, and sizing a cluster so the job is not quietly costing ten times what it should.',
ex: [
 { t: 'An Airflow DAG with the properties that matter', ref: true,
   code: "with DAG('fraud_silver',\n         schedule='0 2 * * *',\n         start_date=datetime(2026, 1, 1),\n         catchup=False,                    # do not backfill a year on first deploy\n         max_active_runs=1,                # no overlapping runs of the same DAG\n         default_args={'retries': 2,\n                       'retry_delay': timedelta(minutes=5)}) as dag:\n\n    build = GlueJobOperator(\n        task_id='build_silver',\n        job_name='fraud-silver',\n        script_args={'--run_date': '{{ ds }}'})   # the LOGICAL date, not today\n\n    audit = SparkSubmitOperator(task_id='quality_gate', ...)\n    publish = PythonOperator(task_id='publish', ...)\n\n    build >> audit >> publish                     # publish only if audit passes",
   note: 'Three details carry most of the value. `catchup=False` stops a year of backfill firing on first deploy. `max_active_runs=1` prevents two runs writing the same partition. And `{{ ds }}` passes the logical date, so a re-run of Tuesday reprocesses Tuesday rather than today — which is what makes a backfill mean anything.' },
 { t: 'The CI pipeline for a data job', ref: true,
   code: "# .github/workflows/ci.yml\n- ruff check . && mypy lib/            # seconds, catches real errors\n- pytest tests/ -q                     # local[2] Spark, no cluster\n- python -m build                      # versioned wheel\n- terraform plan -out=tfplan           # infrastructure reviewed in the PR\n\n# on merge to main\n- upload wheel to s3://artifacts/lib-${VERSION}.whl\n- terraform apply tfplan\n- run the job against a SAMPLE in staging\n- run the data quality assertions on the output\n- promote only if the assertions pass",
   note: 'The step teams skip is the last one: running quality assertions in staging before promoting. Without it CI proves the code compiles, not that the pipeline produces correct data — and those are very different claims.' }
],
body: [
 { h: 'Orchestration principles', html:
   '<table><thead><tr><th>Principle</th><th>Why</th></tr></thead><tbody>' +
   '<tr><td><b>Tasks are idempotent</b></td><td>Retries are automatic; a non-idempotent retry duplicates data</td></tr>' +
   '<tr><td><b>Parameterise on the logical date</b></td><td>A backfill must reprocess that date, not today</td></tr>' +
   '<tr><td><b>Dependencies are explicit</b></td><td>"It usually finishes first" is not a dependency</td></tr>' +
   '<tr><td><b>One task, one responsibility</b></td><td>A failed step should be restartable on its own</td></tr>' +
   '<tr><td><b>Sensors have timeouts</b></td><td>A sensor waiting forever holds a worker slot forever</td></tr>' +
   '<tr><td><b>Alert on the SLA, not the failure</b></td><td>A job that succeeds four hours late has still broken its contract</td></tr>' +
   '</tbody></table>' },
 { h: 'Cluster sizing, honestly', html:
   '<div class="pre">total cores      = executors x cores per executor\ncores per executor: 4\u20135 \u2014 beyond that I/O plateaus and GC pauses grow\npartitions       : 2\u20134 per core, at roughly 128 MB each\ndriver memory    : small, UNLESS you collect or broadcast \u2014 then it is the risk\n\nStart small, measure, then scale. A cluster sized by guessing is usually\nsized for the worst day and paid for on every other one.</div>' +
   '<p>The cost lever people miss is not instance type, it is <strong>runtime</strong>. A job that takes twenty minutes instead of two hours on the same cluster costs a sixth as much, and the fix is usually a broadcast join or a partition-count change rather than a bigger cluster.</p>' },
 { h: 'Where to run it', html:
   '<table><thead><tr><th>Option</th><th>Right when</th></tr></thead><tbody>' +
   '<tr><td>Glue</td><td>Serverless, catalog-integrated, short jobs</td></tr>' +
   '<tr><td>EMR on EC2</td><td>Long or frequent jobs; Spot task nodes for the discount</td></tr>' +
   '<tr><td>EMR Serverless</td><td>Spiky Spark without cluster management</td></tr>' +
   '<tr><td>Databricks</td><td>Delta-centric platforms; strong notebook and job tooling</td></tr>' +
   '<tr><td>Not Spark at all</td><td>Under ~100 GB \u2014 a single node or Athena is cheaper and simpler</td></tr>' +
   '</tbody></table>' +
   '<p>That last row is a real answer, not a joke. The most cost-effective Spark tuning is sometimes deciding the workload never needed Spark.</p>' }
],
call: '"I parameterise every task on the logical date rather than today, so a backfill genuinely reprocesses that date, and I keep max_active_runs at one so two runs cannot write the same partition. On cost the lever is runtime rather than instance type \u2014 a broadcast join that cuts a job from two hours to twenty minutes saves more than any resizing."',
warn: 'Deploying an Airflow DAG with catchup left at its default fires one run per schedule interval since start_date — potentially a year of backfill, all at once, on first deploy. It is the most common self-inflicted incident in Airflow and it happens on day one.',
qf: [
 ['Why must orchestrated tasks be idempotent?', 'Retries are automatic, so a non-idempotent task duplicates data on every retry.'],
 ['Why parameterise on the logical date?', 'So a re-run or backfill reprocesses that date rather than today.'],
 ['What does catchup=False prevent?', 'A flood of backfill runs firing on first deploy for every interval since start_date.'],
 ['How many cores per executor?', 'Roughly four to five — beyond that I/O throughput plateaus and GC pauses grow.'],
 ['What is the biggest cost lever?', 'Runtime, not instance type — halving the runtime halves the bill on the same cluster.'],
 ['What CI step do teams usually skip?', 'Running data quality assertions against staging output before promoting.']
]});

M.push({
code: 'C3', track: 'Track C · Core API', title: 'The DataFrame API surface',
sub: 'select, drop, rename, union, sort, limit — the verbs you use in every job.',
lede: 'Before the interesting operations there is a small set of verbs you will type hundreds of times. They are worth knowing precisely rather than approximately, because the differences between them \u2014 <code>union</code> against <code>unionByName</code>, <code>drop</code> against <code>select</code> \u2014 are exactly where quiet bugs live.',
ex: [
 { t: 'select, drop and rename',
   code: "spark.table('wallets') \\\n  .select('wallet_id', 'chain', 'risk_band') \\\n  .withColumnRenamed('risk_band', 'band') \\\n  .show()",
   note: 'select with strings picks columns; drop removes them. Prefer select when you want a known set — it fails loudly if a column is missing, whereas drop silently does nothing when the name is wrong. That difference matters when a schema changes upstream.' },
 { t: 'Building columns and casting',
   code: "spark.table('transfers') \\\n  .select('txn_id', 'amount_usd') \\\n  .withColumn('amount_int', col('amount_usd').cast('int')) \\\n  .withColumn('in_thousands', round(col('amount_usd') / 1000, 3)) \\\n  .withColumn('label', concat(col('txn_id'), lit(' : '), col('amount_usd').cast('string'))) \\\n  .show(6)",
   note: 'lit() wraps a Python value as a Column — needed whenever you mix a constant into an expression. cast to string before concatenating a number, or the concatenation returns null on some engines.' },
 { t: 'Filtering with the operators that actually exist',
   code: "spark.table('transfers') \\\n  .filter(col('amount_usd').between(1000, 9000)) \\\n  .filter(col('src_wallet').isin('w-1', 'w-3', 'w-5')) \\\n  .select('txn_id', 'src_wallet', 'amount_usd') \\\n  .orderBy(col('amount_usd').desc()) \\\n  .limit(6) \\\n  .show()",
   note: 'between is inclusive on both ends. isin takes a list of values. Chaining two filters is identical to combining them with & — Catalyst merges them into one predicate, so write whichever reads better.' },
 { t: 'union versus unionByName',
   code: "eth = spark.table('wallets').filter(col('chain') == 'ethereum').select('wallet_id', 'risk_band')\npoly = spark.table('wallets').filter(col('chain') == 'polygon').select('risk_band', 'wallet_id')\n\neth.union(poly).show(10)",
   note: 'Look carefully: the second DataFrame selects the columns in the opposite order. union matches by POSITION, so risk_band values land in the wallet_id column and nothing errors. unionByName matches by name and is almost always what you meant.' },
 { t: 'The corrected version',
   code: "eth = spark.table('wallets').filter(col('chain') == 'ethereum').select('wallet_id', 'risk_band')\npoly = spark.table('wallets').filter(col('chain') == 'polygon').select('risk_band', 'wallet_id')\n\neth.unionByName(poly).orderBy('wallet_id').show(10)",
   note: 'Same two DataFrames, matched by name. The values are now in the right columns. Default to unionByName; reach for union only when you are certain the schemas are positionally identical.' }
],
body: [
 { h: 'The verbs, and what each returns', html:
   '<table><thead><tr><th>Method</th><th>Returns</th><th>Note</th></tr></thead><tbody>' +
   '<tr><td><code>select(*cols)</code></td><td>DataFrame</td><td>Strings or Column expressions; fails on a missing name</td></tr>' +
   '<tr><td><code>drop(*cols)</code></td><td>DataFrame</td><td><em class="hl">Silently ignores</em> names that do not exist</td></tr>' +
   '<tr><td><code>withColumn(name, expr)</code></td><td>DataFrame</td><td>Adds or replaces one column</td></tr>' +
   '<tr><td><code>withColumnRenamed(old, new)</code></td><td>DataFrame</td><td>No-op if old is missing</td></tr>' +
   '<tr><td><code>filter</code> / <code>where</code></td><td>DataFrame</td><td>Identical \u2014 <code>where</code> is a SQL-flavoured alias</td></tr>' +
   '<tr><td><code>orderBy</code> / <code>sort</code></td><td>DataFrame</td><td>Identical; always a shuffle</td></tr>' +
   '<tr><td><code>limit(n)</code></td><td>DataFrame</td><td>Lazy \u2014 unlike <code>take(n)</code>, which is an action</td></tr>' +
   '<tr><td><code>distinct()</code></td><td>DataFrame</td><td>All columns; <code>dropDuplicates(subset)</code> for a subset</td></tr>' +
   '</tbody></table>' },
 { h: 'Two habits worth forming', html:
   '<p><strong>Prefer select over drop</strong> when you know the output columns. A select states the contract and fails when it is broken; a drop leaves you with whatever arrives, including new columns you never intended to propagate.</p>' +
   '<p><strong>Prefer one select over many withColumn calls.</strong> Twenty chained withColumns build a plan twenty levels deep, and analysis time grows with it. Building the same twenty columns inside one select is flatter and noticeably faster to plan on wide tables.</p>' },
 { h: 'limit, take and show', html:
   '<div class="pre code">df.limit(10)      <i>transformation \u2014 returns a DataFrame, runs nothing</i>\ndf.take(10)       <u>action \u2014 returns a Python list to the driver</u>\ndf.show(10)       <u>action \u2014 prints, returns None</u>\ndf.head()         <u>action \u2014 one Row, or None</u>\ndf.collect()      <u>action \u2014 EVERY row to the driver</u></div>' +
   '<p><code>collect()</code> on a large DataFrame is the classic driver OOM. If you need the data locally, <code>limit()</code> first and know why you are doing it.</p>' }
],
call: '"I default to unionByName rather than union, because union matches by position \u2014 two DataFrames with the same columns in a different order will silently interleave the values with no error at all. And I prefer select over drop, because select states the output contract and fails when it is broken."',
warn: 'union matches columns by position, not by name. Two DataFrames with identical schemas in a different order produce a result where every value is in the wrong column, with no error and no warning. It is one of the few Spark bugs that produces confidently wrong data.',
qf: [
 ['union versus unionByName?', 'union matches by position; unionByName matches by name. Default to unionByName.'],
 ['select versus drop?', 'select states the output columns and fails on a missing name; drop silently ignores names that do not exist.'],
 ['Is limit an action?', 'No — it is a transformation. take, show, head and collect are actions.'],
 ['Why prefer one select over many withColumn calls?', 'Chained withColumns build a deep plan that slows analysis; one select is flatter.'],
 ['What does lit() do?', 'Wraps a Python value as a Column so it can be used in an expression.'],
 ['filter versus where?', 'Identical — where is a SQL-flavoured alias.']
]});

M.push({
code: 'C4', track: 'Track C · Core API', title: 'Strings and text functions',
sub: 'Cleaning, deriving and matching text — with built-ins rather than a UDF.',
lede: 'Text arrives inconsistent: mixed case, padded, with the useful part buried inside a larger string. PySpark has several hundred built-in functions and most text work needs no UDF at all \u2014 which matters, because a Python UDF is ten to a hundred times slower and opaque to the optimiser.',
ex: [
 { t: 'Case, length and trimming',
   code: "spark.table('wallets') \\\n  .select('wallet_id', 'chain', 'address') \\\n  .withColumn('chain_upper', upper(col('chain'))) \\\n  .withColumn('addr_len', length(col('address'))) \\\n  .withColumn('chain_clean', trim(lower(col('chain')))) \\\n  .show()",
   note: 'The normalisation trio. Case and whitespace differences are the classic reason a join silently matches nothing — normalise both sides identically, and do it once at load rather than in every downstream query.' },
 { t: 'Slicing and building strings',
   code: "spark.table('wallets') \\\n  .withColumn('prefix', substring(col('address'), 1, 4)) \\\n  .withColumn('composite_key', concat_ws(':', col('chain'), col('wallet_id'))) \\\n  .withColumn('display', concat(upper(col('chain')), lit(' / '), col('address'))) \\\n  .select('wallet_id', 'prefix', 'composite_key', 'display') \\\n  .show()",
   note: 'substring is 1-indexed in Spark, not 0-indexed like Python — the single most common off-by-one here. concat_ws skips nulls and joins with a separator; plain concat returns null if any argument is null, which is usually not what you want.' },
 { t: 'Matching without a UDF',
   code: "spark.table('wallets') \\\n  .withColumn('is_eth', col('chain') == 'ethereum') \\\n  .withColumn('addr_starts_0x4', col('address').startswith('0x4')) \\\n  .withColumn('has_b', col('address').contains('b')) \\\n  .withColumn('known_chain', col('chain').isin('ethereum', 'polygon')) \\\n  .select('wallet_id', 'address', 'is_eth', 'addr_starts_0x4', 'has_b', 'known_chain') \\\n  .show()",
   note: 'These are Column methods rather than functions, so they chain naturally and stay visible to Catalyst. Anything expressible this way should never become a UDF.' },
 { t: 'Deriving a category from text',
   code: "spark.table('wallets') \\\n  .withColumn('family',\n      when(col('chain') == 'ethereum', 'evm')\n      .when(col('chain') == 'polygon', 'evm')\n      .otherwise('other')) \\\n  .groupBy('family') \\\n  .agg(count('*').alias('wallets'), countDistinct('chain').alias('chains')) \\\n  .orderBy(col('wallets').desc()) \\\n  .show()",
   note: 'Business categorisation belongs in a when chain, not a lookup UDF. It stays in the plan, it is readable in a pull request, and it costs nothing at runtime.' }
],
body: [
 { h: 'The functions worth memorising', html:
   '<table><thead><tr><th>Need</th><th>Function</th></tr></thead><tbody>' +
   '<tr><td>Case</td><td><code>upper</code>, <code>lower</code>, <code>initcap</code></td></tr>' +
   '<tr><td>Whitespace</td><td><code>trim</code>, <code>ltrim</code>, <code>rtrim</code></td></tr>' +
   '<tr><td>Slice</td><td><code>substring(col, start, len)</code> \u2014 <b>1-indexed</b></td></tr>' +
   '<tr><td>Join</td><td><code>concat</code> (null-propagating), <code>concat_ws(sep, ...)</code> (skips nulls)</td></tr>' +
   '<tr><td>Split</td><td><code>split(col, pattern)</code> \u2014 returns an array</td></tr>' +
   '<tr><td>Pattern</td><td><code>rlike</code>, <code>regexp_extract</code>, <code>regexp_replace</code></td></tr>' +
   '<tr><td>Pad</td><td><code>lpad</code>, <code>rpad</code></td></tr>' +
   '<tr><td>Test</td><td><code>.contains()</code>, <code>.startswith()</code>, <code>.endswith()</code>, <code>.like()</code></td></tr>' +
   '</tbody></table>' +
   '<p class="snote">This bench implements the common subset. <code>split</code>, <code>regexp_extract</code> and <code>lpad</code> exist in Spark but not here, because there is no array type in the engine.</p>' },
 { h: 'Where to stop', html:
   '<p>Built-ins are right for <em class="hl">normalising</em> and <em class="hl">extracting a known shape</em>. They are the wrong tool for parsing free text, fuzzy name matching, or anything needing tokenisation and scoring \u2014 that belongs in a transformation layer or a search index.</p>' +
   '<p>A regex complex enough that nobody can safely modify it is a liability regardless of how fast it runs. If you cannot explain the pattern in one sentence, it needs a comment and probably a test.</p>' },
 { h: 'Normalise once, at the boundary', html:
   '<div class="pre code">-- in silver, once\n.withColumn(\'chain\', lower(trim(col(\'chain\'))))\n\n-- NOT in every downstream query\n.filter(lower(trim(col(\'chain\'))) == \'ethereum\')   <u>repeated work, and defeats pushdown</u></div>' +
   '<p>Wrapping a column in a function also stops the predicate being pushed to the scan \u2014 the same sargability rule as SQL and as Athena partition pruning. Clean at the boundary so downstream filters stay on bare columns.</p>' }
],
call: '"Nearly all text work is built-in functions rather than UDFs \u2014 a Python UDF costs ten to a hundred times more and is opaque to Catalyst. And I normalise case and whitespace once in silver rather than in every query, because wrapping a column in a function also defeats predicate pushdown."',
warn: 'substring is 1-indexed in Spark, not 0-indexed like Python. And concat returns null if any argument is null, so building a key from a nullable column silently produces nulls for exactly the rows you cared about — use concat_ws, which skips them.',
qf: [
 ['Is substring 0- or 1-indexed?', '1-indexed, unlike Python.'],
 ['concat versus concat_ws?', 'concat returns null if any argument is null; concat_ws joins with a separator and skips nulls.'],
 ['Why avoid a UDF for text work?', 'Ten to a hundred times slower, and opaque to Catalyst so nothing can be pushed through it.'],
 ['Where should normalisation happen?', 'Once at the silver boundary — not repeated in every query, where it also defeats pushdown.'],
 ['How do you test a prefix without a regex?', 'col().startswith() — a Column method that stays visible to the optimiser.'],
 ['When should text work leave Spark?', 'Free-text parsing, fuzzy matching, or anything needing tokenisation and scoring.']
]});

M.push({
code: 'C5', track: 'Track C · Core API', title: 'Dates, times and null handling',
sub: 'The two areas that produce the most silently wrong answers in any pipeline.',
lede: 'Dates and nulls share a property: getting them wrong produces plausible numbers rather than errors. A date filter off by one day and a null that quietly excludes a row both survive review, ship, and are discovered weeks later by someone asking why a total looks low.',
ex: [
 { t: 'Extracting date parts',
   code: "spark.table('transfers') \\\n  .select('txn_id', 'ts', 'amount_usd') \\\n  .withColumn('yr', year(col('ts'))) \\\n  .withColumn('mo', month(col('ts'))) \\\n  .withColumn('day', dayofmonth(col('ts'))) \\\n  .withColumn('days_since', datediff(lit('2026-03-01'), col('ts'))) \\\n  .show(6)",
   note: 'Extraction pulls one component out. datediff returns whole days between two dates and takes the later date first — the argument order catches people, and reversing it gives you negative numbers that look like a data problem.' },
 { t: 'Grouping by a date grain',
   code: "spark.table('transfers') \\\n  .groupBy('ts') \\\n  .agg(count('*').alias('txns'), round(sum('amount_usd'), 2).alias('volume')) \\\n  .orderBy('ts') \\\n  .show(14)",
   note: 'Grouping on a date column gives one row per day. If ts were a full timestamp this would give one group per row — the most common beginner mistake with time-series data. Truncate to the grain you want before grouping.' },
 { t: 'The half-open range',
   code: "spark.table('transfers') \\\n  .filter((col('ts') >= lit('2026-02-01')) & (col('ts') < lit('2026-02-08'))) \\\n  .agg(count('*').alias('rows_in_first_week'),\n       min('ts').alias('first'),\n       max('ts').alias('last')) \\\n  .show()",
   note: 'Greater-or-equal the start, strictly less than the next start. On a timestamp column an inclusive upper bound stops at midnight and drops everything later that day. Write ranges this way by default and the bug cannot occur.' },
 { t: 'Nulls propagate — and filters drop them',
   code: "spark.table('wallets') \\\n  .withColumn('band_is_low', col('risk_band') == 'low') \\\n  .withColumn('band_not_low', col('risk_band') != 'low') \\\n  .withColumn('is_null', col('risk_band').isNull()) \\\n  .select('wallet_id', 'risk_band', 'band_is_low', 'band_not_low', 'is_null') \\\n  .show()",
   note: 'Look at w-8. Its risk_band is null, so both the equality AND the inequality return null, not true or false. A filter on either would exclude the row. That is why "not low" does not mean "everything except low".' },
 { t: 'Handling nulls explicitly',
   code: "spark.table('wallets') \\\n  .withColumn('band', coalesce(col('risk_band'), lit('unclassified'))) \\\n  .withColumn('is_low_or_unknown', coalesce(col('risk_band'), lit('low')) == 'low') \\\n  .select('wallet_id', 'risk_band', 'band', 'is_low_or_unknown') \\\n  .show()",
   note: 'coalesce supplies a default so the comparison has something to compare. Deciding what an unknown value should count as is a business decision, and making it explicit in the code is how you stop it being decided accidentally by three-valued logic.' },
 { t: 'na.fill and na.drop',
   code: "filled = spark.table('wallets').na.fill('unclassified')\ndropped = spark.table('wallets').na.drop(['risk_band'])\n\nfilled.select('wallet_id', 'risk_band').show(9)",
   note: 'na.fill replaces nulls with a default across all columns or a subset; na.drop removes rows with nulls in the named columns. Run the dropped variant instead and the row count falls from 8 to 7 — dropping is data loss, so make it a decision rather than a default.' }
],
body: [
 { h: 'Three-valued logic', html:
   '<table><thead><tr><th>Expression</th><th>Result</th><th>Passes a filter?</th></tr></thead><tbody>' +
   '<tr><td><code>null == \'low\'</code></td><td>null</td><td>No</td></tr>' +
   '<tr><td><code>null != \'low\'</code></td><td>null</td><td><b>No</b></td></tr>' +
   '<tr><td><code>col.isNull()</code></td><td>true</td><td>Yes</td></tr>' +
   '<tr><td><code>null + 5</code></td><td>null</td><td>n/a</td></tr>' +
   '</tbody></table>' +
   '<p>Only a predicate that evaluates to <em class="hl">true</em> keeps a row. Null behaves like false for filtering but not for negation, which is exactly why an inequality filter silently drops the unknown rows.</p>' },
 { h: 'The null toolkit', html:
   '<div class="pre code">coalesce(a, b, c)          <i>first non-null argument</i>\ncol(\'x\').isNull()          <i>the only correct null test</i>\ncol(\'x\').isNotNull()\ndf.na.fill(value)          <i>replace nulls with a default</i>\ndf.na.fill(v, subset=[..]) <i>only in named columns</i>\ndf.na.drop([\'col\'])        <i>remove rows with nulls there \u2014 data loss</i>\ncol(\'a\').eqNullSafe(col(\'b\'))  <i>null-safe equality: null == null is true</i></div>' +
   '<p><code>eqNullSafe</code> is the one to remember for change detection: comparing an old and new value with <code>!=</code> misses the case where one side is null, which is how a new entity or a cleared attribute goes undetected.</p>' },
 { h: 'Date rules', html:
   '<ul>' +
   '<li><strong>Write ranges half-open</strong> \u2014 <code>&gt;= start</code> and <code>&lt; next_start</code>. Correct for dates, timestamps and leap years alike.</li>' +
   '<li><strong>Truncate before grouping.</strong> Grouping on a raw timestamp gives one group per row.</li>' +
   '<li><strong>Store UTC</strong>, convert at the edges. A pipeline holding local times cannot be reasoned about across daylight saving.</li>' +
   '<li><strong>Keep the column bare in filters.</strong> <code>year(ts) == 2026</code> defeats both pushdown and partition pruning; a range on <code>ts</code> does not.</li>' +
   '</ul>' }
],
call: '"Null is unknown, so both equality and inequality against it return null rather than true or false \u2014 which means a \'not low\' filter silently drops every row where the band is unknown. I make the decision explicit with coalesce, and use eqNullSafe for change detection where a null on either side would otherwise go undetected."',
warn: 'Filtering with `col(\'x\') != value` excludes nulls as well as matches. If you meant "everything that is not low, including unknowns", you have to say so — `coalesce(col(\'x\'), lit(\'unknown\')) != \'low\'`. The query runs, the number is just quietly low.',
qf: [
 ['What does null != \'low\' evaluate to?', 'null — not true. So the row is excluded by a filter.'],
 ['How do you test for null?', 'col().isNull() — comparison operators cannot do it.'],
 ['What is eqNullSafe for?', 'Null-safe equality where null equals null is true — essential for change detection.'],
 ['What is the safe date-range form?', '>= start AND < next_start — half-open.'],
 ['Why truncate before grouping on a timestamp?', 'Otherwise every row is its own group.'],
 ['na.fill versus na.drop?', 'fill replaces nulls with a default; drop removes the rows, which is data loss and should be a decision.']
]});

M.push({
