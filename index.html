<script>
/* PySpark bench modules. Every `code` string is executed by engine.js
   over real partitions; the plans and partition histograms are measured. */
(function (root) {
'use strict';
var M = [];

/* ══════════════ TRACK C · CORE API ══════════════ */

M.push({
code: 'C1', track: 'Track C · Core API', title: 'Lazy evaluation, transformations and actions',
sub: 'Nothing runs until an action asks for a result — and that is why the plan matters more than the code.',
lede: 'A chain of PySpark calls does not process data. It builds a logical plan, which Catalyst optimises, and only an <em class="hl">action</em> turns that into jobs, stages and tasks. Everything else in this bench follows from that one fact: you are writing a description of work, not performing it.',
ex: [
 { t: 'Transformations build a plan; only the action runs it',
   code: "df = spark.table('transfers')\nfiltered = df.filter(col('amount_usd') > 5000)\nwith_band = filtered.withColumn('big', col('amount_usd') * 2)\nwith_band.show()",
   note: 'Three statements, one job. Read the plan below: FileScan, Filter, WithColumn — all in a single stage because none of them needs to move data between partitions. Remove .show() and the engine still has to be given something to return, but in real Spark literally nothing would execute.' },
 { t: 'Filter early — the plan shows what survives',
   code: "spark.table('transfers') \\\n  .filter(col('is_flagged') == 1) \\\n  .select('txn_id', 'src_wallet', 'amount_usd') \\\n  .show()",
   note: 'Filter then project. Catalyst reorders these anyway — pushing filters toward the scan and pruning columns — but writing them in this order makes the intent obvious and costs nothing.' },
 { t: 'count() is an action and returns a number, not a DataFrame',
   code: "spark.table('transfers').filter(col('amount_usd') > 1000).count()",
   note: 'Actions end the chain. count(), show(), collect(), write() all trigger execution; filter(), select(), withColumn(), join() do not. If your code "runs instantly" and you expected it to be slow, you have not triggered anything yet.' },
 { t: 'Two actions on the same chain means two full executions',
   code: "big = spark.table('transfers').filter(col('amount_usd') > 3000)\nbig.count()\nbig.show(5)",
   note: 'Without caching, Spark recomputes the whole lineage for every action — the scan and the filter run twice here. That is the single most common cause of a job being mysteriously twice as slow as expected. See P1.' }
],
body: [
 { h: 'Transformations versus actions', html:
   '<table><thead><tr><th>Transformations (lazy)</th><th>Actions (eager)</th></tr></thead><tbody>' +
   '<tr><td>select, filter, withColumn</td><td>show, collect, count</td></tr>' +
   '<tr><td>groupBy + agg, join, union</td><td>take, first, head</td></tr>' +
   '<tr><td>orderBy, distinct, repartition</td><td>write, foreach, toPandas</td></tr>' +
   '</tbody></table>' +
   '<p>The mental model: transformations append to a plan, actions submit a job. One action can produce several jobs if the plan contains something Spark must evaluate first, such as a broadcast.</p>' },
 { h: 'Why laziness is not just an implementation detail', html:
   '<ul>' +
   '<li><strong>Catalyst can reorder and combine.</strong> Filters move toward the scan, projections prune columns, adjacent narrow operations fuse into one pass over the data.</li>' +
   '<li><strong>Errors surface late.</strong> A typo in a column name may not appear until the action, which is why analysis errors feel like they come from the wrong line.</li>' +
   '<li><strong>Nothing is reused by default.</strong> Two actions on one DataFrame means two executions unless you cache.</li>' +
   '</ul>' },
 { h: 'Reading the plan', html:
   '<p>The panel under each example is the physical plan this engine actually executed, bottom-of-chain first. Two things to look for, every time:</p>' +
   '<div class="pre">[narrow]  no data crosses partitions \u2014 cheap, fuses with its neighbours\n[wide]    an Exchange \u2014 data is redistributed, a stage boundary, expensive</div>' +
   '<p>Counting the Exchanges in a plan is the fastest read on whether a job will be slow. Everything in Track T is about that count.</p>' }
],
call: '"PySpark transformations build a plan and actions execute it, so two actions on the same DataFrame recompute the whole lineage twice unless I cache. When I read a plan the first thing I count is Exchanges \u2014 that is where the time goes."',
warn: 'A chain that returns instantly has not run. Candidates time a transformation chain, see milliseconds, and conclude Spark is fast — the work has not started. Time the action, not the chain.',
qf: [
 ['Transformation or action — filter()?', 'Transformation. It appends to the plan and executes nothing.'],
 ['Name four actions.', 'show, count, collect, write — also take, first and toPandas.'],
 ['What happens when you call two actions on one DataFrame?', 'The entire lineage is recomputed for each, unless the DataFrame is cached.'],
 ['Why do column-name errors appear at the wrong line?', 'Analysis happens when the plan is resolved, not when the transformation is written.'],
 ['What is the fastest read on whether a job is expensive?', 'Count the Exchanges — every one is a shuffle and a stage boundary.'],
 ['What does laziness buy?', 'Catalyst can reorder filters, prune columns and fuse narrow operations before anything runs.']
]});

M.push({
code: 'C2', track: 'Track C · Core API', title: 'Columns, expressions and conditional logic',
sub: 'col(), literals, when/otherwise — and why the string API and the column API differ.',
lede: 'A Column in PySpark is an unevaluated expression, not a value. That is why you can build one, pass it around, and reuse it across DataFrames \u2014 and why comparing a Column to a Python value with <code>and</code> instead of <code>&amp;</code> raises a confusing error. Once you see Columns as plan fragments, the API stops being arbitrary.',
ex: [
 { t: 'Building derived columns',
   code: "spark.table('transfers') \\\n  .withColumn('amount_k', round(col('amount_usd') / 1000, 2)) \\\n  .withColumn('is_large', col('amount_usd') >= 9000) \\\n  .select('txn_id', 'src_wallet', 'amount_usd', 'amount_k', 'is_large') \\\n  .show(8)",
   note: 'withColumn adds or replaces one column and returns a new DataFrame. Chaining twenty withColumn calls builds a deep plan — for many columns at once, a single select with all the expressions is flatter and analyses faster.' },
 { t: 'when / otherwise — the CASE expression',
   code: "spark.table('transfers') \\\n  .withColumn('band',\n     when(col('amount_usd') >= 9000, 'near-threshold')\n     .when(col('amount_usd') >= 1000, 'large')\n     .otherwise('small')) \\\n  .groupBy('band').agg(count('*').alias('n'), round(avg('amount_usd'), 2).alias('avg')) \\\n  .orderBy(col('n').desc()) \\\n  .show()",
   note: 'Conditions are tested top to bottom and the first match wins, so order them from most specific. Without .otherwise() the unmatched rows get null rather than an error — which is how a category quietly disappears from a report.' },
 { t: 'Boolean combination uses & and |, not and / or',
   code: "spark.table('transfers') \\\n  .filter((col('amount_usd') > 5000) & (col('is_flagged') == 1)) \\\n  .select('txn_id', 'src_wallet', 'amount_usd', 'is_flagged') \\\n  .show()",
   note: 'Each side must be parenthesised, because & binds tighter than the comparison operators. Python\u2019s and/or cannot be overloaded to build a Column, which is why they fail with a truth-value error rather than doing what you meant.' },
 { t: 'Nulls propagate through expressions',
   code: "spark.table('wallets') \\\n  .withColumn('band_or_default', coalesce(col('risk_band'), lit('unclassified'))) \\\n  .withColumn('has_band', col('risk_band').isNotNull()) \\\n  .select('wallet_id', 'risk_band', 'band_or_default', 'has_band') \\\n  .show()",
   note: 'w-8 has a null risk_band. Any arithmetic or comparison involving null yields null, and a null never satisfies a filter — so coalesce and isNotNull are how you make the handling explicit rather than accidental.' }
],
body: [
 { h: 'The two APIs', html:
   '<div class="pre code">df.select(\'a\', \'b\')                 <i>string form \u2014 short, column names only</i>\ndf.select(col(\'a\'), col(\'b\') * 2)  <i>column form \u2014 needed for any expression</i>\ndf.filter(\"amount_usd &gt; 5000\")      <u>SQL-string form \u2014 supported in Spark, not in this bench</u></div>' +
   '<p>The string form is fine for plain projections. Anything computed needs the Column API, and mixing the two in one call is a common source of confusion.</p>' },
 { h: 'Operator translation', html:
   '<table><thead><tr><th>Python</th><th>PySpark Column</th><th>Why</th></tr></thead><tbody>' +
   '<tr><td><code>and</code></td><td><code>&amp;</code></td><td>Python cannot overload <code>and</code></td></tr>' +
   '<tr><td><code>or</code></td><td><code>|</code></td><td>Same</td></tr>' +
   '<tr><td><code>not</code></td><td><code>~</code></td><td>Same</td></tr>' +
   '<tr><td><code>==</code></td><td><code>==</code></td><td>Overloaded to build a Column</td></tr>' +
   '<tr><td><code>x is None</code></td><td><code>col(\'x\').isNull()</code></td><td><code>is</code> cannot be overloaded</td></tr>' +
   '</tbody></table>' },
 { h: 'Reusing expressions', html:
   '<p>Because a Column is just an expression, you can define it once and apply it in several places \u2014 a genuine advantage over SQL strings:</p>' +
   '<div class="pre code">near_threshold = (col(\'amount_usd\') &gt;= 9000)\ndf.filter(near_threshold)\ndf.withColumn(\'flag\', when(near_threshold, 1).otherwise(0))</div>' +
   '<p>That is how you keep a business rule defined once across a pipeline instead of copying a predicate into six places.</p>' }
],
call: '"A Column is an unevaluated expression rather than a value, so I define a rule like the near-threshold predicate once and reuse it in both the filter and the flag \u2014 and I use the bitwise operators, because Python\u2019s and/or cannot be overloaded to build a plan fragment."',
warn: 'Using `and` between two Column objects raises a truth-value error, and forgetting the parentheses around each side of `&` silently changes the precedence. Both are so common they are effectively a rite of passage.',
qf: [
 ['What is a Column in PySpark?', 'An unevaluated expression — a fragment of the logical plan, not a value.'],
 ['Why & and | instead of and / or?', 'Python cannot overload and/or, so they cannot build a Column expression.'],
 ['What does when() return without otherwise()?', 'Null for unmatched rows — no error.'],
 ['How do you test for null?', "col('x').isNull() — the `is None` operator cannot be overloaded."],
 ['Why prefer one select over twenty withColumn calls?', 'It builds a flatter plan that analyses faster; deep withColumn chains slow down planning.'],
 ['Advantage of Columns over SQL strings?', 'They are composable — define a predicate once and reuse it across filters and derived columns.']
]});

/* ══════════════ TRACK T · TRANSFORMATIONS ══════════════ */

M.push({
code: 'T1', track: 'Track T · Transformations', title: 'Narrow versus wide transformations',
sub: 'The single most important distinction in Spark, visible in the plan and in the partition counts.',
lede: 'A <em class="hl">narrow</em> transformation computes each output partition from exactly one input partition, so it needs no network. A <em class="hl">wide</em> one needs rows from many partitions, so it writes shuffle files, ends a stage, and re-reads them across the network. Every performance question in Spark reduces to how many wide transformations you have and how much data moves through each.',
ex: [
 { t: 'All narrow — one stage, no shuffle',
   code: "spark.table('transfers') \\\n  .filter(col('amount_usd') > 1000) \\\n  .withColumn('fee', col('amount_usd') * 0.001) \\\n  .select('txn_id', 'src_wallet', 'amount_usd', 'fee') \\\n  .show(6)",
   note: 'Three transformations, zero Exchanges, one stage. The partition count never changes and no row crosses a partition boundary. Narrow operations fuse into a single pass over the data — this is as cheap as Spark gets.' },
 { t: 'One groupBy adds a shuffle and a stage boundary',
   code: "spark.table('transfers') \\\n  .filter(col('amount_usd') > 1000) \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('n')) \\\n  .show()",
   note: 'The Exchange in the plan is the stage boundary. Note what it says about the partial aggregate: Spark reduces within each partition first, so far fewer rows cross the network than the filter produced.' },
 { t: 'Stacking wide operations',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(sum('amount_usd').alias('vol')) \\\n  .orderBy(col('vol').desc()) \\\n  .show()",
   note: 'Two Exchanges now: one to group, one to sort. A global orderBy is always a shuffle because ordering is a property of the whole dataset, not of a partition. Three stages for what looks like two lines of code.' },
 { t: 'distinct is wide — and people forget',
   code: "spark.table('transfers').select('src_wallet').distinct().show()",
   note: 'distinct() must compare rows across partitions, so it shuffles. dropDuplicates() is the same. A distinct sitting innocently in the middle of a chain is a stage boundary nobody noticed.' }
],
body: [
 { h: 'The classification', html:
   '<table><thead><tr><th>Narrow \u2014 no shuffle</th><th>Wide \u2014 shuffle</th></tr></thead><tbody>' +
   '<tr><td>select, filter, withColumn</td><td>groupBy + agg</td></tr>' +
   '<tr><td>drop, withColumnRenamed</td><td>join (unless broadcast)</td></tr>' +
   '<tr><td>union</td><td>distinct, dropDuplicates</td></tr>' +
   '<tr><td>coalesce (reducing)</td><td>orderBy, sort</td></tr>' +
   '<tr><td>broadcast join</td><td>repartition</td></tr>' +
   '<tr><td>map-side operations</td><td>window with partitionBy</td></tr>' +
   '</tbody></table>' +
   '<p>Two entries are worth memorising because they surprise people: <strong>coalesce is narrow</strong> (it merges partitions locally), and <strong>a broadcast join is narrow</strong> (the small side is shipped once, the large side never moves).</p>' },
 { h: 'What a shuffle actually costs', html:
   '<ol>' +
   '<li><strong>Serialise and write</strong> shuffle files to local disk on every executor.</li>' +
   '<li><strong>Transfer</strong> across the network, all-to-all.</li>' +
   '<li><strong>Read, deserialise and merge</strong> on the receiving side, spilling if memory runs out.</li>' +
   '</ol>' +
   '<p>Disk plus network plus serialisation, on every row that moves. That is why the count of Exchanges predicts runtime far better than the number of lines of code.</p>' },
 { h: 'Stages, tasks and jobs', html:
   '<div class="pre">job    <i>one action</i>\n  stage  <i>work between two shuffle boundaries</i>\n    task   <i>one stage applied to one partition \u2014 the unit of parallelism</i></div>' +
   '<p>Tasks per stage equals the partition count, which is why partition count is the parallelism dial. A stage with four partitions cannot use more than four cores no matter how large the cluster is.</p>' }
],
call: '"Narrow transformations compute each output partition from one input partition, so they fuse and cost nothing extra; wide ones write shuffle files, cross the network and end a stage. I count Exchanges in the plan first, because that count predicts runtime better than anything else in the code."',
warn: 'coalesce is narrow and repartition is wide, and that difference is why coalesce can leave you with badly uneven partitions. It merges neighbours locally rather than redistributing, which is exactly what makes it cheap.',
qf: [
 ['Define narrow and wide.', 'Narrow: each output partition depends on one input partition, no network. Wide: output depends on many input partitions, requiring a shuffle.'],
 ['Which common operations are wide?', 'groupBy, join (unless broadcast), distinct, dropDuplicates, orderBy, repartition, and windows with partitionBy.'],
 ['Is coalesce narrow or wide?', 'Narrow — it merges adjacent partitions locally without redistributing.'],
 ['Is a broadcast join a shuffle?', 'No. The small side is shipped to every executor and the large side never moves.'],
 ['What are the three costs of a shuffle?', 'Writing shuffle files to disk, transferring over the network, and reading plus merging with possible spill.'],
 ['What determines the task count in a stage?', 'The number of partitions — which is therefore the parallelism ceiling.']
]});

M.push({
code: 'T2', track: 'Track T · Transformations', title: 'groupBy, aggregation and partial aggregates',
sub: 'Why a groupBy on a billion rows does not send a billion rows over the network.',
lede: 'A naive reading of groupBy says every row travels to the partition owning its key. Spark does not do that: it aggregates within each partition first and shuffles only the partial results. Understanding that changes how you reason about which aggregations are cheap and which genuinely are not.',
ex: [
 { t: 'The partial aggregate, made visible',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('n'),\n       round(sum('amount_usd'), 2).alias('vol'),\n       round(avg('amount_usd'), 2).alias('avg_txn'),\n       max('amount_usd').alias('largest')) \\\n  .orderBy(col('vol').desc()) \\\n  .show()",
   note: 'The Exchange line reports how many rows crossed the network after the map-side partial aggregate. Sixty input rows become far fewer, because each partition reduced its own groups first. This is why COUNT and SUM scale well.' },
 { t: 'Multi-key grouping',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet', 'is_flagged') \\\n  .agg(count('*').alias('n'), round(sum('amount_usd'), 2).alias('vol')) \\\n  .orderBy(col('src_wallet'), col('is_flagged')) \\\n  .show(10)",
   note: 'The group key is the tuple, so cardinality multiplies. More groups means more rows survive the partial aggregate and more data crosses the network — grouping on a high-cardinality key is where the partial aggregate stops helping.' },
 { t: 'Conditional aggregation instead of multiple passes',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('total'),\n       sum(when(col('is_flagged') == 1, 1).otherwise(0)).alias('flagged'),\n       sum(when(col('amount_usd') >= 9000, col('amount_usd')).otherwise(0)).alias('near_threshold_vol')) \\\n  .orderBy(col('flagged').desc()) \\\n  .show()",
   note: 'One shuffle, three answers. Filtering three times and joining the results would cost three shuffles plus two joins for the same information — this is the single highest-value aggregation habit.' },
 { t: 'countDistinct does not decompose',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('n'), countDistinct('dst_wallet').alias('distinct_dsts')) \\\n  .orderBy(col('n').desc()) \\\n  .show()",
   note: 'COUNT and SUM combine from partials; DISTINCT cannot, because a partition cannot know whether a value it has seen also appears elsewhere. At scale this is the aggregate that forces real data movement, and why approx_count_distinct exists.' }
],
body: [
 { h: 'Which aggregates decompose', html:
   '<table><thead><tr><th>Aggregate</th><th>Combines from partials?</th><th>Cost at scale</th></tr></thead><tbody>' +
   '<tr><td>count, sum, min, max</td><td><b>Yes</b></td><td>Cheap \u2014 one value per group per partition crosses</td></tr>' +
   '<tr><td>avg</td><td>Yes (sum and count)</td><td>Cheap</td></tr>' +
   '<tr><td>countDistinct</td><td><b>No</b></td><td>Expensive \u2014 values themselves must move</td></tr>' +
   '<tr><td>collect_list, collect_set</td><td>No</td><td>Expensive, and can blow up executor memory</td></tr>' +
   '<tr><td>approx_count_distinct</td><td>Yes (HyperLogLog sketches)</td><td>Cheap, roughly 2% error</td></tr>' +
   '</tbody></table>' },
 { h: 'The shape to reach for', html:
   '<div class="pre code">df.groupBy(key).agg(\n    count(\'*\').alias(\'n\'),\n    sum(when(cond, 1).otherwise(0)).alias(\'matching\'),\n    sum(when(cond, amount).otherwise(0)).alias(\'matching_vol\'))\n   <i>one shuffle, many answers</i>\n\ndf.filter(cond).groupBy(key).count()  +  df.groupBy(key).count()  +  join\n   <u>three shuffles and a join for the same result</u></div>' },
 { h: 'agg versus the shortcut methods', html:
   '<p><code>df.groupBy(k).count()</code> and <code>df.groupBy(k).sum(\'x\')</code> are shorthand that produce awkward column names such as <code>sum(x)</code>. Use <code>.agg(...)</code> with explicit <code>.alias()</code> in anything that will be read by another person or joined downstream \u2014 the shorthand is fine at a REPL and a liability in a repo.</p>' }
],
call: '"Spark aggregates within each partition before shuffling, so count and sum send one value per group per partition rather than every row \u2014 that is why they scale. countDistinct cannot decompose, so the values themselves have to move, which is when I reach for approx_count_distinct."',
warn: 'collect_list in an aggregate pulls every value for a group into one executor\'s memory. On a skewed key that is an OOM waiting to happen, and the error will point at the executor rather than at the aggregate that caused it.',
qf: [
 ['What is a partial aggregate?', 'Spark reduces each partition locally before shuffling, so only per-group partials cross the network.'],
 ['Which aggregates decompose?', 'count, sum, min, max and avg. countDistinct and collect_list do not.'],
 ['Why is countDistinct expensive?', 'A partition cannot know whether a value appears elsewhere, so the values themselves must be shuffled.'],
 ['Cheaper alternative to exact distinct counts?', 'approx_count_distinct — HyperLogLog, roughly 2% error, decomposable.'],
 ['How do you compute several conditional metrics in one pass?', 'Conditional aggregation — sum(when(cond, …)) inside a single agg, one shuffle.'],
 ['Why prefer agg() over groupBy().count()?', 'Explicit aliases; the shortcuts produce names like sum(x) that are awkward downstream.']
]});

M.push({
code: 'T3', track: 'Track T · Transformations', title: 'Window functions',
sub: 'Ranking and running totals without collapsing rows — and the partitionBy you must not forget.',
lede: 'A window function attaches a calculation to every row without reducing the row count, which makes it the tool for top-N-per-group, running totals and comparisons with a previous row. In Spark it is also a shuffle: rows sharing a partition key must end up together, so a window carries the same cost model as a groupBy.',
ex: [
 { t: 'Ranking within a partition',
   code: "spark.table('transfers') \\\n  .withColumn('rn', row_number().over(\n      Window.partitionBy('src_wallet').orderBy(col('amount_usd').desc()))) \\\n  .filter(col('rn') <= 2) \\\n  .select('src_wallet', 'txn_id', 'amount_usd', 'rn') \\\n  .orderBy(col('src_wallet'), col('rn')) \\\n  .show(12)",
   note: 'Top-2 transfers per wallet. The window is computed first and filtered afterwards — exactly the two-step shape as in SQL, because a window value does not exist until the window has been evaluated.' },
 { t: 'Running total within a wallet',
   code: "spark.table('transfers') \\\n  .filter(col('src_wallet') == 'w-2') \\\n  .withColumn('running_vol', round(sum('amount_usd').over(\n      Window.partitionBy('src_wallet').orderBy('ts', 'txn_id')), 2)) \\\n  .select('txn_id', 'ts', 'amount_usd', 'running_vol') \\\n  .show(10)",
   note: 'With an orderBy inside the Window, an aggregate becomes cumulative. Without one it covers the whole partition — the same distinction as SQL, and the same trap.' },
 { t: 'Comparing with the previous row',
   code: "spark.table('transfers') \\\n  .filter(col('src_wallet') == 'w-2') \\\n  .withColumn('prev', lag('amount_usd').over(\n      Window.partitionBy('src_wallet').orderBy('ts', 'txn_id'))) \\\n  .withColumn('delta', col('amount_usd') - col('prev')) \\\n  .select('txn_id', 'ts', 'amount_usd', 'prev', 'delta') \\\n  .show(8)",
   note: 'The first row of each partition has no predecessor, so lag returns null and the delta is null. That is correct, and it means anything summing the delta downstream needs to handle it.' },
 { t: 'A window with no partitionBy sends everything to one partition',
   code: "spark.table('transfers') \\\n  .withColumn('overall_rank', row_number().over(Window.orderBy(col('amount_usd').desc()))) \\\n  .filter(col('overall_rank') <= 5) \\\n  .select('overall_rank', 'txn_id', 'src_wallet', 'amount_usd') \\\n  .show()",
   note: 'Read the plan: Exchange SinglePartition. Every row in the dataset is moved to one executor so a global ordering can be assigned. It works here on sixty rows and it will not work on a billion — this is one of the few Spark operations that simply does not scale.' }
],
body: [
 { h: 'The anatomy', html:
   '<div class="pre code">Window.partitionBy(\'src_wallet\')   <i>groups rows \u2014 like GROUP BY but non-collapsing</i>\n      .orderBy(col(\'ts\'))          <i>ordering inside each group</i>\n      .rowsBetween(-2, 0)          <i>frame \u2014 which rows count</i></div>' +
   '<table><thead><tr><th>Function</th><th>Gives</th></tr></thead><tbody>' +
   '<tr><td>row_number()</td><td>1, 2, 3, 4 \u2014 unique, arbitrary on ties</td></tr>' +
   '<tr><td>rank()</td><td>1, 2, 2, 4 \u2014 gaps after ties</td></tr>' +
   '<tr><td>dense_rank()</td><td>1, 2, 2, 3 \u2014 no gaps</td></tr>' +
   '<tr><td>lag / lead</td><td>Previous / next row in the ordering</td></tr>' +
   '<tr><td>sum, avg, count over a window</td><td>Running totals when ordered; whole-partition value when not</td></tr>' +
   '</tbody></table>' },
 { h: 'The performance rules', html:
   '<ul>' +
   '<li><strong>Always partitionBy something</strong> unless the dataset genuinely is tiny. Without it, Spark moves everything to one partition.</li>' +
   '<li><strong>The partition key drives skew</strong> exactly as it does in a groupBy \u2014 a hot key makes one task do all the work.</li>' +
   '<li><strong>Reuse one Window definition</strong> across several columns so Spark can share the shuffle rather than repeating it.</li>' +
   '<li><strong>Filter before the window</strong>, never after, when the filter does not depend on the window value.</li>' +
   '</ul>' },
 { h: 'Window or groupBy?', html:
   '<p>If you need the detail rows alongside the aggregate, it is a window. If you only need one row per group, groupBy is cheaper \u2014 it can use a partial aggregate, and a window cannot, because every input row must be retained to receive its value. That difference is worth stating in an interview: a window shuffles more data than the equivalent groupBy.</p>' }
],
call: '"A window keeps every row and attaches a calculation, so unlike a groupBy it cannot use a partial aggregate \u2014 every input row crosses the shuffle. And a Window with no partitionBy moves the entire dataset into a single partition, which is one of the few things in Spark that genuinely does not scale."',
warn: 'Window.orderBy() with no partitionBy produces an Exchange SinglePartition. It works fine in development on a sample and fails in production on the full dataset, usually as an executor OOM rather than anything that names the window.',
qf: [
 ['What does a window function do that groupBy does not?', 'Keeps every input row and attaches a per-group calculation.'],
 ['Why is a window more expensive than the equivalent groupBy?', 'It cannot use a partial aggregate — every row must cross the shuffle to receive its value.'],
 ['What happens with no partitionBy?', 'Exchange SinglePartition — the whole dataset moves to one partition.'],
 ['row_number vs rank vs dense_rank?', 'Unique sequential; same rank then a gap; same rank with no gap.'],
 ['How do you get top-N per group?', 'Rank in a window, then filter on the rank in a following step.'],
 ['Why reuse one Window object?', 'Several columns can share one shuffle instead of repeating it.']
]});

/* ══════════════ TRACK J · JOINS ══════════════ */

M.push({
code: 'J1', track: 'Track J · Joins', title: 'Join strategies: broadcast versus sort-merge',
sub: 'The single biggest win available in Spark, and how to tell which one you got.',
lede: 'Spark picks a physical join strategy from the estimated size of each side. If one side fits in memory it is <em class="hl">broadcast</em> to every executor and the large side never moves \u2014 no shuffle at all. Otherwise both sides are shuffled by the join key. Recognising which one you got, and making the good one happen, is the highest-leverage tuning skill in Spark.',
ex: [
 { t: 'Small dimension: broadcast, zero shuffles',
   code: "spark.table('transfers') \\\n  .join(spark.table('wallets'), col('src_wallet') == col('wallet_id')) \\\n  .select('txn_id', 'src_wallet', 'risk_band', 'amount_usd') \\\n  .show(8)",
   note: 'Read the plan: BroadcastHashJoin, and the partition count is unchanged at 4. The wallets table is small, so it is shipped to every executor and the sixty transfer rows stay exactly where they were. One stage, no Exchange.' },
 { t: 'Forcing the strategy with an explicit hint',
   code: "spark.table('transfers') \\\n  .join(broadcast(spark.table('alerts')), col('src_wallet') == col('wallet_id'), 'left') \\\n  .select('txn_id', 'src_wallet', 'rule_code', 'severity') \\\n  .show(10)",
   note: 'broadcast() overrides the size estimate. Useful when statistics are stale or missing — a freshly written table often has no statistics, so Spark guesses large and shuffles a table that would have fitted comfortably in memory.' },
 { t: 'The fan-out a join can cause',
   code: "before = spark.table('transfers').count()\nspark.table('transfers') \\\n  .join(broadcast(spark.table('alerts')), col('src_wallet') == col('wallet_id')) \\\n  .count()",
   note: 'Two wallets have two alerts each, so transfers from those wallets appear twice. Sixty rows in, more than sixty out — and any sum of amount_usd after this point is inflated. The join changed the grain, exactly as in SQL.' },
 { t: 'A semi join answers existence without fanning out',
   code: "spark.table('transfers') \\\n  .join(broadcast(spark.table('alerts')), col('src_wallet') == col('wallet_id'), 'left_semi') \\\n  .count()",
   note: 'left_semi keeps left rows that have at least one match and never duplicates them. When the question is "which transfers come from an alerted wallet?" this is both correct and cheaper than a join plus distinct.' }
],
body: [
 { h: 'The strategies', html:
   '<table><thead><tr><th>Strategy</th><th>Shuffle?</th><th>Chosen when</th></tr></thead><tbody>' +
   '<tr><td><b>Broadcast hash join</b></td><td><b>No</b></td><td>One side is below the broadcast threshold</td></tr>' +
   '<tr><td>Shuffle hash join</td><td>Yes</td><td>One side is much smaller but too big to broadcast</td></tr>' +
   '<tr><td><b>Sort-merge join</b></td><td>Yes</td><td>Both sides large \u2014 the default</td></tr>' +
   '<tr><td>Broadcast nested loop</td><td>No</td><td>No equality condition \u2014 usually a mistake</td></tr>' +
   '</tbody></table>' +
   '<div class="pre code">spark.sql.autoBroadcastJoinThreshold   <i>default 10 MB; -1 disables broadcasting</i>\nbroadcast(df)                         <i>explicit hint, ignores the estimate</i></div>' +
   '<p>The threshold is compared against the <em class="hl">estimated</em> size. If a table has never been analysed the estimate can be wildly wrong in either direction, which is why the explicit hint exists.</p>' },
 { h: 'When broadcasting goes wrong', html:
   '<ul>' +
   '<li><strong>The small side is not small.</strong> It is collected to the driver first, so broadcasting something large gives you a driver OOM \u2014 an error that names the driver, not the join.</li>' +
   '<li><strong>Broadcasting inside a loop.</strong> The same table broadcast on every iteration is re-collected every time.</li>' +
   '<li><strong>Raising the threshold globally</strong> to fix one query, which then breaks a different one.</li>' +
   '</ul>' },
 { h: 'Join type still matters', html:
   '<p>Strategy is physical; join <em class="hl">type</em> is semantics, and the SQL rules apply unchanged: an inner join silently drops non-matching rows, a left join preserves them with nulls, and a join to a non-unique key fans the left side out. Adaptive Query Execution can change the strategy at runtime but it will never change the type \u2014 correctness is still entirely yours.</p>' }
],
call: '"If either side fits in memory Spark broadcasts it and the large side never moves, which turns a shuffle join into a narrow operation. When statistics are stale I use an explicit broadcast hint rather than raising the global threshold, because that fixes one query and risks a driver OOM elsewhere."',
warn: 'Broadcasting collects the small side to the driver before shipping it. A hint on a table that turns out to be several gigabytes gives you a driver out-of-memory error that mentions neither the join nor the table — one of the harder Spark failures to trace back.',
qf: [
 ['Name the join strategies.', 'Broadcast hash, shuffle hash, sort-merge, and broadcast nested loop.'],
 ['When is a broadcast join chosen?', 'When one side\'s estimated size is under spark.sql.autoBroadcastJoinThreshold — 10 MB by default.'],
 ['Why is a broadcast join narrow?', 'The small side is shipped to every executor; the large side is never redistributed.'],
 ['Why use an explicit broadcast hint?', 'Size estimates can be stale or missing, so Spark may shuffle a table that would fit in memory.'],
 ['What is the danger of broadcasting?', 'The small side is collected to the driver first — too large and the driver runs out of memory.'],
 ['How do you check existence without fan-out?', 'A left_semi join — keeps matching left rows once each.']
]});

M.push({
code: 'J2', track: 'Track J · Joins', title: 'Skew: when one key does all the work',
sub: 'The failure with no single-node equivalent — measured here, not described.',
lede: 'A shuffle sends every row with the same key to the same partition. If one key holds a large share of the data, one task receives it all: the stage finishes at the speed of that task while every other core idles. Adding executors changes nothing, because the work is not divisible as laid out. The transfers table in this bench is deliberately skewed so you can measure it.',
ex: [
 { t: 'Find the skew before you tune anything',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('rows')) \\\n  .orderBy(col('rows').desc()) \\\n  .show()",
   note: 'w-2 holds 28 of 60 rows — roughly 47% on one key. This query is the diagnostic: always run it before changing any configuration, because skew and under-provisioning look identical from the outside.' },
 { t: 'The skew, physically',
   code: "spark.table('transfers').repartition(8, 'src_wallet').show(3)",
   note: 'Look at the partition histogram below the plan, not at the rows. One partition holds well over half the dataset — the 28 w-2 rows plus whatever else hashes into the same bucket — while two partitions are completely empty. That is measured from the partitions the engine actually built, and the stage takes as long as the largest bar.' },
 { t: 'Salting: split the hot key across partitions',
   code: "spark.table('transfers') \\\n  .withColumn('salt', col('amount_usd') % 8) \\\n  .withColumn('salted_key', concat(col('src_wallet'), lit('#'), col('salt'))) \\\n  .repartition(8, 'salted_key') \\\n  .show(3)",
   note: 'Same data, same partition count, dramatically flatter histogram. The hot key is now spread across up to eight partitions. The cost is that aggregation becomes two-stage: aggregate by salted key, then re-aggregate by the real key.' },
 { t: 'The two-stage aggregation salting forces',
   code: "spark.table('transfers') \\\n  .withColumn('salt', col('amount_usd') % 8) \\\n  .groupBy('src_wallet', 'salt') \\\n  .agg(sum('amount_usd').alias('part_vol')) \\\n  .groupBy('src_wallet') \\\n  .agg(round(sum('part_vol'), 2).alias('vol')) \\\n  .orderBy(col('vol').desc()) \\\n  .show()",
   note: 'Two shuffles instead of one, but the first is evenly spread and the second is tiny. Compare the total with T2.1 — identical numbers, different physical shape. Salting trades an extra cheap shuffle for a balanced expensive one.' }
],
body: [
 { h: 'Recognising skew', html:
   '<table><thead><tr><th>Symptom</th><th>Reading</th></tr></thead><tbody>' +
   '<tr><td>One task runs far longer than the rest of its stage</td><td>Classic skew</td></tr>' +
   '<tr><td>Stage duration \u2248 slowest task duration</td><td>No effective parallelism</td></tr>' +
   '<tr><td>Adding executors does not help</td><td>Confirms it is not capacity</td></tr>' +
   '<tr><td>Executor OOM on one node only</td><td>Skew plus a memory-hungry aggregate</td></tr>' +
   '</tbody></table>' },
 { h: 'The remedies, in the order to try them', html:
   '<ol>' +
   '<li><strong>Broadcast the other side</strong> if it is small. No shuffle means no skew \u2014 always try this first.</li>' +
   '<li><strong>Let AQE handle it.</strong> <code>spark.sql.adaptive.skewJoin.enabled</code> splits oversized shuffle partitions at runtime, and in Spark 3 it is on by default.</li>' +
   '<li><strong>Filter the hot key out</strong> and process it separately, if it is a known sentinel such as an unknown-customer id.</li>' +
   '<li><strong>Salt</strong> \u2014 effective and invasive, since every downstream aggregation must be made two-stage.</li>' +
   '</ol>' +
   '<p>Salting is the answer candidates reach for first and the one to reach for last. Naming the cheaper options before it signals actual experience.</p>' },
 { h: 'Where the skew comes from', html:
   '<p>Almost always the data, not the code: a null or sentinel key that dominates, a single mega-customer, an ingest bug that assigned one default value to a million rows. Check the key distribution before touching Spark configuration. A <code>groupBy(key).count().orderBy(desc)</code> is thirty seconds of work and it either finds the problem or rules it out.</p>' }
],
call: '"Skew means one key sends most of the rows to one task, so the stage runs at the speed of that task and adding executors changes nothing. I check the key distribution first, then try broadcasting or AQE skew handling, and only salt as a last resort because it makes every downstream aggregation two-stage."',
warn: 'Skew and under-provisioning look identical from the outside: the job is slow and one stage dominates. The instinct is to add executors, which costs money and changes nothing. Measure the key distribution before resizing anything.',
qf: [
 ['What is data skew?', 'One key holds a disproportionate share of rows, so one task does most of the work after a shuffle.'],
 ['Why does adding executors not help?', 'The work is not divisible as laid out — the hot partition still goes to a single task.'],
 ['What is the cheapest fix?', 'Broadcast the other side if it is small enough, which removes the shuffle entirely.'],
 ['What does AQE do about skew?', 'Splits oversized shuffle partitions at runtime — enabled by default in Spark 3.'],
 ['What is salting and what does it cost?', 'Adding a random suffix to spread a hot key, at the cost of making every downstream aggregation two-stage.'],
 ['How do you diagnose it?', 'groupBy the join or group key, count, and order descending — before changing any configuration.']
]});

/* ══════════════ TRACK S · SHUFFLE & PARTITIONING ══════════════ */

M.push({
code: 'S1', track: 'Track S · Shuffle & partitioning', title: 'Partitions and parallelism',
sub: 'The partition count is the parallelism dial — and both extremes hurt.',
lede: 'A task processes exactly one partition, so partition count sets both the ceiling on parallelism and the size of each unit of work. Too few and cores sit idle while individual tasks run long and risk spilling; too many and scheduling overhead dominates. The target is a partition size, not a partition number.',
ex: [
 { t: 'Partition count survives narrow operations',
   code: "spark.table('transfers') \\\n  .filter(col('amount_usd') > 8000) \\\n  .select('txn_id', 'src_wallet', 'amount_usd') \\\n  .show(5)",
   note: 'The filter removed most rows and the partition count is still 4 — narrow operations never change it. Each partition simply holds fewer rows. Make the filter selective enough, or start from more partitions, and this is exactly how a DataFrame ends up with many nearly-empty partitions that each still cost a scheduled task.' },
 { t: 'Shuffles reset it to the configured default',
   code: "spark.table('transfers') \\\n  .groupBy('src_wallet') \\\n  .agg(count('*').alias('n')) \\\n  .show()",
   note: 'Input had 4 partitions; after the Exchange there are 8 — the shuffle partition setting, which in real Spark defaults to 200. Eight groups spread over 200 partitions would mean 192 empty tasks, each with real scheduling cost.' },
 { t: 'Explicitly setting the partition count',
   code: "spark.table('transfers').repartition(12).show(3)",
   note: 'repartition(n) with no column does a round-robin shuffle: perfectly even, and it destroys any existing co-partitioning. Use it to increase parallelism; use repartition(n, col) when a following join or window will group by that column anyway.' },
 { t: 'The empty-partition problem after a selective filter',
   code: "spark.table('transfers') \\\n  .repartition(16) \\\n  .filter(col('is_flagged') == 1) \\\n  .show(4)",
   note: 'Sixteen partitions, a selective filter, and most partitions now hold one row or none. Every one still costs a task to schedule. coalesce after a heavy filter is the standard fix — see S2.' }
],
body: [
 { h: 'Sizing', html:
   '<div class="pre">target partition size    ~128 MB (matching the HDFS/S3 block convention)\ntarget task duration     100 ms \u2013 a few seconds\npartitions per core      2\u20134, so stragglers can be absorbed\n\nspark.sql.shuffle.partitions   <i>default 200 \u2014 almost never the right number</i>\nspark.default.parallelism      <i>RDD API only</i></div>' +
   '<p>The default of 200 is a value to change deliberately, not a recommendation. On a small dataset it creates hundreds of near-empty tasks; on a large one it makes each task far too big.</p>' },
 { h: 'Both extremes, and how they present', html:
   '<table><thead><tr><th></th><th>Too few partitions</th><th>Too many</th></tr></thead><tbody>' +
   '<tr><td>Symptom</td><td>Idle cores; long tasks; spill</td><td>Task scheduling dominates runtime</td></tr>' +
   '<tr><td>In the UI</td><td>Few tasks, high shuffle spill</td><td>Thousands of tasks, each a few ms</td></tr>' +
   '<tr><td>Risk</td><td>Executor OOM</td><td>Driver overhead, many tiny output files</td></tr>' +
   '<tr><td>Fix</td><td>repartition up</td><td>coalesce down, or lower shuffle.partitions</td></tr>' +
   '</tbody></table>' },
 { h: 'What AQE changes', html:
   '<p>Adaptive Query Execution, on by default in Spark 3, coalesces shuffle partitions at runtime using actual sizes rather than the static setting. It largely removes the need to tune <code>spark.sql.shuffle.partitions</code> by hand \u2014 but only for shuffle output. The <em class="hl">read</em> partition count still comes from your input file layout, which is why file sizing (W1) remains yours to get right.</p>' }
],
call: '"Partition count is the parallelism ceiling because one task processes one partition, so I target roughly 128 MB per partition and two to four partitions per core rather than a fixed number. AQE coalesces shuffle partitions at runtime now, but the read-side count still comes from how the files were written."',
warn: 'A narrow filter never changes the partition count, so a DataFrame filtered from a billion rows to a thousand still has the original partition count — mostly empty, each still costing a scheduled task. Coalesce after any heavily selective filter.',
qf: [
 ['What determines the number of tasks in a stage?', 'The partition count — one task per partition.'],
 ['What is a good target partition size?', 'Roughly 128 MB, with tasks running from about 100 ms to a few seconds.'],
 ['What is the default for spark.sql.shuffle.partitions?', '200 — rarely the right number for either small or very large data.'],
 ['What happens to partition count after a filter?', 'It is unchanged; partitions simply become smaller or empty.'],
 ['Symptoms of too few partitions?', 'Idle cores, long-running tasks, shuffle spill and executor OOM risk.'],
 ['What does AQE do here?', 'Coalesces shuffle partitions at runtime from actual sizes, reducing manual tuning of shuffle.partitions.']
]});

M.push({
code: 'S2', track: 'Track S · Shuffle & partitioning', title: 'repartition versus coalesce',
sub: 'One shuffles and balances; the other merges locally and can leave you lopsided.',
lede: 'These two look interchangeable and are not. <code>repartition</code> is a full shuffle that can go up or down and produces even partitions. <code>coalesce</code> merges adjacent partitions without moving data between executors \u2014 far cheaper, can only reduce, and inherits whatever imbalance already existed.',
ex: [
 { t: 'coalesce merges neighbours — no shuffle in the plan',
   code: "spark.table('transfers').coalesce(2).show(3)",
   note: 'The plan shows Coalesce marked narrow, with no Exchange. Four partitions became two by merging adjacent ones in place. This is why it is cheap, and why the result is only as even as the input was.' },
 { t: 'repartition shuffles and balances',
   code: "spark.table('transfers').repartition(2).show(3)",
   note: 'Same target of 2 partitions, but the plan shows an Exchange and the histogram is even. You paid for a full shuffle to get that balance — which is the whole trade between these two operations.' },
 { t: 'coalesce inherits existing imbalance',
   code: "spark.table('transfers') \\\n  .repartition(8, 'src_wallet') \\\n  .coalesce(2) \\\n  .show(3)",
   note: 'Repartitioning by the hot key creates skew, then coalesce merges those uneven partitions without rebalancing. Compare the histogram with the previous example: repartition(2) gives a perfectly even split, this gives a visibly lopsided one. Coalesce cannot fix skew — only a real shuffle redistributes rows.' },
 { t: 'The standard use: shrink before writing',
   code: "spark.table('transfers') \\\n  .filter(col('is_flagged') == 1) \\\n  .coalesce(1) \\\n  .show(5)",
   note: 'After a selective filter you have many nearly-empty partitions, each of which would become a tiny output file. coalesce(1) merges them at almost no cost. Note that coalesce(1) also caps parallelism at one task for everything upstream in that stage.' }
],
body: [
 { h: 'The comparison', html:
   '<table><thead><tr><th></th><th>repartition(n)</th><th>coalesce(n)</th></tr></thead><tbody>' +
   '<tr><td>Shuffle</td><td><b>Yes</b> \u2014 full</td><td><b>No</b> \u2014 local merge</td></tr>' +
   '<tr><td>Direction</td><td>Up or down</td><td>Down only</td></tr>' +
   '<tr><td>Balance</td><td>Even</td><td>Inherits the input\u2019s imbalance</td></tr>' +
   '<tr><td>Cost</td><td>Network and disk</td><td>Nearly free</td></tr>' +
   '<tr><td>By column</td><td><b>Yes</b> \u2014 repartition(n, col)</td><td>No</td></tr>' +
   '<tr><td>Use for</td><td>Increasing parallelism, fixing skew, pre-join co-partitioning</td><td>Reducing output files after a filter</td></tr>' +
   '</tbody></table>' },
 { h: 'The coalesce(1) trap', html:
   '<p><code>coalesce(1)</code> before a write is the common way to produce a single output file, and it has a consequence people miss: because coalesce is narrow, it does not just merge at the end \u2014 <strong>it reduces the parallelism of the whole preceding stage to one task</strong>. Heavy transformations upstream now run single-threaded.</p>' +
   '<div class="pre code">df.transform_heavy().coalesce(1).write...    <u>the heavy work runs on ONE task</u>\ndf.transform_heavy().repartition(1).write... <i>heavy work stays parallel; one shuffle at the end</i></div>' +
   '<p>Counter-intuitively, the more expensive operation is the faster job. That trade-off is a genuinely good interview answer.</p>' },
 { h: 'repartition by column', html:
   '<p><code>repartition(n, "key")</code> hash-partitions on the key, so rows sharing a key land together. Doing this before a join or window on the same key can let Spark skip a later shuffle \u2014 but only if the partitioning survives, and any operation that redistributes will discard it. Measure rather than assume.</p>' }
],
call: '"repartition is a full shuffle that balances and can go up or down; coalesce merges adjacent partitions locally, only reduces, and inherits any imbalance. Before writing after heavy work I use repartition(1) rather than coalesce(1), because coalesce would collapse the whole upstream stage to a single task."',
warn: 'coalesce(1) after expensive transformations makes the entire preceding stage single-threaded, because narrow operations fuse into the same stage. The job gets dramatically slower and the plan looks fine.',
qf: [
 ['repartition vs coalesce?', 'repartition shuffles, balances, and can increase or decrease. coalesce merges locally, only decreases, and inherits imbalance.'],
 ['Which is cheaper?', 'coalesce — no network movement.'],
 ['Can coalesce fix skew?', 'No. Only a real shuffle redistributes rows.'],
 ['Why is coalesce(1) risky before a write?', 'It reduces the whole preceding stage to one task, so upstream work runs single-threaded.'],
 ['When would you repartition by column?', 'Before a join or window on the same key, so the rows are already co-located.'],
 ['What does repartition(n) with no column do?', 'A round-robin shuffle producing evenly sized partitions.']
]});
